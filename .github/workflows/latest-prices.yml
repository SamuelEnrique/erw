# Energy Research Warehouse (ERW): the 15-minute latest-prices loop (session 10).
#
# Runs only warehouse/connectors/latest_prices.py: the newest real-time interval
# for each ISO hub and zone already in the ERW, upserted into Supabase's
# latest_prices table (one row per entity and variable). No completeness rule and
# no commit: nothing here writes to git or to Redivis. A missing ISO is logged and
# skipped; the job fails only if no ISO returned a price or the upsert failed.
#
# GitHub runs scheduled workflows on a best-effort basis; a 15-minute cron can
# start late or be skipped under load. The site shows each row's ts_utc and
# retrieved_at, so a late run is visible, never hidden.
name: latest prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Session 61: no longer cancel-in-progress. GitHub's schedule and the database's dispatch (migration 015) both start this
# job; a second start cancelled the first (run 36958084400). Now the second waits, and warehouse/health.py dedupe skips it.
concurrency:
  group: latest-prices
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Session 14: fail first, naming any missing secret, before doing any work.
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository secret::$name is empty or not set (Settings, Secrets and variables, Actions, Repository secrets)"
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing. Nothing was run."
            exit 1
          fi
          echo "Both required secrets are set."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Session 61 (warehouse/health.py): a duplicate start is a success with its reason; a failure retries once and is
      # recorded in erw_health and the day's health summary, and the job stays green, so GitHub sends no email.
      - name: Skip a duplicate start
        id: dedupe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python warehouse/health.py dedupe --workflow-file latest-prices.yml --minutes 15

      - name: Latest real-time prices to Supabase
        if: steps.dedupe.outputs.skip != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/health.py run --step "latest prices" --wait 30 -- python warehouse/connectors/latest_prices.py
