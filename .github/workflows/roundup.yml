# The Energy Roundup, the weekly brief of the Energy Research Warehouse (ERW), platform tool 14,
# and Automated Analysis (tool 26), which picks its chart of the week.
#
# Session 17 built this as "Energy Week" (weekly-brief.yml, Mondays 13:00 UTC). Session 23 renamed
# it the Energy Roundup and moved it to Sundays at 23:00 UTC (4 PM Pacific): it covers Monday to
# that Sunday evening, opens with the weekend's stories (the daily digest is written Monday to
# Friday only), and is sent the same evening.
#
# Steps:
#   1. restore the rolling-window tables from the Redivis draft (the runner has no tables; they are
#      not in git, session 9) and pull the EIA fuel spot prices (a full-history table, small);
#   2. run every Automated Analysis template and pick the chart of the week
#      (warehouse/analysis/run.py, docs/analysis/YYYY-Www/); a template whose inputs are not on the
#      runner is skipped and named in the week's run file;
#   3. write the Roundup (warehouse/news/roundup.py, docs/roundup/YYYY-Www.md and latest.md);
#   4. commit docs/roundup and docs/analysis to main and push, so the chart the email embeds is on
#      GitHub before the email goes out (the email links the image on raw.githubusercontent.com);
#   5. render and send the email (warehouse/news/email_digest.py --roundup; sent only with the Resend
#      secrets), then commit the rendered copy in docs/digest/email/.
# The commit step is the daily run's: set the changes aside, pull main with rebase, restore them,
# commit only if something changed (session 16). Nothing publishes to Redivis.
name: energy roundup

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      once:
        description: "Skip if a run already succeeded today, UTC (1, the outside scheduler) or run anyway (0)"
        required: false
        default: "0"

permissions:
  contents: write  # session 61: no issues: a failure is a row of the day's health summary
  actions: read  # session 58: the gate reads this workflow's runs

concurrency:
  group: energy-roundup
  cancel-in-progress: false

jobs:
  # Session 58: GitHub's scheduler runs this workflow late, or not at all, so an outside scheduler may dispatch it on
  # time (docs/runbook.md, "An outside trigger"). Two triggers on one day would write and send the Roundup twice: a scheduled run, or a
  # dispatch with once=1 (what the outside scheduler sends), stops here when a run of this workflow already succeeded
  # that UTC day. A manual run (once left at 0) always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # Session 61: with once=1 (the schedule, the database's dispatch) the Roundup runs on its day only: Sunday (UTC), or
      # Monday before 03:00 for a late start; and not when a run already succeeded today.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONCE: ${{ github.event_name == 'schedule' || github.event.inputs.once == '1' }}
        run: |
          if [ "$ONCE" != "true" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F); dow=$(date -u +%u); hour=$(date -u +%H)
          if [ "$dow" != "7" ] && ! { [ "$dow" = "1" ] && [ "$hour" -lt 3 ]; }; then
            reason="not the Roundup's day: it is $(date -u +%A) $today (UTC); the Roundup is written on Sundays"
            echo "$reason"; echo "run=0" >> "$GITHUB_OUTPUT"; echo "reason=$reason" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/roundup.yml/runs?status=success&created=%3E%3D${today}" --jq '.total_count')
          if [ "$n" -gt 0 ]; then
            reason="the week's work is done: a run of roundup.yml already succeeded today ($today, $n)"
            echo "$reason"; echo "run=0" >> "$GITHUB_OUTPUT"; echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
  # Session 61: a gate's "nothing to do" is recorded as a skip with its reason (warehouse/health.py, erw_health).
  note-skip:
    needs: gate
    if: needs.gate.outputs.run != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record the skip
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          python -m pip install --quiet requests==2.32.3
          python warehouse/health.py record --step gate --status skipped --reason "$REASON"
  roundup:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Session 61: the Roundup writes warehouse tables (the fuel prices, the analysis, the cost ledger), so it takes the
      # data lock like the daily job (since session 59 every data writer refuses without it, so this job would have failed
      # on its first Sunday); a lock still held after an hour is a skip with its reason.
      - name: Take the data lock
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/health.py run --step "data lock" -- python warehouse/lock.py acquire --task "energy roundup ${{ github.run_id }}" --minutes 90 --wait 60 --github-env

      # Session 119: on Sunday 4 October 2026 the Roundup went out at 23:05 UTC and the run then failed on a git step
      # (below). The gate above asks whether a run succeeded today, so GitHub's own schedule started a second run at
      # 01:23, which wrote the whole Roundup again (the model paid twice) before the send guard refused its email. A
      # scheduled start now asks the guard's own table first: a Roundup already sent is a skip with its reason, and
      # nothing below runs but the release of the lock. A person's run (once left at 0) writes again as before; the
      # guard still refuses a second email.
      - name: Was this week's Roundup already sent
        id: sent
        if: env.ERW_LOCK_TOKEN != '' && (github.event_name == 'schedule' || github.event.inputs.once == '1')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/health.py run --step "already sent" --retries 0 -- python warehouse/news/email_digest.py --roundup --sent-check

      - name: Restore tables, pull fuel prices, run the analysis, write the Roundup
        id: main
        if: env.ERW_LOCK_TOKEN != '' && steps.sent.outputs.status != 'skipped'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          REDIVIS_OWNER: ${{ secrets.REDIVIS_OWNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # not retried: it spends on the model (warehouse/news/roundup.py); its pulls retry their own requests
        # Session 119: the chart of the week now draws on the watch list (warehouse/analysis/watch.py), whose tables are
        # mostly not rolling-window tables, so the restore above does not bring them. scripts/sync.py restores the ones
        # the lines read (warehouse/analysis/watch.py --tables prints them as one pattern); a table it cannot restore is
        # said and its line is skipped and named by the engine, as a template is. It never stops the Roundup.
        # Session 170: the restore brought only the watch list's tables, so the templates' histories were truncated on
        # the runner. The tables the findings read (warehouse/analysis/findings/run_finding.py --tables: the ERCOT and
        # ISO-NE histories, the fleet, the load, the fuel prices, Berkeley Lab's queue) are restored by the same step,
        # and a table that cannot be restored is said in the same way. It never stops the Roundup.
        # Session 173: the templates' own tables are restored the same way (warehouse/analysis/run.py --tables prints
        # them as one pattern): eight of them the Redivis restore brings, two are in git, and portwatch_chokepoint_transits
        # was brought by neither, so its template was skipped on the runner. A table that cannot be restored is said and
        # its template is skipped and named by the engine. It never stops the Roundup.
        run: |
          python warehouse/health.py run --step "write the Roundup" --retries 0 -- bash -c "set -o pipefail; { python warehouse/redivis/upload.py --restore && { python scripts/sync.py --no-git --tables \"$(python warehouse/analysis/watch.py --tables)\" || echo 'the watch list, not every table could be restored, so the lines that read a missing table are skipped and named'; } && { python scripts/sync.py --no-git --tables \"$(python warehouse/analysis/findings/run_finding.py --tables)\" || echo 'the findings, not every table could be restored, so a finding that reads a missing table is not computed and named'; } && { python scripts/sync.py --no-git --tables \"$(python warehouse/analysis/run.py --tables)\" || echo 'the templates, not every table could be restored, so a template that reads a missing table is skipped and named'; } && python warehouse/connectors/eia_fuels.py && python warehouse/analysis/run.py && python warehouse/news/roundup.py; } 2>&1 | tee roundup.log"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-roundup-log
          path: |
            roundup.log
            runs/
          retention-days: 90

      - name: Commit the Roundup and the analysis
        id: commit
        if: steps.main.outputs.status == 'ok' || steps.main.outputs.status == 'retried'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked --quiet -m "energy roundup" || true
          git pull --rebase origin main
          if git stash list | grep -q "energy roundup"; then
            if ! git stash pop --quiet; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                echo "::error::git stash pop failed without a conflict to resolve"
                git status
                exit 1
              fi
              git checkout --theirs -- $conflicted
              git reset --quiet
              git stash drop --quiet
            fi
          fi
          git reset --quiet
          git add -- docs/roundup docs/analysis
          if git diff --cached --quiet; then
            echo "No Roundup or analysis file changed; nothing to commit."
            exit 0
          fi
          git commit -m "Energy Roundup $(ls docs/roundup | grep -E '^[0-9]{4}-W[0-9]{2}\.md$' | sort | tail -1 | sed 's/\.md$//')" \
                     -m "Automated run of .github/workflows/roundup.yml (warehouse/analysis/run.py, warehouse/news/roundup.py)."
          git push origin HEAD:main

      - name: Send the Roundup by email
        if: steps.commit.outcome == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          EMAIL_SUBSCRIBERS: "1"
        run: |
          set -o pipefail
          # not retried: a second try could send twice
          python warehouse/health.py run --step "send the Roundup" --retries 0 -- bash -c "set -o pipefail; python warehouse/news/email_digest.py --roundup 2>&1 | tee -a roundup.log"
          # Session 119: the rendered copy is bookkeeping, and by now the email is out. It is committed by a script that
          # sets the run's other changes aside before it pulls (on 4 October 2026 this step ran "git pull --rebase" with
          # the restored tables' metadata still modified: "cannot pull with rebase: You have unstaged changes", exit
          # 128, and the run failed after its email had been delivered). It runs under health.py, so a failure here is
          # a row of erw_health and of the day's summary, and never the run's.
          python warehouse/health.py run --step "commit the rendered email" --retries 0 -- bash warehouse/news/commit_paths.sh "Energy Roundup email rendered" "Automated run of .github/workflows/roundup.yml (warehouse/news/email_digest.py --roundup)." docs/digest/email

      # Session 30 (B4): the shadow Roundup from the Haiku shadow scores, to the shadow recipient only, subject
      # "SHADOW HAIKU". Never fails the Roundup. Delete SHADOW_MODEL to stop it; it stops by itself on the expiry in
      # warehouse/config/shadow.yaml.
      - name: Shadow Roundup (Haiku scores, one address)
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHADOW_MODEL: claude-haiku-4-5
          SHADOW_RECIPIENT: ${{ secrets.SHADOW_RECIPIENT }}
        run: python warehouse/news/shadow.py roundup 2>&1 | tee -a roundup.log

      # Session 30 (B1): this workflow's model calls are rows of the cost ledger (warehouse/llm.py); archive, load
      # and upload that one internal table, so the daily run restores it with them
      - name: Keep the cost ledger
        if: always() && env.ERW_LOCK_TOKEN != ''
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          REDIVIS_OWNER: ${{ secrets.REDIVIS_OWNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Session 119: the Roundup's model calls add rows to the ledger, so coverage.csv, which came with the checkout, no
        # longer describes it, and since session 65 the loader refuses a table coverage does not describe ("coverage says
        # 1110 rows, the file holds 1113", 4 October 2026: the load failed, the upload after it never ran, and the three
        # rows reached the archive only). Coverage's one row is rebuilt first (build_coverage.py --only: every other row
        # is carried over word for word). Each of the four is its own step of erw_health: one that fails is recorded and
        # the next still runs, so a refused load no longer costs the Redivis draft its rows.
        run: |
          if [ -f warehouse/output/api_cost_ledger.csv ]; then
            python warehouse/health.py run --step "ledger: coverage row" --retries 0 -- python warehouse/metadata/build_coverage.py --only '^api_cost_ledger$'
            python warehouse/health.py run --step "ledger: archive" -- python warehouse/archive/archive.py write --tables '^api_cost_ledger$'
            python warehouse/health.py run --step "ledger: live set" -- python warehouse/supabase/load.py --only '^api_cost_ledger$' --no-vacuum
            python warehouse/health.py run --step "ledger: Redivis draft" -- python warehouse/redivis/upload.py api_cost_ledger
          fi

      - name: Release the data lock
        if: always() && env.ERW_LOCK_TOKEN != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/lock.py release

      # Session 119: no job fails on GitHub (session 61), so GitHub emails nobody, and the health summary is written the
      # day after. A failed step of this run is now one line by email the same day, to the fixed recipients only
      # (warehouse/health.py alert); a run with no failed step sends nothing. It cannot fail the job.
      - name: Tell a person what failed in this run
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python warehouse/health.py alert --run-id "${{ github.run_id }}"
