# The Energy Roundup, the weekly brief of the Energy Research Warehouse (ERW), platform tool 14,
# and Automated Analysis (tool 26), which picks its chart of the week.
#
# Session 17 built this as "Energy Week" (weekly-brief.yml, Mondays 13:00 UTC). Session 23 renamed
# it the Energy Roundup and moved it to Sundays at 23:00 UTC (4 PM Pacific): it covers Monday to
# that Sunday evening, opens with the weekend's stories (the daily digest is written Monday to
# Friday only), and is sent the same evening.
#
# Steps:
#   1. restore the rolling-window tables from the Redivis draft (the runner has no tables; they are
#      not in git, session 9) and pull the EIA fuel spot prices (a full-history table, small);
#   2. run every Automated Analysis template and pick the chart of the week
#      (warehouse/analysis/run.py, docs/analysis/YYYY-Www/); a template whose inputs are not on the
#      runner is skipped and named in the week's run file;
#   3. write the Roundup (warehouse/news/roundup.py, docs/roundup/YYYY-Www.md and latest.md);
#   4. commit docs/roundup and docs/analysis to main and push, so the chart the email embeds is on
#      GitHub before the email goes out (the email links the image on raw.githubusercontent.com);
#   5. render and send the email (warehouse/news/email_digest.py --roundup; sent only with the Resend
#      secrets), then commit the rendered copy in docs/digest/email/.
# The commit step is the daily run's: set the changes aside, pull main with rebase, restore them,
# commit only if something changed (session 16). Nothing publishes to Redivis.
name: energy roundup

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      once:
        description: "Skip if a run already succeeded today, UTC (1, the outside scheduler) or run anyway (0)"
        required: false
        default: "0"

permissions:
  contents: write
  issues: write
  actions: read  # session 58: the gate reads this workflow's runs

concurrency:
  group: energy-roundup
  cancel-in-progress: false

jobs:
  # Session 58: GitHub's scheduler runs this workflow late, or not at all, so an outside scheduler may dispatch it on
  # time (docs/runbook.md, "An outside trigger"). Two triggers on one day would write and send the Roundup twice: a scheduled run, or a
  # dispatch with once=1 (what the outside scheduler sends), stops here when a run of this workflow already succeeded
  # that UTC day. A manual run (once left at 0) always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONCE: ${{ github.event_name == 'schedule' || github.event.inputs.once == '1' }}
        run: |
          if [ "$ONCE" != "true" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/roundup.yml/runs?status=success&created=%3E%3D${today}" --jq '.total_count')
          if [ "$n" -gt 0 ]; then
            echo "a run of roundup.yml already succeeded today ($today, $n): nothing to do"
            echo "run=0" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
  roundup:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore tables, pull fuel prices, run the analysis, write the Roundup
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          REDIVIS_OWNER: ${{ secrets.REDIVIS_OWNER }}
        run: |
          set -o pipefail
          {
            python warehouse/redivis/upload.py --restore
            python warehouse/connectors/eia_fuels.py
            python warehouse/analysis/run.py
            python warehouse/news/roundup.py
          } 2>&1 | tee roundup.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-roundup-log
          path: |
            roundup.log
            runs/
          retention-days: 90

      - name: Commit the Roundup and the analysis
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked --quiet -m "energy roundup" || true
          git pull --rebase origin main
          if git stash list | grep -q "energy roundup"; then
            if ! git stash pop --quiet; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                echo "::error::git stash pop failed without a conflict to resolve"
                git status
                exit 1
              fi
              git checkout --theirs -- $conflicted
              git reset --quiet
              git stash drop --quiet
            fi
          fi
          git reset --quiet
          git add -- docs/roundup docs/analysis
          if git diff --cached --quiet; then
            echo "No Roundup or analysis file changed; nothing to commit."
            exit 0
          fi
          git commit -m "Energy Roundup $(ls docs/roundup | grep -E '^[0-9]{4}-W[0-9]{2}\.md$' | sort | tail -1 | sed 's/\.md$//')" \
                     -m "Automated run of .github/workflows/roundup.yml (warehouse/analysis/run.py, warehouse/news/roundup.py)."
          git push origin HEAD:main

      - name: Send the Roundup by email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          EMAIL_SUBSCRIBERS: "1"
        run: |
          set -o pipefail
          python warehouse/news/email_digest.py --roundup 2>&1 | tee -a roundup.log
          git add -- docs/digest/email
          if ! git diff --cached --quiet; then
            git commit -m "Energy Roundup email rendered" -m "Automated run of .github/workflows/roundup.yml (warehouse/news/email_digest.py --roundup)."
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Session 30 (B4): the shadow Roundup from the Haiku shadow scores, to the shadow recipient only, subject
      # "SHADOW HAIKU". Never fails the Roundup. Delete SHADOW_MODEL to stop it; it stops by itself on the expiry in
      # warehouse/config/shadow.yaml.
      - name: Shadow Roundup (Haiku scores, one address)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHADOW_MODEL: claude-haiku-4-5
          SHADOW_RECIPIENT: ${{ secrets.SHADOW_RECIPIENT }}
        run: python warehouse/news/shadow.py roundup 2>&1 | tee -a roundup.log

      # Session 30 (B1): this workflow's model calls are rows of the cost ledger (warehouse/llm.py); archive, load
      # and upload that one internal table, so the daily run restores it with them
      - name: Keep the cost ledger
        if: always()
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          REDIVIS_OWNER: ${{ secrets.REDIVIS_OWNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -f warehouse/output/api_cost_ledger.csv ]; then
            python warehouse/archive/archive.py write --tables '^api_cost_ledger$'
            python warehouse/supabase/load.py --only '^api_cost_ledger$' --no-vacuum
            python warehouse/redivis/upload.py api_cost_ledger
          fi

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The ERW Energy Roundup failed; see the run for what was committed and sent."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -c 30000 roundup.log 2>/dev/null || echo "(no log produced)"
            echo '```'
          } > issue.md
          gh issue create --title "ERW Energy Roundup $(date -u +%G-W%V) [FAILED]" --body-file issue.md
