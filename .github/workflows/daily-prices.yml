# Daily refresh of the Energy Research Warehouse (ERW) price tables.
#
# Modeled on the IRW's metadata-pipeline.yml (github.com/ben-domingue/irw):
# one scheduled job, the full log kept as an artifact, and an issue opened when
# the job fails. The steps themselves live in warehouse/run_daily.sh so a local
# run and this job cannot drift apart; this file adds only setup and the commit.
#
# What it does, every day at 14:00 UTC (and on manual dispatch):
#   1. runs the merge tests (tests/), so a broken idempotent write never runs
#   2. runs every ISO connector for the last 3 complete operating days. Each
#      market merges into its file in warehouse/output: new intervals are
#      appended, intervals already present for the same (entity, variable,
#      ts_utc) are replaced, nothing is duplicated. A market that is not
#      complete writes nothing and is named in the commit message.
#      Then the non-ISO connectors: EIA-930, EIA fuel spot prices, the EIA
#      petroleum, retail, stocks and LNG series, PJM capacity prices, CARB and
#      RGGI carbon auctions and FRED (session 7), each over its full history.
#      Session 8: EIA monthly crude, imports, PADD pipeline and retail
#      electricity series, IMF PortWatch transits, the EIA-860M generator
#      inventory (written only when EIA publishes a new month) and, on
#      Mondays, the ISO interconnection queues (entities snapshots).
#   3. runs erw_validate on every output. A blocked table fails the job and
#      nothing is committed.
#   4. regenerates docs/coverage.md and warehouse/metadata/coverage.csv, then
#      ingests and scores news and writes the Energy Digest (docs/digest/)
#   Session 28: after coverage, archives every table's new or changed rows to the private Supabase
#   storage bucket erw-archive (warehouse/archive/archive.py); the Redivis upload waits on it.
#   Session 10: first restores the rolling-window tables from the Redivis draft
#   (the runner has no tables); after coverage, loads the Supabase live set; last,
#   uploads the tables it changed to the Redivis draft (never released).
#   5. commits STATUS.md (session 14: tables, last runs, open gaps), metadata
#      (coverage, sources, run status), docs, the digests and
#      news_stories.csv (session 10 ruling 3) directly to main. Derived scripts
#      whose inputs are absent on the runner skip with a warning.
#      Session 16: the step first sets the run's changes aside, pulls main with
#      rebase, puts them back (this run's version wins a conflict) and commits only
#      when a tracked file changed. Run 3 failed at this step with exit 128. No other
#      outputs (session 9 ruling): the tables in
#      warehouse/output, their run logs and the raw source files stay out of
#      git; a hosted Postgres becomes the live store (warehouse/output/README.md).
#
# Why this commits to main directly, unlike the IRW's weekly pull request:
# the job only records what the ISOs published, the validator is the gate, and
# every row carries its own provenance. Nothing here publishes to Redivis; that
# stays a human action (CLAUDE.md).
#
# Python 3.12, not the 3.14 used locally: gridstatus 0.36.0 pins lxml~=5.3,
# which has wheels for 3.12, so requirements.txt installs as written.
name: daily prices

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    # Session 16: a manual run also pulls the ISO interconnection queues (weekly, Mondays, on
    # the schedule), so the project map (energy_projects) can be rebuilt on any day.
    inputs:
      queues:
        description: "Also pull the ISO interconnection queues (1) or not (0)"
        required: false
        default: "1"
      once:
        description: "Skip if a run already succeeded today, UTC (1, the outside scheduler) or run anyway (0)"
        required: false
        default: "0"
      # Session 114: the monthly job (warehouse/run_monthly.sh: the six builders that were run by hand) runs with the
      # first daily run on or after the third day of each month; a manual run can start it on any day.
      monthly:
        description: "Also run the monthly builds, warehouse/run_monthly.sh (1) or only when the month's are due (0)"
        required: false
        default: "0"

permissions:
  contents: write  # session 61: no issues: the failure issues became rows of the day's health summary
  actions: read  # session 58: the gate reads this workflow's runs

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  # Session 58: GitHub's scheduler runs this workflow late, or not at all, so an outside scheduler may dispatch it on
  # time (docs/runbook.md, "An outside trigger"). Two triggers on one day would pull, load and send the digest twice: a scheduled run, or a
  # dispatch with once=1 (what the outside scheduler sends), stops here when a run of this workflow already succeeded
  # that UTC day. A manual run (once left at 0) always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # Session 61: the day's work is done when a run succeeded today OR today's "Daily prices <day>" commit is on main:
      # the run of 2026-10-01 22:48 UTC committed and sent 2026-10-02's digest after midnight, then failed in its package
      # tests, and a second run that day would have sent a second digest.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONCE: ${{ github.event_name == 'schedule' || github.event.inputs.once == '1' }}
        run: |
          if [ "$ONCE" != "true" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-prices.yml/runs?status=success&created=%3E%3D${today}" --jq '.total_count')
          c=$(gh api "repos/${{ github.repository }}/commits?sha=main&since=${today}T00:00:00Z&per_page=100" --jq "[.[] | select(.commit.message | startswith(\"Daily prices ${today}\"))] | length")
          if [ "$n" -gt 0 ] || [ "${c:-0}" -gt 0 ]; then
            reason="the day's work is done: $n successful runs today ($today) and $c 'Daily prices $today' commits on main"
            echo "$reason"
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
  # Session 61: a gate's "nothing to do" is recorded as a skip with its reason (warehouse/health.py, erw_health).
  note-skip:
    needs: gate
    if: needs.gate.outputs.run != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record the skip
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          python -m pip install --quiet requests==2.32.3
          python warehouse/health.py record --step gate --status skipped --reason "$REASON"
  refresh:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    # SPP serves large files slowly; a day without its daily file is read from
    # 288 interval files. Three days usually finish well inside this.
    timeout-minutes: 180
    steps:
      # Session 14: the first run on GitHub stopped 50 seconds in, at the Redivis restore,
      # because REDIVIS_OWNER (and SUPABASE_URL, SUPABASE_SERVICE_KEY) were empty. Check
      # every secret the run needs before doing any work, and name each missing one.
      # PJM_API_KEY is not required: no step uses it yet (PJM prices need it later).
      - name: Check required secrets
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          REDIVIS_OWNER: ${{ secrets.REDIVIS_OWNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=""
          for name in EIA_API_KEY ANTHROPIC_API_KEY REDIVIS_API_TOKEN REDIVIS_OWNER SUPABASE_URL SUPABASE_SERVICE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository secret::$name is empty or not set (Settings, Secrets and variables, Actions, Repository secrets)"
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing. Nothing was run."
            exit 1
          fi
          echo "All 6 required secrets are set."

      # Session 16: full history, so the commit step can pull with rebase onto a moved main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Session 61: every step below runs under warehouse/health.py: a skip is a success with its reason, a real failure
      # retries once (not the daily run itself, which spends and sends: its connectors retry their own requests) and goes
      # into the day's health summary, and the job stays green, so GitHub sends no email.
      - name: Merge tests
        id: tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/health.py run --step "merge tests" -- python -m unittest discover -s tests -v

      # Session 59: the data lock (warehouse/lock.py, docs/machines.md). A data machine may be writing the warehouse; the
      # run waits up to 60 minutes for it, then stops. The lock lasts 200 minutes, longer than the job's 180, and is
      # released after the commit below, whatever happened.
      - name: Take the data lock
        if: steps.tests.outputs.status == 'ok' || steps.tests.outputs.status == 'retried'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/health.py run --step "data lock" -- python warehouse/lock.py acquire --task "daily run ${{ github.run_id }}" --minutes 200 --wait 60 --github-env

      - name: Pull, validate, rebuild coverage
        id: daily
        if: env.ERW_LOCK_TOKEN != ''
        env:
          PYTHON: python
          DAYS: "3"
          # API keys come from repository secrets of the same names as the local
          # .env; they are never echoed, and every connector redacts them from
          # logs, stored URLs and raw file names.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
          # Session 10: Redivis (store of record, draft only) and Supabase (live set)
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          REDIVIS_OWNER: ${{ secrets.REDIVIS_OWNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Session 29: the loader vacuums after every load (session 45: a plain VACUUM (ANALYZE), no FULL) through a direct Postgres connection; while this
          # secret is unset the vacuum is skipped with a warning (warehouse/supabase/load.py)
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Session 19: the email digest (warehouse/news/email_digest.py); unset means render only, no send
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Session 23: send to confirmed subscribers too (double opt-in, migration 007), each email with its signed
          # unsubscribe link; without EMAIL_TOKEN_SECRET the subscribers are left out and only DIGEST_RECIPIENTS get it
          EMAIL_SUBSCRIBERS: "1"
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          # Session 30 (B4): the Haiku shadow scorer and its shadow Digest (warehouse/news/shadow.py). Delete this line
          # (unset SHADOW_MODEL) to stop it at once; it also stops by itself on the expiry in warehouse/config/shadow.yaml.
          # The shadow issues go to SHADOW_RECIPIENT if that secret exists, else to DIGEST_RECIPIENTS; never subscribers.
          SHADOW_MODEL: claude-haiku-4-5
          SHADOW_RECIPIENT: ${{ secrets.SHADOW_RECIPIENT }}
          # the runner has no tables (not in git): restore the rolling windows first
          RESTORE_FROM_REDIVIS: "1"
          # session 16: set on a manual run (input queues, default 1); empty on the schedule
          QUEUES: ${{ github.event.inputs.queues || '0' }}
          # session 114: the monthly builds on any day of a manual run (input monthly); otherwise when the month's are due
          MONTHLY: ${{ github.event.inputs.monthly || '0' }}
        run: python warehouse/health.py run --step "daily run" --retries 0 -- bash -c "set -o pipefail; bash warehouse/run_daily.sh 2>&1 | tee daily.log"

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-prices-log
          path: |
            daily.log
            runs/
          retention-days: 90

      - name: Commit metadata, docs and digests (never outputs)
        id: commit
        if: steps.daily.outputs.status == 'ok' || steps.daily.outputs.status == 'retried'
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          ok="$(awk '$2=="ok"{print $1}' runs/daily_status.txt | tr '\n' ' ' | sed 's/ $//')"
          failed="$(grep ' failed' runs/daily_status.txt | sed 's/ failed: /: /' | paste -sd ';' - | sed 's/;/; /g' || true)"
          {
            echo "### ERW daily prices, $date"
            echo
            echo '```'
            cat runs/daily_status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::warning::markets not written today: $failed"
          fi
          # Session 9 ruling: metadata, docs and digests only; never warehouse/output
          # (tables, run logs) or warehouse/raw/. Session 10 ruling 3: the one exception is
          # warehouse/output/news_stories.csv, kept in git so the next run does not
          # re-ingest and re-score stories it already has. Session 16: news_index.csv is
          # tracked too and was missing here, which left it modified after the commit.
          paths=(STATUS.md docs/coverage.md docs/digest warehouse/metadata/coverage.csv
                 warehouse/metadata/run_status.csv warehouse/metadata/sources.csv
                 warehouse/metadata/redivis_uploads.csv warehouse/metadata/ercot_dam_esr_missing_days.csv warehouse/output/news_stories.csv
                 warehouse/output/news_index.csv warehouse/output/energy_deals.csv
                 warehouse/output/energy_deals_evidence.csv warehouse/deals/checked.csv
                 warehouse/datacenters/checked.csv warehouse/output/datacenter_projects.csv
                 warehouse/output/datacenter_projects_evidence.csv
                 warehouse/output/datacenter_operator_sites.csv
                 warehouse/output/datacenter_queue_positions.csv
                 warehouse/output/datacenter_facilities.csv
                 warehouse/news/facts
                 warehouse/policy/scores.csv warehouse/policy/read_done.csv
                 warehouse/output/energy_companies.csv
                 warehouse/metadata/archive_manifest.csv
                 site/data/grid_network.json
                 site/public/network/daily_index.json site/data/mix site/data/price_compare.json
                 site/data/demand_growth.json site/data/curtailment_profile.json site/data/map_v2.json
                 site/data/large_load_status.json
                 site/data/board.json site/public/board
                 site/data/supply.json warehouse/metadata/release_schedule.json
                 site/data/datacenter site/data/nyiso_load_queue.json site/data/curtailment/ercot.json)
          # session 138: the files of "What a datacenter pays" (/cost-of-power, in review), rebuilt on Saturdays
          # session 140: New York's load queue for the same page, refreshed with the queues on Mondays
          # 6 October 2026: the price board's files (daily) and Supply and trade's (Saturdays), both pages in review
          # session 114: the network's replay, rebuilt by the daily run: the index (above) and the years' files
          for f in site/public/network/daily_2*.json; do paths+=("$f"); done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Session 16: run 3 (36284122117) failed here with exit 128. It committed, then ran
          # git pull --rebase with news_index.csv still modified ("cannot pull with rebase: You
          # have unstaged changes"). Now: set this run's changes aside, bring main up to date
          # with rebase, put the changes back, and only then commit. When main moved and a
          # file conflicts, this run's version is kept: it was built from the newer data.
          # Session 29 ruling: sources.csv is regenerated after the pull, never before. Keeping this run's copy
          # of a file main also changed dropped a source a session had added (2026-09-28); the registry only
          # grows, so it is rebuilt from both copies below, after the pull.
          mkdir -p runs && cp warehouse/metadata/sources.csv runs/sources_run.csv
          git stash push --include-untracked --quiet -m "daily run $date" || true
          git pull --rebase origin main
          git show HEAD:warehouse/metadata/sources.csv > runs/sources_main.csv
          if git stash list | grep -q "daily run $date"; then
            if ! git stash pop --quiet; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                echo "::error::git stash pop failed without a conflict to resolve; the run's files are in the stash"
                git status
                exit 1
              fi
              echo "::warning::main changed these files while the job ran; keeping this run's version: $conflicted"
              git checkout --theirs -- $conflicted
              git reset --quiet
              git stash drop --quiet
            fi
          fi
          git reset --quiet
          python warehouse/metadata/merge_sources.py runs/sources_main.csv runs/sources_run.csv             --out warehouse/metadata/sources.csv
          for p in "${paths[@]}"; do
            [ -e "$p" ] && git add -- "$p"
          done
          if git diff --cached --quiet; then
            echo "No tracked file changed today; nothing to commit."
            exit 0
          fi
          git commit -m "Daily prices $date: ok: ${ok:-none}; failed: ${failed:-none}"                      -m "Automated run of .github/workflows/daily-prices.yml. Metadata, docs and digests only; the tables stay out of git (session 9). All tables passed erw_validate."
          git push origin HEAD:main

      - name: Release the data lock
        if: always() && env.ERW_LOCK_TOKEN != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/lock.py release

      # Session 61: a market failing three scheduled runs in a row was an issue (an email); now a failure row of the day's
      # health summary, once a day while the streak lasts.
      - name: Record markets failing three daily runs in a row
        if: steps.commit.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -uo pipefail
          python warehouse/metadata/run_status.py streaks --n 3 --runner github --out runs/failure_streaks_github.txt || exit 0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            python warehouse/health.py record --step "3-run failure streak" --status failed --reason "$line"
          done < runs/failure_streaks_github.txt

      - name: Package tests (erw client against this run's tables)
        # Session 29 ruling (prompt, Part A 4): the erw package tests are a required step. They run last, on the
        # tables this run produced, so a failure fails the job after the day's metadata is committed. Tables the
        # runner never holds (the ERCOT yearly history, the peak premium computed from it) are skipped by the tests.
        # No package test calls the Anthropic API; one that ever does must skip where ANTHROPIC_API_KEY is unset.
        # Session 33: a slow test fails the step visibly after 20 minutes instead of holding the run; tables over 200,000
        # rows are tested by partition, never whole.
        if: steps.commit.outcome == 'success'
        timeout-minutes: 45
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pip install -e package
          ANTHROPIC_API_KEY= python warehouse/health.py run --step "package tests" -- python -m pytest -q package/tests/test_erw.py -p no:cacheprovider

      # Session 61: the one daily health summary (warehouse/health.py summary): yesterday's (UTC) steps of every scheduled
      # job from erw_health, committed as queue/summary/<day>-health.md. It runs even when the rest of this job did not.
      - name: Write yesterday's health summary
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -uo pipefail
          day="$(date -u -d yesterday +%F)"
          python warehouse/health.py summary --day "$day" || { echo "::warning::no health summary for $day"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked --quiet -m "health summary" || true
          for i in 1 2 3; do
            git pull --quiet --rebase origin main || true
            git stash list | grep -q "health summary" && git stash pop --quiet || true
            git add -- "queue/summary/$day-health.md"
            git diff --cached --quiet && { echo "the health summary for $day is unchanged"; exit 0; }
            git commit --quiet -m "Health summary $day (warehouse/health.py)" -m "Automated run of .github/workflows/daily-prices.yml."
            git push --quiet origin HEAD:main && exit 0
            git reset --quiet --soft HEAD~1
            git stash push --include-untracked --quiet -m "health summary" || true
            sleep 10
          done
          echo "::warning::the health summary for $day could not be pushed after three tries"

      # Session 119: no job fails on GitHub (session 61), so GitHub emails nobody, and the health summary is written the
      # day after. A failed step of this run is now one line by email the same day, to the fixed recipients only
      # (warehouse/health.py alert); a run with no failed step sends nothing. It cannot fail the job.
      - name: Tell a person what failed in this run
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python warehouse/health.py alert --run-id "${{ github.run_id }}"
