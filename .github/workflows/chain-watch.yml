# Energy Research Warehouse (ERW): the chain watch (session 91; docs/machines.md, "Alerts").
#
# Every 15 minutes: is a chain of unattended sessions marked as running (the row "chain" of erw_locks, written by
# python scripts/alert.py chain start), and has it saved anything in the last 30 minutes? If it has not, one line by
# email to the fixed recipients, once at 30 minutes and again every hour after. The check runs here and not on the
# machine that runs the chain, because the usual reason a chain stops saving is that its machine closed, slept or crashed.
#
# A save (session 116; until then only a push to a wip/ or task/ branch, so a landing read as silence): a commit on
# any branch, main included, that a scheduled workflow did not write (github-actions[bot] is not the chain); the
# workflow's merge of a task/ branch into main, which is the chain's own landing; or a beat, which the git hooks in
# scripts/githooks/ send at each commit and each push on the chain's machine.
#
# No chain marked: the run says so and ends. Like every scheduled job since session 61 it never fails on GitHub: its
# step runs under warehouse/health.py, which records the outcome in erw_health. It reads git and the mark; it writes
# nothing to the warehouse, to git or to Redivis, and takes no lock.
#
# Session 188, the idle alarm (docs/machines.md, "Continuous work"): the same run then asks the question per machine.
# A machine is on duty from its precheck (python scripts/precheck.py) until it declares idle (python
# scripts/chain_queue.py next, with queue/next/ empty) or signs off (python scripts/duty.py off): one row,
# duty:<machine>, of erw_locks, renewed by the git hooks at each commit and each push made on that machine and by
# python scripts/duty.py beat. A machine on duty that has run nothing for 30 minutes gets one line by email, once at 30
# minutes and again every hour after, as the chain does. No machine on duty: the step says so and ends. It is a second
# step of this job, not a workflow of its own, so the schedule in the database (migration 022) and the duplicate-start
# rule are the ones already here; it runs under warehouse/health.py and never fails the job.
#
# Session 243, the email rule (the owner's ruling of 12 October 2026; docs/machines.md, "The email rule"). It replaces
# what is said above and below about what is emailed. This job sends two emails and no other: one for a machine, 15
# minutes after it went idle, saying it is ready for review (the step "ready for review", python scripts/alert.py
# ready); and one a UTC day when the daily run is red (the step "new failures", python scripts/alert.py failures).
# The chain watch, the idle alarm and the morning summary still run and still record in erw_health and in this job's
# log; they are no longer given the key that sends (RESEND_API_KEY), so they cannot email.
name: chain watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chain-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --quiet requests==2.32.3
      # GitHub's own schedule and the database's dispatch (migration 022) both start this job: the second start is skipped
      - name: Skip a duplicate start
        id: dedupe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python warehouse/health.py dedupe --workflow-file chain-watch.yml --minutes 15
      - name: Has a marked chain saved anything in 30 minutes
        if: steps.dedupe.outputs.skip != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python warehouse/health.py run --step "chain watch" -- python scripts/alert.py chain check
      - name: Has a machine on duty run anything in 30 minutes
        if: steps.dedupe.outputs.skip != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python warehouse/health.py run --step "idle alarm" -- python scripts/duty.py check
      # Session 243, the email rule: a machine's one email. 15 minutes after a machine went idle (the row "idle" of
      # erw_health that python scripts/chain_queue.py next writes with nothing waiting, or a failed precheck), one line
      # says it is ready for review; not when the machine is on duty again by then. Not run a second time when it
      # fails (--retries 0): a second run could send a second email.
      - name: A machine that went idle 15 minutes ago is ready for review
        if: steps.dedupe.outputs.skip != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python warehouse/health.py run --step "ready for review" --retries 0 -- python scripts/alert.py ready
      # Session 202, the one alert policy (docs/machines.md, "One alert policy"). The two silences above are each said
      # once, not again every hour. Below: a step of any scheduled job newly recorded as failed in erw_health is one
      # email, once (a step that failed at its run before is the same failure; a retry that passed is not one); and the
      # morning summary, sent by the first run at or after 07:00 Pacific, once a day: the runs since the last morning,
      # one line each, green or red. A success sends nothing else. What was said is remembered as rows of erw_health
      # (workflow "alerts"), so a late or a doubled run neither loses a line nor repeats one. Neither step is run a
      # second time when it fails (--retries 0): a second run could send a second email.
      # Session 243: "new failures" records every newly failed step and emails once a UTC day, only when the daily run
      # is red; "morning summary" writes the summary into this log and emails nothing.
      - name: Record new failures; one email a day when the daily run is red
        if: steps.dedupe.outputs.skip != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python warehouse/health.py run --step "new failures" --retries 0 -- python scripts/alert.py failures
      - name: The morning summary, 07:00 Pacific, once a day, into this log
        if: steps.dedupe.outputs.skip != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python warehouse/health.py run --step "morning summary" --retries 0 -- python scripts/alert.py summary
