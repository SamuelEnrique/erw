# News feeds of the Energy Research Warehouse (ERW), read by warehouse/news/ingest.py.
#
# One entry per feed: name, url, sector, region, via.
#   sector: power, gas, oil, lng, nuclear, renewables, storage, transmission, datacenter,
#           policy, capital, general (the feed's beat; the model scores each story's own sector)
#   region: us or global
#   via:    direct               the outlet's own RSS or Atom feed
#           google_news_site     a Google News RSS search limited to the outlet's site, used
#                                because the outlet offers no working public feed
#           google_news_catchall a Google News RSS search of a paywalled outlet's energy desk
#   For Google News entries, the originating outlet is read from each item's <source>.
# Every URL was checked to return entries on 2026-09-25 (session 6); titles, summaries and
# links only are stored, never article bodies.

