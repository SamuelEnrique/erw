      pair's own median over its history (warehouse/derived/ba_supply.py, MADS and FLOOR; the same rule in
      ai_power_regions.py and network_daily.py). The count left out is in each replay file and printed on the page.
    open: >-
      The live /network page's hourly links are not screened: rule C is a rule for days. Settled in session 118:
      the supply table's count (2,732) and the replay's (1,072) count different things. The first is every
      report of every pair, both sides; 1,259 of them are between authorities the network draws, on 1,252
      pair-days; the replay uses one report a pair and day and counts a day only when the report it used is left
      out.
    recorded_in: >-
      sessions 62, 68 and 93; docs/methods/grid_network.md

