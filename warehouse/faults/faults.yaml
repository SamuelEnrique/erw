# Energy Research Warehouse (ERW): the register of known faults in source data (session 103).
#
# One entry per fault: something a publisher's data holds that is wrong, missing, shifted or impossible, as an ERW
# session found it. Not here: a gap that is only a late posting, a license ruling, or a fault of the ERW's own code.
# warehouse/derived/data_faults.py writes the table known_data_faults and the site's copy from this file.
#
# Every figure in `evidence` is one a session measured and wrote down (`recorded_in` says where), or one the screening
# rule measured on 2026-10-04 (runs/session103/impossible_hours.csv, built by runs/session103/before_after.py hours).
# Nothing is estimated. `first` and `last` are dates as recorded; `last` is empty when the fault continues, and
# `dates_note` says so when a day is not recorded. `status` is one of:
#   screened     the ERW leaves the faulty values out, by a stated rule, in every table named under screened_in
#   corrected    the ERW reads the values as they should have been, by a stated rule
#   worked_around the ERW reads another source for the period
#   held_as_published  the ERW holds the values as the publisher gave them and says so
# Session 118: every entry also says where the ERW's own work on it stands, `resolution`, with `resolution_reason`:
#   fixed              no ERW table or page shows or computes a wrong figure from it; where the fault is a gap, the gap
#                      is stated and nothing is filled
#   held_for_approval  the fix is built and waits for a person, because applying it moves a number on a live page
#   open               something is still to do or to rule on, or cannot be done from these data; the reason says which
# To add a fault: an entry here, then python warehouse/derived/data_faults.py --snapshot (docs/methods/known_data_faults.md).

faults:
  - id: eia930_ciso_generation_break
    title: >-
      EIA's California generation changed in one hour on 16 December 2025
    publisher: >-
      U.S. Energy Information Administration (EIA), Form EIA-930
    source: eia:gridmonitor/knownissues/xls
    first: "2025-12-16"
    last: ""
    dates_note: >-
      from the hour starting 2025-12-16T08:00:00Z (midnight Pacific), and continuing
    status: worked_around
    resolution: fixed
    resolution_reason: >-
      From the join every table reads CAISO's own supply, and since session 118 the older pages /mix, /grid and
      the California grid page no longer draw EIA's generation by fuel for California: they say why and point to
      the mix on CAISO's own data. What the generation EIA stopped counting is remains unknown, and that is
      EIA's to say.
    evidence: >-
      EIA-930's generation for California (CISO) steps in one hour, the hour starting 2025-12-16 08:00 UTC. Natural gas
      falls from a daily mean of 251.7 GWh (2025-06-02 to 2025-12-15) to 118.3 GWh (2025-12-16 to 2026-09-29). Total net
      generation falls from 554.1 GWh a day to 454.3 and stays the sum of the fuels. EIA's own balance for California
      (demand less net generation less net imports) was within about 1 percent of demand before (4.7 GWh a day) and is
      about 12 percent after (80.7 GWh a day). Demand and interchange do not move: a reporting change, not a change in
      the grid.
    tables: >-
      carbon_intensity_hourly; carbon_intensity_daily; carbon_intensity_monthly; cost_of_power_carbon; eia930_all_generation; eia930_generation_latest; eia930_all_emissions; ba_supply_monthly; grid_network_nodes; ai_power_regions; generation_mix_hourly_profile; generation_mix_records; shoulder_hours_monthly
    erw_does: >-
      From that hour California's generation by fuel is read from CAISO's own supply by fuel (caiso_fuel_supply), never
      blended with EIA's: a period is written from one source or not at all (warehouse/derived/caiso_join.py, JOIN).
      The month that holds the join, December 2025, is not written in the energy mix tables, and the shoulder hours'
      EIA-based California stops after November 2025. Demand is EIA's throughout: it does not step at the break.
    open: >-
      What the generation EIA stopped counting is, is not settled by these data. EIA's known-issues page refused
      a plain request (HTTP 403), so EIA's own account of the change was not read.
    recorded_in: >-
      session 73; docs/methods/eia930_caiso_break.md

  - id: eia930_ciso_hours_one_hour_late
    title: >-
      EIA's California hours sit one hour late from 1 November 2023 to 2 December 2025
    publisher: >-
      U.S. Energy Information Administration (EIA), Form EIA-930
    source: eia:gridmonitor/knownissues/xls
    first: "2023-11-01"
    last: "2025-12-02"
    dates_note: >-
      rows stamped 2023-11-01T00:00 UTC to 2025-12-02T23:00 UTC (the hour's end)
    status: corrected
    resolution: held_for_approval
    resolution_reason: >-
      The carbon intensity tables now read those hours one hour earlier in a trial build (17 monthly and 743
      daily values of each intensity move, the largest month by 0.14 kg CO2/MWh), held with the rest of that
      build because the tables are behind a live page. Not built: ba_supply_monthly, ai_power_regions and
      event_window_daily add up whole days, where one hour moved across midnight changes a day by a
      twenty-fourth at most; and eia930_all_emissions is the source table, which holds EIA's stamps as
      published.
    evidence: >-
      In EIA's CISO workbook every hourly value from the row stamped 2023-11-01T00:00 UTC to the row stamped
      2025-12-02T23:00 UTC belongs to the hour before; before and after, the stamps are right. Set beside CAISO's own
      data, the best match is at a shift of one hour on 182 of 182 days from 2025-06-02 to 2025-12-02 and at no shift
      on 298 of 298 days from 2025-12-03. The two solar profiles correlate at 0.946 as they stand and at 0.9998 with
      EIA's moved one hour earlier.
    tables: >-
      merchant_revenue_monthly; cost_of_power_monthly; cost_of_power_carbon; shoulder_hours_monthly; eia930_demand_growth; generation_mix_hourly_profile; generation_mix_records; eia930_all_emissions; carbon_intensity_hourly; carbon_intensity_daily; carbon_intensity_monthly; ba_supply_monthly; ai_power_regions; event_window_daily
    erw_does: >-
      Those hours are moved one hour earlier where they are read (caiso_join.true_hours) in merchant_revenue_monthly,
      cost_of_power_monthly, cost_of_power_carbon, shoulder_hours_monthly, eia930_demand_growth and the two energy mix
      tables. The hour 2025-12-02T22:00Z is then empty and is not filled. The correction made California solar revenue
      10.3 percent lower over the 16 months measured (USD 45,617 to 40,916 per MW).
    open: >-
      Why is not known. Not corrected: eia930_all_emissions, the carbon intensity tables, ba_supply_monthly,
      ai_power_regions and event_window_daily hold the hours as EIA stamped them. From July 2018 to mid June 2022 the
      same measure sits about half an hour early; that is seen and not corrected.
    recorded_in: >-
      sessions 80 and 82; docs/methods/eia930_caiso_break.md

  - id: eia930_ciso_no_hydro
    title: >-
      EIA's file holds no hydro for California from 1 October 2019 to 24 August 2020
    publisher: >-
      U.S. Energy Information Administration (EIA), Form EIA-930
    source: eia:gridmonitor/knownissues/xls
    first: "2019-10-01"
    last: "2020-08-24"
    dates_note: >-
      7,869 hours in a row, from the hour starting 2019-10-01T21:00Z to the hour starting 2020-08-24T17:00Z,
      both included (measured in session 118 on the workbook retrieved 2026-10-04)
    status: screened
    resolution: held_for_approval
    resolution_reason: >-
      Session 118 measured the gap to the hour and left it out of the carbon intensity tables in a trial build:
      7,789 hours of the consumed intensity and 7,784 of the generation intensity are not written, and with them
      the daily and monthly figures of those months. Held, because those tables are behind a live page. Until it
      is approved the pages in review that read them (/emissions, the California grid page) leave the months out
      and say so (site/data/carbon_left_out.json).
    evidence: >-
      Hydro is blank in every one of the 7,869 hours from the hour starting 2019-10-01T21:00Z to the hour
      starting 2020-08-24T17:00Z; the hour before holds 1,278 MW of hydro and the hour after 1,898 MW. EIA's own
      total leaves it out too, so the sources still add up. EIA's balance gives it away: demand against net
      generation less interchange is off by 9 to 15 percent of demand in those months, against 2 to 4 percent
      around them. Before the screen, California's dirtiest hour on record was an evening of December 2019 with
      no hydro in it.
    tables: >-
      generation_mix_hourly_profile; generation_mix_records; eia930_all_generation; carbon_intensity_hourly; carbon_intensity_daily; carbon_intensity_monthly
    erw_does: >-
      In the energy mix tables an hour is not used when a main source is blank (a main source supplies at least
      5 percent of the grid's generation over its history: warehouse/derived/mix_profile.py, MAIN). California's
      months from September 2019 to August 2020, and October 2020, are not written there. In the carbon
      intensity tables the 7,869 hours are left out of both intensities by the builder
      (impossible_hours.CISO_NO_HYDRO), in a build that is held.
    open: >-
      The held carbon build is not yet the table: carbon_intensity_hourly, _daily and _monthly still carry those
      hours as EIA published them, so California's intensity there is computed without hydro until a person
      approves the build. eia930_all_generation is the source table and keeps them.
    recorded_in: >-
      session 94; docs/methods/generation_mix_hourly.md

