# Energy Research Warehouse (ERW): what goes into Supabase (session 10 ruling 1).
#
# Supabase's free tier holds only a small live set, well under its 500 MB cap;
# load.py fails if pg_database_size exceeds max_mb. Redivis holds every table.
# Table names are regular expressions matched against the ERW table names in
# warehouse/output; a table matching no rule is not loaded.

max_mb: 400   # session 19 human ruling: raised from 300 (the free tier's hard cap is 500 MB)

# Loaded whole, every run.
full:
  - '^ercot_peak_premium_(annual|monthly)$'      # the two derived peak-premium tables
  - '^news_index$'                               # the public news index
  - '^eia860m_retired_generators$'                # entities; session 19 human ruling: the operating and
                                                 # planned generators reach Supabase through energy_projects
  - '^[a-z]+_interconnection_queue$'             # entities tables
  - '^eia_fuel_spot_prices$'
  - '^fred_daily_spot_prices$'
  - '^energy_deals$'                            # session 15: the deal tracker (public; the evidence table is internal)
  - '^energy_projects$'                         # session 16: the project map (tool 3), with "select" below
  - '^datacenter_projects$'                     # session 16: the datacenter power tracker (tool 4; evidence internal)
  - '^datacenter_facilities$'                   # session 22: the tracker's one table (news, operator lists, queues);
                                                 # datacenter_operator_sites reaches Supabase through it
  - '^ercot_large_load_queue$'                  # session 17: only if ERCOT publishes a request-level list
  # session 18: the energy mix explorer (tool 21). The grouped monthly mix is loaded, not the
  # EIA source table (eia_state_generation_monthly: EIA source codes, census regions and long
  # API page URLs per row, about twice the rows); Redivis and the CSV keep it whole.
  - '^state_generation_mix_monthly$'
  - '^eia930_generation_latest$'                # a snapshot of the latest complete hours
  # session 18: the curtailment tracker (tool 22): the monthly history whole, the daily tables
  # below with their own window; consumption by sector (tool 23): the last 24 published months
  - '^iso_curtailment_monthly$'
  - '^(caiso|spp)_curtailment_daily$'
  - '^ercot_wind_solar_hsl_daily$'
  - '^eia_retail_sales_monthly$'
  - '^eia_sector_energy_consumption_monthly$'
  # session 19: the trader view (tool 24): the daily metrics with their own window, below
  - '^iso_trader_daily$'                         # session 29: the six ISOs' tables consolidated (market)
  - '^iso_rt_top_intervals$'
  # session 24: the policy monitor (tool 12; the evidence table is internal) and NWS weather for /grid
  - '^policy_(actions|reads)$'
  - '^weather_(obs|forecast)_hourly$'
  # session 26: the company database's seed (tool 10), for /companies and the /deals cross-links
  - '^energy_companies$'
  # session 30: the price board v2 derived tables (/board), and the API cost ledger (internal: row-level security
  # hides it; only internal_costs(token), migration 010, reads it for /internal/costs)
  - '^price_board_(latest|peak_offpeak|spreads|carbon)$'
  - '^api_cost_ledger$'
  # session 31: /storage (the hourly series below, last 90 days)
  - '^storage_(daily_cycle|capacity)$'
  # session 32: /emissions (the daily intensity whole; the hourly tables below, last 90 days)
  - '^carbon_intensity_daily$'
  # session 34: CAISO's own battery series for /storage, beside EIA-930's (Total batteries only, its own window below)
  - '^caiso_battery_storage$'

# Only rows whose time is within the last `days` days (series: ts_utc). Older rows
# of these tables are deleted from Supabase on each load, so the window rolls.
recent:
  days: 90
  tables:
    - '^(caiso|ercot|isone|miso|nyiso|spp|pjm)_(dam|rtm)_(hub|zone)_prices(_hourly)?$'   # ISO prices; session 19 human
      # ruling: not the ERCOT yearly history tables, whose last 90 days repeat ercot_*_hub_prices
    - '^eia930_[a-z0-9]+_(demand|generation)$'     # session 29: eia930_all_demand and eia930_all_generation (ba)
    - '^iso_(dam|rtm)_hub_prices$'                 # session 29: the CAISO, ERCOT, MISO and SPP hub prices (market)
    - '^eia930_all_storage$'                       # session 31: EIA-930 battery storage (ba), the last 90 days
    - '^(eia930_all_emissions|carbon_intensity_hourly)$'   # session 32: CO2 estimates and hourly intensity, 90 days

# Session 16: for a table named here, only these extra columns (beyond the shape's standard
# columns) and only rows not excluded go to Supabase. energy_projects repeats the rows of the
# EIA-860M and queue tables already in the live set; loading it whole would pass max_mb. The
# map needs no withdrawn queue position, and project_id and mw repeat entity_id and capacity_mw.
select:
  energy_projects:
    columns: [kind, technology_group, state, county, geo_precision, operator_role, date, date_kind, source_table]
    exclude:
      status: [withdrawn]
  # session 18: the page shows the last 90 days of daily curtailment; the monthly table holds the history
  caiso_curtailment_daily: {days: 100}
  spp_curtailment_daily: {days: 100}
  ercot_wind_solar_hsl_daily: {days: 100}
  # session 18: /consumption compares the latest 12 months with the 12 before: 25 months of
  # retail sales (not customers), with EIA's two-month lag: 850 days; the MER series the same
  eia_retail_sales_monthly:
    include:
      variable: [retail_sales]
    days: 850
  eia_sector_energy_consumption_monthly: {days: 850}
  # session 19: /markets shows two weeks and the latest 30-day volatility
  iso_trader_daily: {days: 45}   # session 29: the six <iso>_trader_daily tables, consolidated
  # session 34: /storage charts the last 30 days of CAISO's Total batteries (5-minute; about 9,000 rows)
  caiso_battery_storage:
    include:
      variable: [batteries_mw]
    days: 32

# The catalogue (coverage.csv) and the source registry are loaded whole.
catalogue: warehouse/metadata/coverage.csv
sources: warehouse/metadata/sources.csv
