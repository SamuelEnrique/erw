  - '^eia_fuel_spot_prices$'
  # session 207: fred_daily_spot_prices is retired (warehouse/metadata/retired_tables.csv); its rows in Supabase stay
  # until a person runs load.py --prune
  - '^energy_deals$'                            # session 15: the deal tracker (public; the evidence table is internal)
  - '^caiso_grid_emergencies$'                  # session 58: CAISO's Flex Alerts and emergencies, 1998 on (events)
