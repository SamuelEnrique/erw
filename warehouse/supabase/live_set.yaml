# Energy Research Warehouse (ERW): what goes into Supabase (session 10 ruling 1).
#
# Supabase's free tier holds only a small live set, well under its 500 MB cap;
# load.py fails if pg_database_size exceeds max_mb. Redivis holds every table.
# Table names are regular expressions matched against the ERW table names in
# warehouse/output; a table matching no rule is not loaded.

# session 59 (Samuel): Supabase is on the Pro plan with the spend cap on: 8 GB of database included, and the cap stops
# usage beyond it rather than billing. The limit leaves room under 8 GB for the vacuum's copies and the other tables.
max_mb: 7500  # was 400 (session 19, the free tier's 500 MB hard cap)
warn_mb: 6000 # was 350 (session 36C): load.py prints a warning above this, after the vacuum

# Loaded whole, every run.
full:
  - '^ercot_peak_premium_(annual|monthly)$'      # the two derived peak-premium tables
  - '^news_index$'                               # the public news index
  - '^eia860m_retired_generators$'                # entities; session 19 human ruling: the operating and
                                                 # planned generators reach Supabase through energy_projects
  - '^(?!lbnl_)[a-z]+_interconnection_queue$'   # entities tables (session 62: not Berkeley Lab's national history)
  - '^eia_fuel_spot_prices$'
  - '^fred_daily_spot_prices$'
  - '^energy_deals$'                            # session 15: the deal tracker (public; the evidence table is internal)
  - '^caiso_grid_emergencies$'                  # session 58: CAISO's Flex Alerts and emergencies, 1998 on (events)
  - '^caiso_reliability_daily$'                 # session 58: how tight was it, CAISO's evenings day by day (derived)
  - '^flex_alert_(effects|model)$'              # session 60: the Flex Alert scorecard (derived, a few thousand rows)
  - '^ai_power_regions$'                         # session 62: the AI gigawatts draft's table (derived, about 150 rows)
  - '^energy_projects$'                         # session 16: the project map (tool 3), with "select" below
  - '^datacenter_projects$'                     # session 16: the datacenter power tracker (tool 4; evidence internal)
  - '^datacenter_facilities$'                   # session 22: the tracker's one table (news, operator lists, queues);
                                                 # datacenter_operator_sites reaches Supabase through it
  - '^ercot_large_load_queue$'                  # session 17: only if ERCOT publishes a request-level list
  # session 18: the energy mix explorer (tool 21). The grouped monthly mix is loaded, not the
  # EIA source table (eia_state_generation_monthly: EIA source codes, census regions and long
  # API page URLs per row, about twice the rows); Redivis and the CSV keep it whole.
  - '^state_generation_mix_monthly$'
  - '^eia930_generation_latest$'                # a snapshot of the latest complete hours
  # session 18: the curtailment tracker (tool 22): the monthly history whole, the daily tables
  # below with their own window; consumption by sector (tool 23): the last 24 published months
  - '^iso_curtailment_monthly$'
  - '^(caiso|spp)_curtailment_daily$'
  - '^ercot_wind_solar_hsl_daily$'
  - '^eia_retail_sales_monthly$'
  - '^eia_sector_energy_consumption_monthly$'
  # session 19: the trader view (tool 24): the daily metrics with their own window, below
  - '^iso_trader_daily$'                         # session 29: the six ISOs' tables consolidated (market)
  - '^iso_rt_top_intervals$'
  # session 24: the policy monitor (tool 12; the evidence table is internal) and NWS weather for /grid
  - '^policy_(actions|reads)$'
  - '^weather_(obs|forecast)_hourly$'
  # session 26: the company database's seed (tool 10), for /companies and the /deals cross-links
  - '^energy_companies$'
  # session 30: the price board v2 derived tables (/board), and the API cost ledger (internal: row-level security
  # hides it; only internal_costs(token), migration 010, reads it for /internal/costs)
  - '^price_board_(latest|peak_offpeak|spreads|carbon)$'
  - '^api_cost_ledger$'
  # session 83: FERC EQR contracts (internal: row-level security hides it; only internal_eqr_contracts(token) and
  # internal_eqr_summary(token), migration 020, read it for the review page /contracts). The rows signed in the last 1,000
  # days (select, below); Redivis's internal dataset and the CSV hold every row
  - '^ferc_eqr_contracts$'
  # session 31: /storage (the hourly series below, last 90 days)
  - '^storage_(daily_cycle|capacity|buildout_monthly)$'
  # session 32: /emissions (the daily intensity whole; the hourly tables below, last 90 days)
  - '^carbon_intensity_(daily|monthly)$'          # session 34: the monthly table too, whole (about 1,600 rows)
  # session 34: CAISO's own battery series for /storage, beside EIA-930's (Total batteries only, its own window below)
  - '^caiso_battery_storage$'
  # session 36B: the Historical Event Analyzer's daily table (556 rows); never an hourly history
  - '^event_window_daily$'
  # session 37: the cost-of-power model, whole (about 2,300 monthly rows in all)
  - '^cost_of_power_(monthly|hourly_profile|carbon)$'
  # session 67: the battery revenue stack, whole (/cost-of-power/battery reads both; about 20,000 monthly rows and
  # a few thousand stress-day rows)
  - '^battery_stack_(monthly|stress_daily)$'
  # session 76 (for session 75's page): the shoulder hours, whole (/shoulder reads it; about 20,000 monthly and yearly rows)
  - '^shoulder_hours_monthly$'
  # session 68: who supplies a grid; the page reads the last twelve months, so only the last 430 days are loaded (select,
  # below): about 30,000 of its 158,000 rows. Redivis and the CSV hold every month from 2019
  - '^ba_supply_monthly$'
  # session 102 (for session 92's Ask ERCOT, in review): the ERCOT tables the site's database lacked, as Samuel's chain
  # prompt of 4 October says. The reserve prices are 336,092 rows, loaded whole. Berkeley Lab's national queue file,
  # which session 62 kept out for its size, is loaded for the same page (38,201 entities).
  # NOT loaded: ercot_all_hub_prices_history (3,063,570 rows). The prompt's line was 2 GB. The load of the other tables
  # measured 549 bytes a row (603,438 rows took the database from 437.3 to 753.0 MB), so the history would add about
  # 1,600 MB and bring it to about 2,356 MB. A daily summary of it (about 51,000 rows: session 92's lighter way) would fit.
  - '^ercot_as_prices$'
  - '^lbnl_interconnection_queue$'
  - '^merchant_revenue_monthly$'
  # session 102: the tables the review pages of sessions 87 and 94 to 98 are built on, loaded and named under review_hold
  # below, so they are in Supabase for the internal view and for Ask, and in no count a visitor sees
  - '^storage_owners_monthly$'
  - '^generation_mix_(hourly_profile|records)$'
  - '^interconnection_queue_summary$'
  - '^hub_price_comparison$'
  - '^eia930_demand_growth$'
  - '^caiso_curtailment_profile$'
  - '^known_data_faults$'                        # session 103: /data/faults (in review), under review_hold below
  - '^ercot_large_load_status$'                  # session 106: /datacenters/v2 (in review), under review_hold below

# Only rows whose time is within the last `days` days (series: ts_utc). Older rows
# of these tables are deleted from Supabase on each load, so the window rolls.
# Session 36C: 35 days, not 90. The site reads at most 31 days of these tables (/prices/<hub> 30, /storage 31, the grid
# pages 34 of EIA-930 generation, /emissions and the grid pages 3 to 4 of hourly intensity); 35 keeps a margin, and /ask
# answers from the same window. The live set stood at 376.6 MB of 400; Redivis and the CSVs keep every row.
recent:
  days: 35
  tables:
    - '^(caiso|ercot|isone|miso|nyiso|spp|pjm)_(dam|rtm)_(hub|zone)_prices(_hourly)?$'   # ISO prices; session 19 human
      # ruling: not the ERCOT yearly history tables, whose last 90 days repeat ercot_*_hub_prices
    - '^eia930_(?!daily_)[a-z0-9]+_(demand|generation)$'     # session 29: eia930_all_demand and eia930_all_generation (ba); session 109: not the daily history eia930_daily_demand
    - '^iso_(dam|rtm)_hub_prices$'                 # session 29: the CAISO, ERCOT, MISO and SPP hub prices (market)
    - '^eia930_all_storage$'                       # session 31: EIA-930 battery storage (ba), the recent window
    - '^(eia930_all_emissions|carbon_intensity_hourly)$'   # session 32: CO2 estimates and hourly intensity, the recent window

# Session 16: for a table named here, only these extra columns (beyond the shape's standard
# columns) and only rows not excluded go to Supabase. energy_projects repeats the rows of the
# EIA-860M and queue tables already in the live set; loading it whole would pass max_mb. The
# map needs no withdrawn queue position, and project_id and mw repeat entity_id and capacity_mw.
select:
  energy_projects:
    columns: [kind, technology_group, state, county, geo_precision, operator_role, date, date_kind, source_table]
    exclude:
      status: [withdrawn]
  # session 18: the page shows the last 90 days of daily curtailment; the monthly table holds the history
  caiso_curtailment_daily: {days: 100}
  spp_curtailment_daily: {days: 100}
  ercot_wind_solar_hsl_daily: {days: 100}
  # session 18: /consumption compares the latest 12 months with the 12 before: 25 months of
  # retail sales (not customers), with EIA's two-month lag: 850 days; the MER series the same
  eia_retail_sales_monthly:
    include:
      variable: [retail_sales]
    days: 850
  eia_sector_energy_consumption_monthly: {days: 850}
  # session 19: /markets shows two weeks and the latest 30-day volatility
  iso_trader_daily: {days: 45}   # session 29: the six <iso>_trader_daily tables, consolidated
  # session 34: /storage charts the last 30 days of CAISO's Total batteries (5-minute; about 9,000 rows)
  caiso_battery_storage:
    include:
      variable: [batteries_mw]
    days: 32
  # session 34: Supabase stood at 394.2 MB of 400 after the six new CO2 variables and intensity from 2018 were loaded.
  # The site reads no by-fuel CO2 and no daily intensity: the live set keeps generated and consumed CO2 (its 90 days)
  # and the last 100 days of the daily intensity; Redivis and the CSVs hold everything
  # session 36A: all eight CO2 variables again (the by-fuel and trade six for /ask and the grid pages' chat), the table's
  # recent window (90 days in session 36A at 376.3 MB; 35 days since session 36C)
  carbon_intensity_daily: {days: 100}
  # session 68: /network's panel reads the last twelve complete months of ba_supply_monthly
  ba_supply_monthly: {days: 430}
  # session 83: /contracts lists contracts by the quarter they were signed; the last 1,000 days of execution dates
  ferc_eqr_contracts: {event_days: 1000}

# Session 85: public tables held out of the live catalogue (and of the live set) while the live site is frozen for a
# reviewer: the home page counts the catalogue's public tables and rows, and no live number may move. A held table is
# in coverage.csv, the archive and its Redivis draft like any other. To release one, take its name off this list (and
# give it a live-set rule above if a page reads it from Supabase); the next load adds it to the catalogue.
catalogue_hold:
  - nyiso_as_prices
  - spp_as_prices
  # session 86: the battery model on NYISO and SPP, in review; the page reads site/data/battery_stack_review.json
  - battery_stack_review_monthly
  # session 102: the two pulls of sessions 98 and 100 that no page reads from Supabase (the curtailment page reads the
  # profile built from the intervals; the battery review page reads its own file). In coverage, the archive and the
  # Redivis draft; not loaded, not in the live catalogue
  - caiso_curtailment_intervals
  - spp_as_quantities
  # session 109: EIA's daily demand by balancing authority, a history (190,512 rows). The network's replay reads its own
  # files (site/public/network/daily_<year>.json), built from it; nothing reads it from Supabase
  - eia930_daily_demand

# Session 102: public tables that a page in review reads, loaded into Supabase but held out of the public catalogue while
# the page is in review. The loader writes their catalogue row with in_live_set "review" instead of "yes"; the site's
# catalogue reader (site/lib/data.ts) leaves such rows out, so the home page's counts of public tables and rows and
# the Data page do not hear of them, while the question-answering tools (site/lib/chat/tools.ts) read them. Each needs
# a live-set rule above. To open one: take its name off this list; the next load writes "yes".
review_hold:
  - storage_owners_monthly             # session 87 (/storage/owners) and session 92 (Ask ERCOT); was under catalogue_hold
  - generation_mix_hourly_profile      # session 94, /mix/v2
  - generation_mix_records
  - interconnection_queue_summary      # session 95, /queues
  - hub_price_comparison               # session 96, /prices/compare
  - eia930_demand_growth               # session 97, /demand
  - caiso_curtailment_profile          # session 98, /curtailment/v2
  - known_data_faults                  # session 103, /data/faults
  - ercot_large_load_status            # session 106, /datacenters/v2

# Session 102: sources that serve only tables whose pages are in review, held off /terms (a live page that lists the
# registry and counts it) until one of those pages opens. Read by the site's build (site/scripts/build-content.mjs);
# the registry itself (sources.csv), Redivis and Supabase hold them as any other. To release one, take it off the list.
sources_hold:
  - erw:generation_mix_hourly          # session 94, /mix/v2
  - erw:generation_mix_hourly_caiso
  - erw:interconnection_queue_summary  # session 95, /queues
  - erw:hub_price_comparison           # session 96, /prices/compare
  - erw:demand_growth                  # session 97, /demand
  - erw:caiso_curtailment_profile      # session 98, /curtailment/v2
  - erw:eqr_buyers                     # session 99, /contracts (internal)
  - spp:DA-MC                          # session 100, the SPP reserve quantities (the battery page's SPP is closed)
  - erw:known_data_faults              # session 103, /data/faults
  - ercot:large_load_status_update     # session 106, /datacenters/v2
  - eia930:daily_demand                # session 109, /network/v3's replay

# The catalogue (coverage.csv) and the source registry are loaded whole.
catalogue: warehouse/metadata/coverage.csv
sources: warehouse/metadata/sources.csv
