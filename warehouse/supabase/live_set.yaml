# Only rows whose time is within the last `days` days (series: ts_utc). Older rows
# of these tables are deleted from Supabase on each load, so the window rolls.
# Session 36C: 35 days, not 90. The site reads at most 31 days of these tables (/prices/<hub> 30, /storage 31, the grid
# pages 34 of EIA-930 generation, /emissions and the grid pages 3 to 4 of hourly intensity); 35 keeps a margin, and /ask
# answers from the same window. The live set stood at 376.6 MB of 400; Redivis and the CSVs keep every row.
recent:
  days: 35
  tables:
    - '^(caiso|ercot|isone|miso|nyiso|spp|pjm)_(dam|rtm)_(hub|zone)_prices(_hourly)?$'   # ISO prices; session 19 human
      # ruling: not the ERCOT yearly history tables, whose last 90 days repeat ercot_*_hub_prices
    - '^eia930_(?!daily_)[a-z0-9]+_(demand|generation)$'     # session 29: eia930_all_demand and eia930_all_generation (ba); session 109: not the daily history eia930_daily_demand
    - '^iso_(dam|rtm)_hub_prices$'                 # session 29: the CAISO, ERCOT, MISO and SPP hub prices (market)
    - '^eia930_all_storage$'                       # session 31: EIA-930 battery storage (ba), the recent window
    - '^eia930_all_emissions$'                     # session 32: EIA's CO2 estimates, the recent window (session 245: the
      # hourly intensity built from them has its own window of 430 days: under "full" above and "select" below)

# Session 16: for a table named here, only these extra columns (beyond the shape's standard
# columns) and only rows not excluded go to Supabase. energy_projects repeats the rows of the
# EIA-860M and queue tables already in the live set; loading it whole would pass max_mb. The
# map needs no withdrawn queue position, and project_id and mw repeat entity_id and capacity_mw.
select:
  energy_projects:
    columns: [kind, technology_group, state, county, geo_precision, operator_role, date, date_kind, source_table]
    exclude:
      status: [withdrawn]
  # session 18: the page shows the last 90 days of daily curtailment; the monthly table holds the history
  caiso_curtailment_daily: {days: 100}
  spp_curtailment_daily: {days: 100}
  ercot_wind_solar_hsl_daily: {days: 100}
  # session 18: /consumption compares the latest 12 months with the 12 before: 25 months of
  # retail sales (not customers), with EIA's two-month lag: 850 days; the MER series the same
  eia_retail_sales_monthly:
    include:
      variable: [retail_sales]
    days: 850
  eia_sector_energy_consumption_monthly: {days: 850}
  # session 19: /markets shows two weeks and the latest 30-day volatility
  iso_trader_daily: {days: 45}   # session 29: the six <iso>_trader_daily tables, consolidated
  # session 34: /storage charts the last 30 days of CAISO's Total batteries (5-minute; about 9,000 rows)
  caiso_battery_storage:
    include:
      variable: [batteries_mw]
    days: 32
  # session 34: Supabase stood at 394.2 MB of 400 after the six new CO2 variables and intensity from 2018 were loaded.
  # The site reads no by-fuel CO2 and no daily intensity: the live set keeps generated and consumed CO2 (its 90 days)
  # and the last 100 days of the daily intensity; Redivis and the CSVs hold everything
  # session 36A: all eight CO2 variables again (the by-fuel and trade six for /ask and the grid pages' chat), the table's
  # recent window (90 days in session 36A at 376.3 MB; 35 days since session 36C)
  carbon_intensity_daily: {days: 100}
  # session 245: at least 13 months of the hourly intensity (see "full" above). Every row of the window: no hour, no
  # balancing authority and neither variable is left out
  carbon_intensity_hourly: {days: 430}
  # session 68: /network's panel reads the last twelve complete months of ba_supply_monthly
  ba_supply_monthly: {days: 430}
  # session 83: /contracts lists contracts by the quarter they were signed; the last 1,000 days of execution dates
  ferc_eqr_contracts: {event_days: 1000}

