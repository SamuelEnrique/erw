# Energy Research Warehouse (ERW): what goes into Supabase (session 10 ruling 1).
#
# Supabase's free tier holds only a small live set, well under its 500 MB cap;
# load.py fails if pg_database_size exceeds max_mb. Redivis holds every table.
# Table names are regular expressions matched against the ERW table names in
# warehouse/output; a table matching no rule is not loaded.

# session 59 (Samuel): Supabase is on the Pro plan with the spend cap on: 8 GB of database included, and the cap stops
# usage beyond it rather than billing. The limit leaves room under 8 GB for the vacuum's copies and the other tables.
max_mb: 7500  # was 400 (session 19, the free tier's 500 MB hard cap)
warn_mb: 6000 # was 350 (session 36C): load.py prints a warning above this, after the vacuum

