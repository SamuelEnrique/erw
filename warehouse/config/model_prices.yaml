# Energy Research Warehouse (ERW): Anthropic API prices, the one place they live (session 30, Part B1).
#
# warehouse/llm.py reads this file to price every call it records in api_cost_ledger.
# USD per million tokens. input: uncached input; output: output (thinking included);
# cache_write_5m: a 5-minute cache write (1.25x input); cache_write_1h: a 1-hour cache write (2x input);
# cache_read: a cache hit. A model not listed here is recorded with usd empty, never guessed.
#
# Source: the claude-api skill's model table (cached 2026-09-25) and its prompt-caching reference
# (writes 1.25x for the 5-minute TTL, 2x for the 1-hour TTL; reads 0.1x input, 0.05x on Claude Opus 5.5,
# 0.025x on Claude Fable 5.1). Update the date below with the prices; the ledger records it per row.

as_of: 2026-09-25
source: "claude-api skill, model table cached 2026-09-25, and https://docs.anthropic.com/en/docs/about-claude/pricing"

models:
  claude-fable-5-1:  {input: 10.00, output: 50.00, cache_write_5m: 12.50, cache_write_1h: 20.00, cache_read: 0.25}
  claude-fable-5:    {input: 10.00, output: 50.00, cache_write_5m: 12.50, cache_write_1h: 20.00, cache_read: 1.00}
  claude-opus-5-5:   {input: 4.00,  output: 20.00, cache_write_5m: 5.00,  cache_write_1h: 8.00,  cache_read: 0.20}
  claude-opus-5:     {input: 5.00,  output: 25.00, cache_write_5m: 6.25,  cache_write_1h: 10.00, cache_read: 0.50}
  claude-sonnet-5-5: {input: 2.00,  output: 10.00, cache_write_5m: 2.50,  cache_write_1h: 4.00,  cache_read: 0.20}
  claude-sonnet-5:   {input: 2.00,  output: 10.00, cache_write_5m: 2.50,  cache_write_1h: 4.00,  cache_read: 0.20}
  claude-sonnet-4-6: {input: 3.00,  output: 15.00, cache_write_5m: 3.75,  cache_write_1h: 6.00,  cache_read: 0.30}
  claude-haiku-4-5:  {input: 1.00,  output: 5.00,  cache_write_5m: 1.25,  cache_write_1h: 2.00,  cache_read: 0.10}

