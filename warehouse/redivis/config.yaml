# Energy Research Warehouse (ERW): Redivis identifiers.
#
# The single place that names the Redivis owner and dataset (session 10). Every
# script that talks to Redivis reads this file; none restates the names. Modeled
# on the IRW's metadata/redivis_config.R.
#
# The owner is read from REDIVIS_OWNER in .env (or the repository secret of the
# same name), so the account can move without a code change. The write token is
# REDIVIS_API_TOKEN, read the same way and never printed.

owner_env: REDIVIS_OWNER
owner_kind: user            # REDIVIS_OWNER is a Redivis user account (redivis.user), not an organization
dataset: energy_research_warehouse
# Session 28 (Ben Domingue's review, item 3): every table whose license in coverage.csv is not "public"
# goes to this second dataset, private (no public access), under the same owner. Nothing internal is
# ever uploaded to `dataset`; upload.py --check-license fails the daily run if one is found there.
dataset_internal: energy_research_warehouse_internal
token_env: REDIVIS_API_TOKEN

# Metadata tables added to the dataset beside the ERW tables, from warehouse/metadata.
metadata_tables:
  erw_coverage: warehouse/metadata/coverage.csv
  erw_sources: warehouse/metadata/sources.csv

# Column types: Redivis infers them on upload (it accepts an explicit schema only for
# streaming uploads). ts_utc and retrieved_at arrive as dateTime (UTC), value as float,
# codes and ids as string. --restore writes them back in the ERW's text form.

# Tables the daily run MERGES into (a rolling window: rows from earlier runs are
# kept). The CI runner starts without the tables (they are not in git, session 9),
# so before the connectors run it restores these from the Redivis draft; otherwise
# a 3-day window would be uploaded over the 30-day table. Regular expressions on
# the table name. Full-history tables (rewritten whole every run), snapshots and
# the yearly ERCOT history are not restored.
restore_before_run:
  - '^(caiso|ercot|isone|miso|nyiso|spp|pjm)_(dam|rtm)_(hub|zone)_prices(_hourly)?$'
  # session 29: the consolidated tables (warehouse/metadata/table_migrations.csv). eia930_all_* and iso_trader_daily
  # match the patterns below; the ERCOT history (ercot_all_hub_prices_history) is not restored, like its yearly tables
  - '^iso_(dam|rtm)_hub_prices$'
  - '^eia930_[a-z0-9]+_(demand|generation)$'
  # session 18: the curtailment tracker's tables merge each day's rows into the history
  - '^(caiso|spp)_curtailment_daily$'
  - '^ercot_wind_solar_hsl_daily$'
  - '^iso_curtailment_monthly$'
  # session 18: restored so an unchanged month keeps its retrieved_at and Supabase is not rewritten daily
  - '^state_generation_mix_monthly$'
  # session 19: the trader view keeps days older than the price tables' windows
  - '^[a-z]+_trader_daily$'
  # session 23: CAISO battery storage keeps its history (the connector pulls the last 30 days; the backfill reaches 2025-08)
  - '^caiso_battery_storage$'
  # session 24: policy actions keep news releases older than the agencies' feed windows; policy_reads its reads
  - '^policy_(actions|reads)$'
  # session 24: the NWS observations keep more than the API's 7 days by merging; the forecast keeps past vintages' hours
  - '^weather_(obs|forecast)_hourly$'
  # session 30: the API cost ledger and the shadow scores grow by merging (internal; restored from the internal draft)
  - '^api_cost_ledger$'
  - '^news_scores_shadow$'
  # session 30: price board v2 carries the rows it cannot rebuild on the runner (the ERCOT history's, CARB's)
  - '^price_board_(peak_offpeak|spreads|carbon)$'
  # session 31: EIA-930 battery storage keeps its history from 2024 by merging (storage_capacity, a snapshot that may
  # shrink, is not restored: on a day without the EIA-860M tables it is absent on the runner, like energy_projects)
  - '^eia930_all_storage$'
  # session 32: the EIA-930 CO2 estimates keep their history from 2018-07-01 by merging
  - '^eia930_all_emissions$'

# Record of the last upload of each table (sha256 of its data rows), used to upload
# only the tables a run changed. Tracked in git with the other metadata.
manifest: warehouse/metadata/redivis_uploads.csv
