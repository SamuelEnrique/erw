# The codebook's metadata of table pjm_rpm_capacity_prices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: pjm_rpm_capacity_prices
family: other_sources
shape: series
row: One PJM locational deliverability area's (LDA's) Base Residual Auction clearing price for one delivery year, the headline
  product only.
time: ts_utc is the start of the delivery year, 1 June at 00:00:00Z; freq P1Y.
vintage_rule: Merged by (entity, variable, ts_utc) (ip.write_csv); each run writes the whole table again from the workbook
  as it stands, and a later auction adds a delivery year; vintage is not filled.
keys:
- entity
- variable
- ts_utc
license: internal
tier: source
interval: P1Y
source:
- name: pjm:rpm-clearing-price-summary PJM Interconnection, RPM Resource Clearing Prices for all RPM Auctions held to date
    (linked from https://www.pjm.com/markets-and-operations/rpm)
  url: https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/rpm-auctions-resource-clearing-price-summary.xlsx
cite: PJM Interconnection. RPM Resource Clearing Prices for all RPM Auctions held to date. Via the Energy Research Warehouse
  (ERW), table `pjm_rpm_capacity_prices`.
