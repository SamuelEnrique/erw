# The codebook's metadata of table ceb_srilanka_electricity_annual (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ceb_srilanka_electricity_annual
family: other_sources
shape: series
row: One year's value of one Sri Lankan power system measure (power stations, installed capacity or net generation by owner
  and source, or maximum demand), from CEB's Statistical Digest.
time: ts_utc is the year's 1 January at 00:00:00Z; freq P1Y.
vintage_rule: 'Merged by (entity, variable, ts_utc) (ip.write_csv): a run replaces the rows it reads again and keeps rows
  from earlier runs; vintage is the digest''s Last-Modified time.'
keys:
- entity
- variable
- ts_utc
license: internal
tier: source
interval: P1Y
source:
- name: ceb:statistical_digest Ceylon Electricity Board, Statistical Digest 2025 (Web Edition), the PDF's third page (printed
    page 1)
  url: https://www.ceb.lk/publication-media/other-publications/en
cite: Ceylon Electricity Board, Sri Lanka (CEB). Statistical Digest 2025, page 3 (power stations, installed capacity, net
  generation, maximum demand). Via the Energy Research Warehouse (ERW), table `ceb_srilanka_electricity_annual`.
method: docs/methods/ceb_srilanka_electricity_annual.md
header_title: Ceylon Electricity Board (CEB), Statistical Digest 2025, Sri Lanka's power stations, installed capacity and
  net generation by owner and source, and the maximum demand, 2024 and 2025 (session 2371)
header_shape: 'Shape: series (docs/datastandard.md v0). entity ceb:LK; variable stations_, capacity_ (MW) or generation_ (MWh,
  CEB''s net GWh times 1,000) followed by <owner>_<source> (owner ceb, ipp or all; source total, major_hydro, thermal_oil,
  thermal_coal, ncre_wind, ncre_mini_hydro, ncre_other, ncre_grid_solar, ncre_rooftop_solar, small_islands), and max_demand_day,
  max_demand_night (MW); ts_utc the year''s 1 January; freq P1Y; geo LK. 2024''s stations and capacity are CEB''s restated
  figures. generation_ipp_ncre_rooftop_solar is rooftop solar''s energy exported to the network, not IPP output; rooftop solar
  has no capacity row (the summary page gives 1,141 MW for 2024 and 1,935 MW for 2025), so capacity_all_total leaves it out.'
