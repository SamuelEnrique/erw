# The codebook's metadata of table utility_large_load_tariffs (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: utility_large_load_tariffs
family: utility
shape: series
row: One figure (a minimum load, a demand charge, an energy charge, a term) that one utility's filed large-load schedule prints,
  as of the schedule's effective date.
time: ts_utc is the schedule's effective date at 00:00:00Z (a date, not an instant); freq is blank, a tariff in force from
  that day.
vintage_rule: The filed rows are rewritten whole from the registry (warehouse/sources/large_load_tariffs/) by each run, keeping
  only other connectors' rows (OpenEI's, none written); schedules held for a license are named in the header and not written.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: ''
source:
- name: the registry warehouse/sources/large_load_tariffs/ (one file a schedule, each figure with its page and words), filled
    by reading each commission's filed copy. No request is made by this connector.
  url: ''
cite: the state commissions (filed tariffs), read into the ERW's registry. Large loads' filed tariffs (warehouse/sources/large_load_tariffs).
  Via the Energy Research Warehouse (ERW), table `utility_large_load_tariffs`.
method: docs/methods/large_load_tariffs.md
header_title: large loads' filed tariffs, one row a figure a schedule prints (session 2871, chain 147)
header_shape: 'Shape: series (docs/datastandard.md v0). entity filed:<EIA utility id>:<schedule>; ts_utc the schedule''s effective
  date at 00:00:00Z; variables min_demand_mw (MW), demand_charge (USD/kW-month), demand_charge_transmission (USD/kW-month),
  demand_charge_distribution (USD/kW-month), demand_charge_generation (USD/kW-month), energy_charge (USD/MWh), fixed_charge
  (USD), min_contract_years (year), min_bill_pct (pct), collateral_months (month), exit_fee_months (month), demand_charge_summer
  (USD/kW-month), demand_charge_winter (USD/kW-month), energy_charge_summer (USD/MWh), energy_charge_winter (USD/MWh), grid_charge_transmission
  (USD/kW-month), grid_charge_substation (USD/kW-month). value is the printed figure (x_printed) in the unit, converted only
  between units; nothing is derived. source_url is the filed document, x_page its page.'
