        demand per month at 11 kV, 60 kV and 115 kV or higher (page 1). Annual minimum $1,177,388 (Schedule 25A, page 2).
        The monthly rate is subject to Schedules 58, 61, 63, 66, 88, 91, 92, 93, 98 and 99 (page 2).'
      : 3
      ? 'Proposed: a settlement filed 6 October 2026, pending NCUC approval as of 12 November 2026. Applies to letter agreements
        and electric service agreements executed on and after 1 June 2026. Contract term: below 100 MW the greater of 10 years
        and 5 years plus the load ramp period; 100 MW or more the greater of 15 years and 10 years plus the load ramp period.'
      : 3
      ? 'Proposed: filed 2 April 2026 with a requested effective date of 3 May 2026 (the date written), suspended 120 days
        by Decision No. C26-0280 of 30 April 2026; final decision not read. The 15-year minimum initial term is now read in
        primary documents (session 3937, window P4''s research pass, 13 November 2026, row xcel_plains-03): PSCo''s Form 10-Q
        for the quarter ended 30 September 2026 (''The proposed tariff also includes a minimum initial term of 15 years, minimum
        bill provisions, termination and exit fees, and credit requirements''; ''A CPUC decision is expected in late 2026
        or early 2027'') and the Colorado PUC''s Electric Rate Cases page (''Requiring large customers to sign contracts of
        15 years or more''; ''New customers using between 20 and 50 MW may also be subject to the tariff''; the Commission''s
        decision ''TBD''). Leads from intervenor testimony, still not verified in the filing: minimum monthly bill on 80 percent
        of contract capacity; an optional ramp of up to 5 years within the term; exit fee the sum of the remaining minimum
        monthly bills.'
      : 1
      ? 'Proposed: the companies ask an expedited ruling on the form (p. 7); the statutory period runs to 2 December 2026
        (p. 6). Termination by the customer after long-term supply begins, on not less than 36 months'' notice (p. 149). The
        June 2026 fact sheet (https://www.nvenergy.com/publish/content/dam/nvenergy/brochures_arch/help/brochures/Large-Load-Electric-Service-Agreement-LLESA-Fact-Sheet.pdf,
        read 2026-11-12) says the LLESA serves customers whose energy needs typically exceed 25 MW.'
      : 2
      ? 'Schedule 94 (https://www.grantpud.org/templates/galaxy/images/images/Downloads/Rates/NewLargeLoadService94/Sch_94_Jan_1_2016_-_Final.pdf):
        a New Large Load''s monthly energy charge is the greater of the month''s weighted average ICE Mid-C index price (peak
        and off-peak) or the largest energy block on Schedule 15, plus a 5% premium; its demand charges are those of the underlying
        schedule. Schedule 15''s own energy charges (PRP 0.02548, incremental 0.00260 and temporary stabilization 0.00520
        USD per kWh) apply to loads that are not New Large Loads. Billing demand is the larger of the contract demand or the
        month''s highest 15-minute demand adjusted up to a 95 percent power factor. Customer Service Policy section 2.3: "Service
        to New Large Loads will only be made pursuant to Rate Schedule No. 94"; section 8 sets the large power application,
        inquiry form and fees.'
      : 4
      ? The Commission's modification lets the customer's financial sponsor meet the collateral as a co-signer (p. 150). Ramp
        floors of 50, 65, 80 and 90 percent of contract capacity in years 1 to 4 (p. 91). The 1st Revised sheets effective
        28 August 2026 (Case 26-113-EL-ATA) are held for a license and not written.
      : 3
      ? The charges are NOVEC's distribution charges (Part B); energy supply (Part A) is bought from NOVEC under the Market
        Based Rate Option, "to be determined on a case by case basis", so no supply price is printed. Billing demand is the
        higher of the month's highest 30-minute kW or the contract minimum times the contract's ramp-up percentages; billing
        energy the higher of metered kWh or billing demand times the month's hours times 0.85. An rKVA charge of $0.16 per
        rKVA is printed beside the demand charge, and monthly fixed charge rates on contributed capital for excess facilities
        (0.442% high voltage line, 0.644% substation, 0.893% primary distribution). The minimum monthly distribution charge
        is the amount in the contract. Not for back-up or standby service. NOVEC announced a filing to update its terms and
        conditions in July 2026 (news release nr071726); this schedule is the one its Regulated Rates page links on 18 November
        2026.
      : 4
      ? The contract provisions apply to customers taking initial service and signing an ESA on or after 1 January 2027 (p.
        32); a load ramp period of up to four years within the term, with a minimum annual ramp of 20 percent (p. 32); contracted
        capacity may be reduced by up to 20 percent at no cost and by a further 30 percent if another customer assumes it,
        each on a separate 36-month notice (p. 35); PJM capacity expense excluded from the minimum generation charge (p. 34).
        Appeal pending (Dominion's Form 10-Q for the quarter ended 30 September 2026).
      : 3
      ? 'The figures are the distribution delivery charges of section IV-A-3, open to every qualifying customer (A-1 and A-2
        are closed: demand 1.68 and 2.77 USD/kW). Electricity supply is billed at the prevailing ODEC transmission level demand
        and energy rates adjusted for distribution losses, with an excess demand charge of 42.5% of ODEC''s owned resources
        demand charge, so no supply price is printed. Distribution billing demand is the greater of the month''s highest 15-minute
        kW or 500 kW. A facilities charge applies to dedicated local facilities (1.43% a month of installed cost for standard
        plant without a contribution, down to 0.82% with one). A customer may end its facilities contract by paying the unamortized
        value of the facilities plus removal.'
