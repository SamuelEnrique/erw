  on 20 November 2026 in DUKES 5.11 as saved (sheets Cover Sheet, Notes and 5.11 Full list): not found. Read again on
  27 November 2026 in DESNZ''s Electricity statistics methodology note (assets.publishing.service.gov.uk, fetched once,
  463,498 bytes), section 4.10.4: Table 5.12 separates capacity by connection to the transmission (higher voltage) or
  distribution (lower voltage) networks, from the grid connection the monthly survey records; HV and LV very likely
  name those two, but no document read pairs the letters with them, so the label does not say it.'
- 'os_reference: what the sheet''s OS Reference holds is not documented; its values mix grid references and postcode-like
  strings. Read again on 20 November 2026 in DUKES 5.11 as saved (sheets Cover Sheet, Notes and 5.11 Full list): not found.'
