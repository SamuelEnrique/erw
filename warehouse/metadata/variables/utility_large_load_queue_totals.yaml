# The codebook's metadata of table utility_large_load_queue_totals (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: utility_large_load_queue_totals
family: utility
shape: events
row: One US utility's large-load queue figure as the utility or its regulator prints it (a dated total of requested or committed
  load, or a count of requests or customers), one row a publisher, from the ERW's research file of 13 November 2026.
time: No time column; event_date is the first full date the figure's words print, else the day the document was read (x_date_kind
  says which).
vintage_rule: Merged by event_id (iso_prices.write_csv), a row of a later run replacing the one with the same event_id and
  earlier rows kept; no vintage column.
keys:
- event_id
license: public
tier: model_extracted
interval: event
source:
- name: research:large_load_2026-11-13, docs/research/large_load/utilities_2026-11-13.csv (window P4 of the portable laptop,
    sessions 5300 to 5304; method https://github.com/SamuelEnrique/erw/blob/main/docs/research/large_load/README.md); each
    row's source_url is the document it was read in. No request is made by this connector.
  url: https://github.com/SamuelEnrique/erw/blob/main/docs/research/large_load/README.md
cite: US utilities, state commissions and legislatures, read by the ERW's research pass. Large-load rules, their changes and
  the states' laws (docs/research/large_load, 13 and 14 November 2026). Via the Energy Research Warehouse (ERW), table `utility_large_load_queue_totals`.
method: docs/methods/large_load_research.md
header_title: 'US utilities'' large-load queues as each publisher prints them: a dated total of requested or committed load,
  or a count of requests, one row a publisher (session 7008, chain 301)'
header_shape: 'Shape: events (docs/datastandard.md v0). event_id llqueue:<row_id> (the rules file''s row); event_date the
  first full date the figure''s words print, else the day read (x_date_kind); event_type large_load_queue_total; status ''as
  printed''; x_figure the figure in the publisher''s words (a phrase: MW, GW, a count of requests or customers, never summed
  here) with x_figure_cite (page and words); source_url the document the figure stands in. mw empty: the files print sizes
  as phrases (x_threshold_mw).'
