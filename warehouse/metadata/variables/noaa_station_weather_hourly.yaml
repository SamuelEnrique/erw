header_title: hourly temperature and dew point at the 35 NOAA airport stations behind each grid's weighted weather, as NOAA
  measured them, 2019 to now (session 129)
header_shape: 'Shape: series (docs/datastandard.md v0), partition column ba (the grid the station stands for). entity noaa:<GHCN
  identifier>, node the airport; freq PT1H, ts_utc the hour (the reading taken in the ten minutes up to it). temperature_f
  and dew_point_f, degrees F: NOAA''s tenths of a degree C times 9/5 plus 32, to two decimals, which turns back to the tenth
  exactly. Measured values only: an hour NOAA holds no value for has no row, and no interpolated value is written (the grid
  tables interpolate runs of at most three hours and count them). 4,781,257 rows of a ceiling of 5,000,000. With this table
  the grid tables can be rebuilt with other weights on a machine that never held NOAA''s files (noaa_grid_weather.py --from-table).'
