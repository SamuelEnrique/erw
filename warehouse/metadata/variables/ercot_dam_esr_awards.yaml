# The codebook's metadata of table ercot_dam_esr_awards (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_dam_esr_awards
family: ercot
shape: series
row: One ERCOT Energy Storage Resource (a battery) in one hour of the day-ahead market, its High Sustained Limit with its
  awards and limits as ERCOT's 60-day disclosure prints them.
time: ts_utc is the start of the hour in UTC (ERCOT gives the Delivery Date and the Hour Ending in Central prevailing time).
vintage_rule: One operating day appended at a time after the last held; a day is never rewritten once held. vintage is ERCOT's
  publication time of the day's zip (the operating day plus 60 days).
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT1H
source:
- name: ercot:NP3-966-ER ERCOT, 60-Day DAM Disclosure Reports, https://www.ercot.com/mp/data-products/data-product-details?id=NP3-966-ER;
    document list
  url: https://www.ercot.com/misapp/servlets/IceDocListJsonWS?reportTypeId=13051
cite: 'Electric Reliability Council of Texas (ERCOT). 60-Day DAM Disclosure Reports (the file 60d_DAM_ESR_Data: Energy Storage
  Resources). Via the Energy Research Warehouse (ERW), table `ercot_dam_esr_awards`.'
method: docs/methods/ercot_dam_esr_awards.md
header_title: Rebuilt from the ERW archive by warehouse/restore_tables.py (session 305), as of run 20261115T160738Z-github
  (2026-11-15T16:07:38Z); that run's own header of the table follows
header_shape: 'Shape: series (docs/datastandard.md v0, Decision 40), one row per resource and hour: entity ercot:<Resource
  Name>, variable hsl_mw, value the resource''s High Sustained Limit that hour (MW), ts_utc the hour''s start (ERCOT gives
  the hour ending in Central prevailing time), node its settlement point. The awards are the x_ columns, as ERCOT prints them:
  x_energy_award_mw (Awarded Quantity; negative is a purchase, charging) and x_energy_price_usd_per_mwh (Energy Settlement
  Point Price, at the resource''s own settlement point); for each Ancillary Service its award (MW) and its MCPC (USD per MW
  per hour): regup, regdn, rrs (three kinds of award, PFR, FFR and UFR, one price), ecrs, nonspin; x_lsl_mw (the Low Sustained
  Limit, negative: charging), x_resource_status, x_qse (the scheduling entity) and x_dme. A blank award is no award and stays
  blank. The offer curve columns of ERCOT''s file are left out.'
