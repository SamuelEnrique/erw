# The codebook's metadata of table policy_actions (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: policy_actions
family: policy
shape: events
row: One policy action (a Federal Register rule, proposed rule or notice of DOE, FERC, EPA, NRC, BLM, Interior, Treasury or
  the IRS on energy, or a news release of NRC, DOE, the PUCT or the CPUC), with fields read from its record and text and a
  model's score.
time: event_date is the publication date (Register) or the release date (news), a date. text_read_at, scored_at and model_rechecked_at
  are UTC.
vintage_rule: Every run reads the Register window (from 2025-10-01) again and merges news releases; a document's printed text
  is read once.
keys:
- event_id
license: public
tier: model_extracted
interval: event
source: []
cite: California Public Utilities Commission (CPUC); Office of the Federal Register (NARA); Public Utility Commission of Texas
  (PUCT); U.S. Department of Energy (DOE); U.S. Nuclear Regulatory Commission (NRC). CPUC news; DOE newsroom (RSS); Federal
  Register documents API; NRC news releases (RSS); PUCT news releases. Via the Energy Research Warehouse (ERW), table `policy_actions`.
method: docs/methods/policy_monitor.md
header_title: 'policy actions: Federal Register rules, proposed rules and notices of DOE, FERC, EPA, NRC, BLM and Interior
  on energy, and news releases of NRC, DOE, the PUCT and the CPUC'
header_shape: 'Shape: events (docs/datastandard.md v0). event_date is the publication or release date; the columns after source_url
  are described in warehouse/connectors/policy_sources.py.'
