# The codebook's metadata of table carb_auction_allowance_prices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: carb_auction_allowance_prices
family: other_sources
shape: series
row: One cap-and-trade auction's (California, joint with Quebec) value of one result for its current-vintage or advance-vintage
  allowances.
time: ts_utc is the first day of the auction month at 00:00:00Z (the summary gives no day); freq P3M.
vintage_rule: Merged by (entity, variable, ts_utc); each run reads the whole summary and replaces every row; vintage is not
  filled.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P3M
source:
