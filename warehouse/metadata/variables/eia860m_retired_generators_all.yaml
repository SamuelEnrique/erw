# The codebook's metadata of table eia860m_retired_generators_all (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia860m_retired_generators_all
family: eia860m
shape: entities
row: One generator EIA lists as retired in its monthly inventory, Form EIA-860M (sheets Retired and Retired_PR), whatever
  its retirement year, for one vintage month.
time: No time column; vintage is EIA's month (YYYY-MM). retirement_date and status_date are the first day of EIA's retirement
  month; EIA gives months, not days.
vintage_rule: A snapshot of one vintage; a new vintage replaces the rows, but only when someone runs the connector (no schedule
  runs it).
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:860m:retired EIA-860M Monthly Update to the Annual Electric Generator Report, sheets Retired, Retired_PR (Inventory
    of Retired Generators as of August 2026; Inventory of Retired Generators as of August 2026 - Puerto Rico)
  url: https://www.eia.gov/electricity/data/eia860m/xls/august_generator2026.xlsx
cite: 'U.S. Energy Information Administration (EIA). Form EIA-860M, Monthly Update to the Annual Electric Generator Report:
  the Retired sheets, every year. Via the Energy Research Warehouse (ERW), table `eia860m_retired_generators_all`.'
method: docs/methods/eia860m_retired_generators_all.md
header_title: EIA-860M, every retired generator EIA lists, vintage 2026-08 (session 133)
header_shape: 'Shape: entities (docs/datastandard.md v0). One row per generator; entity_id eia860:<plant id>:<generator id>;
  capacity_mw is EIA nameplate capacity (MW); status_date and retirement_date are the first day of EIA''s retirement month.
  The columns of eia860m_retired_generators, which holds only the last two years'' retirements.'
