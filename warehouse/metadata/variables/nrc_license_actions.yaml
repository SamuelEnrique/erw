  event_date the renewed license''s issue date or the uprate''s approval date; event_type license_renewal (initial renewals)
  or power_uprate; parties NRC; status issued, withdrawn or approved; x_plant as the NRC writes it; x_uprate_mwt in MW thermal
  (mw empty); x_uprate_type MU, S, E or E(1).'
