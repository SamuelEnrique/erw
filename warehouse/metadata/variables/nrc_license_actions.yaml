# The codebook's metadata of table nrc_license_actions (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: nrc_license_actions
family: nrc
shape: events
row: One reactor license renewal the NRC completed (or one withdrawn application), or one power uprate the NRC approved.
time: event_date is the renewed license's issue date, the uprate's approval date, or for the withdrawn application the date
  received (a date).
vintage_rule: A snapshot, written whole by each run from the two pages; a row the NRC removes leaves the table. vintage is
  each page's last-modified time.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: nrc:license_renewals_uprates U.S. Nuclear Regulatory Commission, Status of License Renewal Applications and Approved
    Applications for Power Uprates
  url: ''
cite: U.S. Nuclear Regulatory Commission (NRC). Status of License Renewal Applications; Approved Applications for Power Uprates.
  Via the Energy Research Warehouse (ERW), table `nrc_license_actions`.
method: docs/methods/nrc_license_actions.md
header_title: U.S. Nuclear Regulatory Commission, renewed reactor licenses and approved power uprates (session 2064)
