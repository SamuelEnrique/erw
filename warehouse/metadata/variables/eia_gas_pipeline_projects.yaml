# The codebook's metadata of table eia_gas_pipeline_projects (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia_gas_pipeline_projects
family: eia
shape: events
row: One natural gas pipeline project on EIA's tracker (current or historical sheet), as of the tracker of August 2026.
time: event_date is EIA's completed date where it gives one, else 1 January of the year in service, else the date EIA last
  updated the record (x_date_basis says which).
vintage_rule: Rewritten whole by each run from the newest tracker; there is no vintage column. Ids EIA gives twice with two
  rows are left out.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: eia:naturalgas:pipeline_projects U.S. Energy Information Administration, natural gas pipeline projects
  url: https://www.eia.gov/naturalgas/data.php
cite: U.S. Energy Information Administration (EIA). Natural gas pipeline projects. Via the Energy Research Warehouse (ERW),
  table `eia_gas_pipeline_projects`.
method: docs/methods/eia_gas_pipeline_projects.md
header_title: EIA, natural gas pipeline projects, current and historical, the tracker of Aug 2026 (session 899)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id eia_gas_pipeline:<project name slug>:<year in service>; event_date
  the completed date where EIA gives one, else the year in service''s 1 January, else when EIA last updated it (x_date_basis);
  event_type pipeline_project; parties the operator; status EIA''s in lower case; x_* EIA''s columns (cost in million USD
  as EIA writes it, a range kept; capacity in MMcf/d; diameter in inches); x_sheet current or historical.'
