# The codebook's metadata of table eia860_boilers (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia860_boilers
family: eia860
shape: entities
row: One boiler at a power plant in Form EIA-860's environmental schedules for data year 2025, with its design, the emission
  standards it operates under, its compliance strategies and the generators, cooling systems, controls and stacks associated
  with it.
time: No time column; vintage is the data year (2025). status_date is the first day of the month in service (an operating
  boiler) or of retirement (a retired one), else empty.
vintage_rule: A snapshot; each run replaces the table whole with the newest final year EIA's page links, so an earlier year
  is not kept.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:eia860:boilers U.S. Energy Information Administration, Form EIA-860 Annual Electric Generator Report, environmental
    schedules
  url: https://www.eia.gov/electricity/data/eia860/
cite: U.S. Energy Information Administration (EIA). Form EIA-860 Annual Electric Generator Report, boilers, what they serve
  and what controls them. Via the Energy Research Warehouse (ERW), table `eia860_boilers`.
method: docs/methods/eia860_environment.md
header_title: EIA-860, boilers, what they serve and what controls them, data year 2025 (session 896)
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_type equipment (Decision 54); entity_id eia860_boiler:<plant>:<boiler>,
  eia860_cooling:<plant>:<cooling id> or eia860_control:<plant>:<equipment type>:<control ids>; name the plant''s name and
  the part; status from EIA''s code (x_eia_status); status_date the month in service (operating) or retired; x_* EIA''s columns,
  headings as names; the boiler''s generators, cooling systems, controls and stacks as lists joined with '';'' (x_generator_ids
  and the rest).'
