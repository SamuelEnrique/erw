- 'x_regulation_sulfur, x_regulation_nitrogen, x_regulation_particulate, x_regulation_mercury: the code XX is in the data
  but not in EIA''s layout, which lists NA for unavailable or unknown. Read again on 20 November 2026 in the 2025 zip''s LayoutY2025.xlsx
  (Field Directory: FD, ST, LO, NA), EIA-860 Form.xlsx and EIA-860 instructions.pdf: not found.'
- 'x_inservice_month: 5 rows hold 24, not a month; x_compliance_year_nitrogen and x_compliance_year_mercury hold 0 in some
  rows. Kept as EIA gives them; no document explains them. Read again on 20 November 2026 in the 2025 zip''s LayoutY2025.xlsx,
  EIA-860 Form.xlsx and EIA-860 instructions.pdf: not found.'
- 'x_nitrogen_oxide_control_*: the data writes H20 where EIA''s Table 14 writes H2O (water injection). Read again on 20 November
  2026 in EIA-860 instructions.pdf (its table lists H2O Water injection only): not found.'
