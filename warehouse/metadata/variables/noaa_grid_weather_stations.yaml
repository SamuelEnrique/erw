# The codebook's metadata of table noaa_grid_weather_stations (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: noaa_grid_weather_stations
family: noaa
shape: series
row: One of the 35 NOAA airport stations behind the grids' weighted weather (five a grid), with one figure about it (its weight,
  its metropolitan population, or its hours measured, interpolated and missing) over the span counted.
time: ts_utc is 2019-01-01T00:00:00Z, the start of the span counted; the span runs x_hours hours to x_through. freq is blank.
vintage_rule: Each run deletes the table and writes it whole, recounting over the whole span and taking the weights again
  from census_metro_population. vintage is not filled.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: ''
source:
- name: noaa:isd_lite NOAA National Centers for Environmental Information, Integrated Surface Database, ISD-Lite
  url: https://www.ncei.noaa.gov/products/land-based-station/integrated-surface-database
- name: noaa:lcd_v2 NOAA National Centers for Environmental Information, Local Climatological Data version 2
  url: https://www.ncei.noaa.gov/products/land-based-station/local-climatological-data
cite: NOAA National Centers for Environmental Information. ISD-Lite (Integrated Surface Database, hourly). Via the Energy
  Research Warehouse (ERW), table `noaa_grid_weather_stations`.
method: docs/methods/noaa_grid_weather_stations.md
header_title: the 35 NOAA stations behind each grid's weighted weather, five a grid, with each one's weight and its hours
  measured, interpolated and missing (session 126)
header_shape: 'Shape: series (docs/datastandard.md v0), partition column ba. entity noaa:<GHCN identifier>; variables weight
  (ratio: the station''s share of its grid), population_base_2020 (count: the Census Bureau''s estimates base of its metropolitan
  area x_cbsa, a code with a state after a colon where a part is counted), hours_measured, hours_interpolated, hours_missing,
  longest_gap_hours, dew_point_hours_missing (count), over x_hours hours from ts_utc to x_through. x_name, x_lat and x_lon
  are NOAA''s (isd-history.csv); x_metro is the metropolitan area the station stands for.'
