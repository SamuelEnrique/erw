# The codebook's metadata of table eia861_operational_data (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia861_operational_data
family: eia861
shape: series
row: One utility's peak demand, one source or disposition of its energy, or one kind of its revenue, in one state, for one
  year, from Form EIA-861's operational data file.
time: ts_utc is the data year's 1 January at 00:00:00Z (a year, not an instant); freq P1Y.
vintage_rule: A run reads the years given with --years and writes the table whole; vintage is not filled. EIA's aggregates
  88888 and 99999 left out; a '.' cell has no row.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: eia:eia861:operational_data U.S. Energy Information Administration, Form EIA-861 Annual Electric Power Industry Report
    (Operational_Data_<year>.xlsx)
  url: https://www.eia.gov/electricity/data/eia861/
cite: U.S. Energy Information Administration (EIA). Form EIA-861 Annual Electric Power Industry Report, operational data.
  Via the Energy Research Warehouse (ERW), table `eia861_operational_data`.
method: docs/methods/eia861_operations.md
header_title: EIA-861 operational data, each utility's peak demand, sources and dispositions of energy and revenue, by state,
  a year (session 882)
header_shape: 'Shape: series (docs/datastandard.md v0). entity eia861_op:<utility>:<state>; variables summer_peak_demand and
  winter_peak_demand (MW); net_generation, wholesale_purchases, exchange_received, exchange_delivered, exchange_net, wheeled_received,
  wheeled_delivered, wheeled_net, transmission_by_others_losses, total_sources (MWh, the sources of energy); retail_sales,
  sales_for_resale, furnished_without_charge, consumed_without_charge, energy_losses, total_disposition (MWh); revenue_retail_sales,
  revenue_delivery_customers, revenue_sales_for_resale, revenue_credits_adjustments, revenue_transmission, revenue_other,
  revenue_total (USD, EIA''s thousand dollars times 1,000); net figures can be negative; ts_utc the data year''s 1 January;
  freq P1Y; node the utility''s name; x_data_type O observed, I imputed.'
