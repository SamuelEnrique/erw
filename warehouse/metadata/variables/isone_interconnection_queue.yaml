table: isone_interconnection_queue
family: isone
shape: entities
row: One position (a request, or a unit or phase of one) in ISO-NE's interconnection queue of generation and other projects
  asking to connect to the grid.
time: No time column. Dates are ISO-NE's, YYYY-MM-DD; vintage is the retrieval date. The table is a snapshot of the queue
  as read on its retrieved_at.
vintage_rule: A snapshot rewritten whole by each run (Mondays); earlier queues are kept in the archive and the raw files.
keys:
- entity_id
license: public
tier: source
interval: snapshot
