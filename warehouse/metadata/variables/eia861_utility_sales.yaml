table: eia861_utility_sales
family: eia861
shape: series
row: One utility's retail sales, revenue or customers in one state, one part of Form EIA-861, one balancing authority and
  one customer sector, for one year.
time: ts_utc is the data year's 1 January at 00:00:00Z (a year, not an instant); freq P1Y.
vintage_rule: A run writes one data year; the table is merged on (entity, variable, ts_utc), a later run replacing a row with
  the same key and keeping every other row. vintage is not filled. Observed rows only (imputed rows, EIA's 88888 and 99999
  aggregates and '.' cells are not taken).
