# The codebook's metadata of table attention_story_links (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: attention_story_links
family: erw_derived
shape: events
row: 'One classified news story behind the Attention and Friction indices: its week, sector, place, opposition, kind, tone
  and link.'
time: event_date is the story's publish time, UTC; week is the Monday 00:00Z of its week.
vintage_rule: Merged by event_id on each run, the newest classification of a story kept (by classified_at); rows of earlier
  runs not rewritten are kept.
keys:
- event_id
license: public
tier: model_extracted
interval: event
source: []
cite: 'Energy Research Warehouse (ERW). The Attention and Friction indices: coverage and opposition by week, sector and place,
  from the classified news stories (the ERW''s own derivation). Via the Energy Research Warehouse (ERW), table `attention_story_links`.'
method: docs/methods/attention.md
header_title: the stories behind the Attention and Friction indices, one row a classified story (session 3402)
header_shape: 'Shape: events (docs/datastandard.md v0), event_type attention_link; event_date is the story''s publish time,
  UTC; week is the Monday 00:00Z of its week; geo is US-<state> where the story names one state, US where it is about the
  United States, else empty; opposition, kind and tone are the model''s reading of the title and summary; fixed names any
  value the code emptied.'
