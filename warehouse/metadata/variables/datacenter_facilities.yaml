# are defined in _shared.yaml.
table: datacenter_facilities
family: datacenter
shape: entities
row: One datacenter facility the ERW knows of, joined from three kinds of source (news stories, the operators' own lists,
  the ISO interconnection queues) with duplicates removed by operator plus location (the datacenter power tracker, platform
  tool 4).
time: No time column; a snapshot, vintage the build's date (YYYY-MM-DD) and retrieved_at its time in UTC. first_story_at is
  the UTC time of the first news story.
vintage_rule: Rewritten whole as a snapshot by each run of the builder (warehouse/derived/datacenter_facilities.py) from its
  input tables.
keys:
- entity_id
license: public
tier: model_extracted
interval: snapshot
source: []
