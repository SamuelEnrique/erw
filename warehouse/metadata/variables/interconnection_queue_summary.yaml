header_title: the interconnection queue summarized by grid and technology (session 95)
header_shape: 'Shape: series (docs/datastandard.md v0). freq P1Y. Entity queue:<grid>:<technology>. By year entered (ts_utc
  the first day of that year): requests_entered, mw_entered and requests_ and mw_ for active, suspended, operating, withdrawn.
  By operation year: on_median_years_to_operation, on_requests_dated. For the whole file (ts_utc 2025-01-01): total_, past_
  and median_years_to_operation. Definitions: docs/methods/interconnection_queue_summary.md.'
