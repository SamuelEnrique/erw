- entity
- variable
- ts_utc
license: public
tier: derived
interval: P1Y
source:
- name: 'erw:interconnection_queue_summary from lbnl:queued_up, Lawrence Berkeley National Laboratory and GridTracker, Queued
    Up: 2026 Edition data file'
