# The codebook's metadata of table interconnection_queue_summary (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: interconnection_queue_summary
family: interconnection
shape: series
row: One grid and technology's count, MW, share or median of interconnection requests, by year entered, by year operation
  began, or for the whole file, from Berkeley Lab's Queued Up file (2026 edition).
time: ts_utc is the first day of the year entered (requests_ and mw_ variables), of the year operation began (on_ variables),
  or 2025-01-01 for the whole file; a year, not an instant. freq P1Y.
vintage_rule: Rewritten whole by each run of the builder (warehouse/derived/queue_summary.py) from lbnl_interconnection_queue;
  vintage is not filled.
