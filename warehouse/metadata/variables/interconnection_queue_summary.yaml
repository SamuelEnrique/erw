cite: Energy Research Warehouse (ERW), derived. The interconnection queue summarized by grid and technology, from Berkeley
  Lab and GridTracker's Queued Up data file (CC BY 4.0). Via the Energy Research Warehouse (ERW), table `interconnection_queue_summary`.
