# The codebook's metadata of table ilr_luxembourg_electricity (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ilr_luxembourg_electricity
family: other_sources
shape: series
row: One month's or year's value of one Luxembourg electricity measure (withdrawals by customer class, generation, capacity,
  injection, trade, customers, self-consumption), from the regulator ILR's statistics workbook.
time: ts_utc is the month's or the year's first day at 00:00:00Z (customers at 31 December of the year); freq P1M or P1Y.
vintage_rule: Rewritten whole as one snapshot by each run from ILR's workbook; vintage is the workbook's last-modified time;
  the current year's months carry x_status provisional.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1M;P1Y
source:
- name: ilr:donnees-statistiques-electricite ILR, Donnees statistiques du secteur d'electricite (Tableau de bord), data.public.lu
  url: https://data.public.lu/fr/datasets/donnees-statistiques-du-secteur-delectricite-ilr/
cite: Institut Luxembourgeois de Regulation (ILR). Donnees statistiques du secteur d'electricite (data.public.lu). Via the
  Energy Research Warehouse (ERW), table `ilr_luxembourg_electricity`.
method: docs/methods/ilr_luxembourg_electricity.md
header_title: ILR (Institut Luxembourgeois de Regulation), Luxembourg's electricity sector statistics, 2017 to 2026-06 (session
  2392)
header_shape: 'Shape: series (docs/datastandard.md v0). entity ilr:lu:<class, source or neighbour>; variable the block; unit
  MWh (kWh / 1,000), MW (kW / 1,000) or count; ts_utc the month''s or the year''s first day (customers: at 31 December of
  the year); freq P1M or P1Y; geo LU; node ILR''s label; x_block the sheet and block; x_status provisional for the current
  year''s months. Totals and parts are ILR''s: a sum takes one level.'
