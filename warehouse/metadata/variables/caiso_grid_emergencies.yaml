# The codebook's metadata of table caiso_grid_emergencies (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: caiso_grid_emergencies
family: caiso
shape: events
row: One CAISO grid emergency notice (Flex Alert, Restricted Maintenance Operations, Energy Emergency Alert, stage emergency,
  transmission emergency and others) for one region, time frame and local day it covered.
time: event_date is the local (Pacific) day the notice covered; a notice of several days is one row a day, because CAISO counts
  days.
vintage_rule: Rewritten whole by each run from the report's current revision, so CAISO's changes to past years are taken.
  The table has no retrieved_at column; the header names the run and the report's revision date.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: caiso:grid_emergencies_history California ISO, Grid Emergencies History Report (1998 to present)
  url: https://www.caiso.com/documents/grid-emergencies-history-report-1998-to-present.pdf
cite: California Independent System Operator (CAISO). Grid Emergencies History Report (1998 to present). Via the Energy Research
  Warehouse (ERW), table `caiso_grid_emergencies`.
method: docs/methods/caiso_grid_emergencies.md
header_title: CAISO grid emergencies, every Flex Alert, Restricted Maintenance Operations notice, Energy Emergency Alert,
  stage emergency and transmission emergency in CAISO's Grid Emergencies History Report (session 58)
header_shape: 'Shape: events (docs/datastandard.md v0, decision 35). One row per notice type, region, time frame and local
  (Pacific) day covered; event_type is CAISO''s notice type (flex_alert, rmo, transmission_emergency, eea_watch, eea1 to eea3,
  alert, warning, stage1 to stage3, vlrp, load_interruption; Power Watch filed under flex_alert). x_label: the notice''s name
  as printed; x_layout: the reader the row came from (records, stages, day_lists or matrix); x_page: its page.'
