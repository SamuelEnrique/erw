# are defined in _shared.yaml.
table: eia860m_retired_generators
family: eia860m
shape: entities
row: One generator retired in the vintage year or the year before, from EIA's monthly inventory, Form EIA-860M, for one vintage
  month.
time: No time column; vintage is EIA's month (YYYY-MM). retirement_date and status_date are the first day of EIA's retirement
  month.
vintage_rule: A snapshot of one vintage; a new vintage replaces its rows. Earlier vintages are in the raw files and the archive.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
