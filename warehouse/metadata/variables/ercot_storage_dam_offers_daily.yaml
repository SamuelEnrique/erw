header_shape: 'Shape: series (docs/datastandard.md v0); freq P1D, ts_utc the operating day (local, Central) at 00:00:00Z;
  one entity, ercot:esr_fleet. A MWh here is a MW for an hour: of limit (limit_mwh and its parts: _out, _no_offer, _no_offer_out,
  _energy_offer, _as_offer, _award), of capacity offered or awarded, or of energy. Energy, from each resource''s Energy Bid/Offer
  Curve: energy_offer_mwh (the most the curves offer to sell), energy_offer_mwh_le_<P> (what they offer at P USD per MWh or
  less, P in 0, 25, 50, 100, 250, 1000), energy_offer_mwh_at_clearing (at the hour''s own day-ahead price at the resource''s
  settlement point), energy_bid_mwh and energy_bid_mwh_at_clearing (the charging side), energy_sold_mwh and energy_bought_mwh
  (the awards). Ancillary Services (regup, regdn, rrs, ecrs, nspin), from the offer blocks: <service>_offer_mwh, _offer_mwh_le_mcpc
  (priced at or below the hour''s clearing price), _offer_mwh_le_<P> (P in 1, 5, 20, 100, 1000 USD per MW), _award_mwh, _award_usd,
  and _unawarded_usd (offered less awarded, each resource and hour, at the hour''s clearing price). as_offer_mwh counts each
  block once; a block can be priced for several services. as_offer_mwh_unlisted: blocks offered by a resource with no row
  in ERCOT''s ESR data file that hour, in no other sum. Counts: resources, resource_hours and its parts.'
