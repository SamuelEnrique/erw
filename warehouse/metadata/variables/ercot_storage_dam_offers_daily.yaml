table: ercot_storage_dam_offers_daily
family: ercot
shape: series
row: What ERCOT's Energy Storage Resources offered in the day-ahead market, and how much of it was awarded, summed over one
  operating day for the whole fleet.
time: ts_utc is the operating day (local, Central) at 00:00:00Z. A MWh here is a MW for an hour, of limit, offered or awarded
  capacity, or energy.
vintage_rule: A day added is appended, and a day already held is replaced whole by its new rows; a rebuild from the zips rewrites
  the table. vintage is ERCOT's publication of the day's disclosure (the operating day plus 60 days).
