# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_4cp_intervals
family: ercot
shape: series
row: One of ERCOT's four coincident peaks of a year (the 15-minute interval of the system's highest load in each summer month,
  June to September) with ERCOT's load in it.
time: ts_utc is the interval's start in UTC, 15 minutes before the time ERCOT prints, read as the interval's end in Central
  prevailing time.
vintage_rule: Each write deletes the file and builds the table again from every saved workbook. vintage is the list's posting
  date at 00:00:00Z; empty for the years of the 1996-2020 zip.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT15M
source:
- name: 'ercot:NP9-83-M ERCOT, Four Coincident Peak Calculations (report type 13037; prior years: the page''s Key Documents)'
  url: https://www.ercot.com/mktinfo/data_agg/4cp
cite: Electric Reliability Council of Texas (ERCOT). Four Coincident Peak Calculations (NP9-83-M; the years before 2021 from
  the page's 1996-2020 zip). Via the Energy Research Warehouse (ERW), table `ercot_4cp_intervals`.
method: docs/methods/ercot_4cp_intervals.md
