  Four Coincident Peak Load Calculation (the sum of the load entities'' load in the month''s coincident-peak interval; DC
  tie exports, block load transfer exports and wholesale storage load excluded, as ERCOT''s note says); ts_utc the interval''s
  start, freq PT15M; x_interval_local the time ERCOT prints, read as the interval''s end in Central prevailing time; x_month
  the month; x_published ERCOT''s posting date of the workbook (empty for the years of the 1996-2020 zip, which states none);
  x_document the workbook.'
