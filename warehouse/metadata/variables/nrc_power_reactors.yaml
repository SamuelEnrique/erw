# The codebook's metadata of table nrc_power_reactors (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: nrc_power_reactors
family: nrc
shape: entities
row: One US power reactor unit, operating (on the NRC's List of Power Reactor Units) or in decommissioning (the NRC's decommissioning
  dataset), with the NRC datasets' licensing dates and capacity.
time: No time column; status_date is the shutdown date for a retired unit. vintage is when the NRC's list or dataset was published
  or modified (UTC).
vintage_rule: A snapshot; each run replaces the table whole, asking for the list again and reusing the saved datasets.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: nrc:power_reactors U.S. Nuclear Regulatory Commission, List of Power Reactor Units and the operating and decommissioning
    reactors datasets
  url: https://www.nrc.gov/reactors/operating/list-power-reactor-units.html
cite: U.S. Nuclear Regulatory Commission (NRC). List of Power Reactor Units; operating and decommissioning reactors datasets.
  Via the Energy Research Warehouse (ERW), table `nrc_power_reactors`.
method: docs/methods/nrc_power_reactors.md
header_title: the NRC's power reactor units, operating (the NRC's list) and in decommissioning (the NRC's dataset), with the
  operating reactors dataset's licensing dates and capacity (session 925)
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id nrc_reactor:<docket number>; entity_type generator (a
  reactor unit); geo US-<state>; capacity_mw the operating dataset''s Capacity MWe; status operating (on the list) or retired
  (in decommissioning, status_date its shutdown); operator the list''s owner and operator; x_* the list''s and the datasets''
  fields, x_dataset_year the datasets'' Year of Update.'
