# The codebook's metadata of table interconnection_durations_summary (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: interconnection_durations_summary
family: interconnection
shape: series
row: One grid's (or the whole US's) measure of how long the interconnection requests that began operating in one year took
  from request to operation, from Berkeley Lab and GridTracker's Queued Up, 2026 edition (through 2025).
time: ts_utc is 1 January of the year the projects began operating (a year, not an instant); freq P1Y.
vintage_rule: Rebuilt whole from lbnl_interconnection_queue by each run of the builder; one edition; vintage is not filled.
keys:
- entity
- variable
- ts_utc
license: public
tier: derived
interval: P1Y
source:
- name: lbnl:queued_up Lawrence Berkeley National Laboratory and GridTracker, Queued Up data file
  url: https://eta-publications.lbl.gov/publications/queued-2026-edition-characteristics
cite: Energy Research Warehouse (ERW), derived. Interconnection request to operation, completed projects, from Berkeley Lab's
  Queued Up file (docs/methods/interconnection_durations.md). Via the Energy Research Warehouse (ERW), table `interconnection_durations_summary`.
method: docs/methods/interconnection_durations.md
header_title: interconnection request to operation by grid and year of operation, 2026 edition (through 2025) (session 671)
header_shape: 'Shape: series (docs/datastandard.md v0). entity lbnl_durations:<grid> (the seven ISOs, west, southeast, us);
  variables median_months, p25_months, p75_months (unit month: 30.4375 days), projects (count), mw (MW), median_months_5y
  and projects_5y (the five years ending ts_utc''s year); ts_utc 1 January of the year the projects began operating; freq
  P1Y.'
