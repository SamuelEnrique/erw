# The codebook's metadata of table noaa_ncei_billion_disasters (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: noaa_ncei_billion_disasters
family: noaa
shape: events
row: One U.S. weather or climate disaster of 1980 to 2024 whose cost reached a billion dollars, from NOAA NCEI's Billion-Dollar
  Weather and Climate Disasters (the product retired in 2025).
time: event_date is the disaster's begin date; x_end_date its end.
vintage_rule: A snapshot written whole each run; the file is reused from the raw files once saved, as the retired record no
  longer changes. No vintage column.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: 'noaa:billion_dollar_disasters NOAA National Centers for Environmental Information (NCEI) U.S. Billion-Dollar Weather
    and Climate Disasters (2025), https://www.ncei.noaa.gov/access/billions/, DOI: 10.25921/stkw-7w73'
  url: https://www.ncei.noaa.gov/access/billions/
cite: NOAA National Centers for Environmental Information (NCEI). U.S. Billion-Dollar Weather and Climate Disasters, events
  1980 to 2024 (retired 2025). Via the Energy Research Warehouse (ERW), table `noaa_ncei_billion_disasters`.
