table: texas_delivery_charges
family: erw_derived
shape: events
row: One charge figure (a delivery charge for a load at transmission voltage) as a Texas wires utility's Tariff for Retail
  Delivery Service, or a Public Utility Commission of Texas filing, prints it.
time: event_date is the effective date printed on the figure's page where it reads as a date, else the day the document was
  retrieved (event_date_basis says which).
vintage_rule: Merged by event_id (the document and a hash of page, class, charge, figure and line); a run that reads a document
  again replaces its rows with the same key. No vintage column.
keys:
- event_id
license: internal
tier: model_extracted
interval: event
source:
- name: 'oncor:retail_delivery_tariff, Tariff for Retail Delivery Service, Oncor Electric Delivery Company LLC (https://www.oncor.com/content/dam/oncorwww/documents/about-us/regulatory/tariff-and-rate-schedules/Tariff%20for%20Retail%20Delivery%20Service.pdf.coredownload.pdf,
    retrieved 2026-10-07T01:36:32Z); centerpoint:retail_delivery_tariff, Tariff for Retail Delivery Service, CenterPoint Energy
    Houston Electric, LLC (https://assets.centerpointenergy.com/api/public/content/houston-electric-tariff-for-retail-delivery-service.pdf,
    retrieved 2026-10-07T01:37:07Z); aeptexas:retail_delivery_tariff, Tariff for Retail Delivery Service, AEP Texas (https://www.aeptexas.com/lib/docs/ratesandtariffs/Texas/AEP_TEXAS_TARIFF_Eff_Sept_29_2026v1.pdf,
    retrieved 2026-10-07T01:37:09Z); tnmp:retail_delivery_tariff, Tariff for Retail Delivery Service, Texas-New Mexico Power
    Company (the file the Commission''s rates page links) (https://tnmp.com/sites/default/files/inline-images/TNMP%20Retail%20Tariff%20%2820251229%29_0.pdf,
    retrieved 2026-10-07T01:42:57Z); puct:wholesale_transmission_charges, Docket No. 57491, Commission Staff''s Petition to
    Set 2025 Wholesale Transmission Service Charges for the Electric Reliability Council of Texas, Inc., item 53 (the latest
    year with a final order: Docket No. 59080, the 2026 charges, was remanded on 4 June 2026 and has none in the filing list
    read on 2026-10-07) (https://interchange.puc.texas.gov/Documents/57491_53_1486508.PDF, retrieved 2026-10-07T01:42:36Z)'
  url: https://interchange.puc.texas.gov/Documents/57491_53_1486508.PDF
cite: 'AEP Texas Inc.; CenterPoint Energy Houston Electric, LLC; Oncor Electric Delivery Company LLC; Public Utility Commission
  of Texas; Texas-New Mexico Power Company. Docket No. 57491, Commission Staff''s Petition to Set 2025 Wholesale Transmission
  Service Charges for the Electric Reliability Council of Texas, Inc., item 53 (the latest year with a final order: Docket
  No. 59080, the 2026 charges, was remanded on 4 June 2026 and has none in the filing list read on 2026-10-07). Reuse, as
  read 2026-10-07 at https://www.puc.texas.gov/agency/about/policies/: "the Site Policies page read is an index and prints
  only: Copyright (c) 2026 Public Utility Commission of Texas; its Link Policy page, which states the reuse rule, was not
  read (the 14 documents allowed were used); held internal until a person reads it"; Tariff for Retail Delivery Service, AEP
  Texas. Reuse, as read 2026-10-07 at https://www.aep.com/terms/: "You may not copy or display for redistribution to third
  parties for commercial purposes any portion of the content without the prior written permission of AEP."; Tariff for Retail
  Delivery Service, CenterPoint Energy Houston Electric, LLC. Reuse, as read 2026-10-07 at https://www.centerpointenergy.com/en-us/about-us/legal/terms-of-use:
  "Except as otherwise permitted under these Terms of Use, you agree not to copy, reproduce, modify, create derivative works
  from, or store any Content, in whole or in part, from the Service or to display, perform, publish, distribute, transmit,
  broadcast or circulate any Content to anyone, or for any commercial purpose, without the express prior written consent of
  CenterPoint."; Tariff for Retail Delivery Service, Oncor Electric Delivery Company LLC. Reuse, as read 2026-10-07 at https://www.oncor.com/content/oncorwww/us/en/home/legal.html:
  "You may copy, display and distribute Content, without modification, enhancement, customization, or reformatting of any
  kind, for personal, noncommercial, and/or educational purposes only"; Tariff for Retail Delivery Service, Texas-New Mexico
  Power Company (the file the Commission''s rates page links). Reuse, as read 2026-10-07: "no terms page read: tnmp.com answered
  HTTP 403 to its rates page on 2026-10-07, and the 14 documents allowed were used; held internal until a person reads TNMP''s
  terms". Via the Energy Research Warehouse (ERW), table `texas_delivery_charges`.'
