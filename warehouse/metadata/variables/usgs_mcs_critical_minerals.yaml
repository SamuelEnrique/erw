# The codebook's metadata of table usgs_mcs_critical_minerals (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: usgs_mcs_critical_minerals
family: usgs
shape: series
row: One statistic of one energy-transition mineral (U.S. salient statistics, world production, reserves or capacity by country,
  or a U.S. import source's share) for one year, or for 2021 to 2024, from the USGS Mineral Commodity Summaries 2026 data
  release.
time: ts_utc is the year's 1 January at 00:00:00Z (freq P1Y); the import shares cover 2021 to 2024 (ts_utc 2021-01-01, freq
  P4Y). 2025 is USGS's estimate.
vintage_rule: A snapshot of one edition; each run replaces the table whole. A new edition is a new ScienceBase item. vintage
  is the file's time (one value).
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y;P4Y
source:
- name: usgs:mcs_2026_data U.S. Geological Survey, 2026, Mineral Commodity Summaries 2026 Data Release, Commodity Salient
    U.S. and World Statistics; Mineral commodity summaries 2026
  url: https://www.sciencebase.gov/catalog/item/69837e43b66b01367d7ec7c7
cite: U.S. Geological Survey (USGS). Mineral Commodity Summaries 2026 Data Release, Commodity Salient U.S. and World Statistics.
  Via the Energy Research Warehouse (ERW), table `usgs_mcs_critical_minerals`.
method: docs/methods/usgs_mcs_critical_minerals.md
header_title: 'U.S. Geological Survey, Mineral Commodity Summaries 2026: the minerals of the energy transition (lithium, cobalt,
  nickel, graphite, copper, the rare earths, aluminum, gallium, germanium, indium, manganese, the platinum-group metals, silicon,
  tellurium, vanadium), U.S. salient statistics, import sources and world mine production and reserves by country (session
  954)'
header_shape: 'Shape: series (docs/datastandard.md v0). entity usgs_mcs:<chapter>:<country>:<the statistic''s detail>; variables
  production, import, export, consumption, price, stock, employment, net_import_reliance, reserves, capacity, shipment, supply,
  import_share (2021 to 2024: ts_utc 2021-01-01, freq P4Y); units t (metric tons: thousand metric tons times 1,000, kilograms
  over 1,000), USD/t, USD/kg (troy ounces converted at 31.1034768 g), USD/lb (cents per pound over 100), pct, count; what
  is weighed (a content or a gross weight) is in the node; ts_utc the year''s 1 January; freq P1Y; geo US for the United States,
  empty elsewhere.'
