  values:
    distinct: 4788
    examples:
    - '"06.27.2024: [REDACTED_NAME], As per 30 CFR 250.190, Talos Third Coast LLC respectfully submits the final investigation
      report as a follow up to the initial submittal of a crane / material handling incident at the MP-138G (G16500) facility
      on 06.14.2024 at 12:45 hours. After reviewing the report and corrective actions, if further clarification is necessary,
      Talos Operations and HSE can schedule a call into the New Orleans District office at the district''s convenience. Total
      Cost: $200.00 USD, repair light fixture wiring and replace safety cage. 06.14.2024 As required by 30 CFR 250.188(a)(8),
      Talos Third Coast LLC submits the initial notification of a crane / material handling incident that occurred on MP-138G
      (G16500) at 12:45hours on 06/14/2024. Incident Description: While operating the crane on a blind lift from boat to production
      deck, crane operator bumped light fixture with tool box load breaking the coupling and casing light to fall. No personnel
      were injured in the incident. Talos Third Coast LLC. will provide a written follow up report upon completion of the
      incident investigation as required by 30 CFR 250.190. "'
    - '"This is initial and final report." Event During backloading operations, the handrail of a gangway contacted a suspended
      550-gallon tote tank of engine oil. Event Description - Sequence / Timeline On February 8, 2023, backloading operations
      were underway utilizing Drill side crane of the EI 314 A Facility. . At approximately 08:00HRS; the marine vessel (M/V)
      Wildcat transitioned from EI 314 A Production side, under crane, to the Drill side crane. . During the transition the
      rigger attached the hook of the Drill side crane to a full 550-gallon tote tank of engine oil. . The crane operator
      then hoisted the tote tank and positioned it over the water awaiting the M/V to move into position to receive it. .
      While the load was held in position the M/V began to reverse toward the platform and under the load. . Once in position
      to receive the load the M/V was exposed to side sea conditions which swayed the vessel up during side-to-side (transverse
      axis) movements. . At that time, the bottom of the tote tank encountered one of the handrails of a gangway. . As the
      boat leveled to its original elevation, the crane operator lifted the load slightly then swung the tote tank to the
      left, away from the gangway and then lowered the tote tank to the deck of the M/V. . Once backloading operations were
      complete the crane operator reported the event to the Person-in-Charge (PIC) on the platform and then the Field Foreman
      and AOL''s incident reporting requirements were initiated which included reporting the incident to the Field Foreman,
      Production Forman, and HSE Coordinator for investigation. Event Consequences 1. Gangway handrail was bent downward,
      and a weld was broken on the base of a socket which connects the handrail to the walking plank. There were no environmental
      impacts, or injuries to personnel because of this event. Reference Final Report Attachment.'
    - '"This is initial and final report."_x000D_ _x000D_ Event: _x000D_ A production operator noticed a cotton cloth/rag
      smoldering inside of a wheelbarrow that included filtration media material and used paint that was curing for non-hazardous
      disposal._x000D_ _x000D_ Event Description - Sequence / Timeline:_x000D_ 15:25HRS 05/14/2022 EI 314 C a facility stop-work
      was initiated when a production operator identified a smoldering cotton cloth/rag inside of a wheelbarrow designated
      as a collection pan for paint operations waste. The operator immediately reacted with water to saturate the rag and
      other items from any further stage of reaction._x000D_ _x000D_ 15:30HRS A safety stand-down meeting was conducted, and
      production and paint operations personnel were in attendance to review the finding and establish a plan forward._x000D_
      _x000D_ 17:00HRS Ultimate-work-authority (UWA) approved resumption of painting operations._x000D_ _x000D_ 08:00HRS 05/15/2022
      A Microsoft Teams meeting was organized by Facilities Maintenance Management and representatives of current AOL painting
      operations in various contractor roles were in attendance. During the meeting the event was reviewed, and discussions
      of prevention were communicated to all affected and unaffected painting crews so that everyone was aware of the expectation
      for reviewing and referencing safety data sheets, various risk affiliated with chemicals that contain reactive properties,
      and onsite management planning and control._x000D_ _x000D_ Event Consequences:_x000D_ All facility operations were halted
      for investigation and a safety stand-down meeting was conducted to review the smoldering cloth/rag finding and identify
      a safe path forward._x000D_ _x000D_ Emergency muster actions did not occur and there was no injury, property damage
      or environmental impact because of this event._x000D_'
    - '"This is the Initial and Final Report." Event Description - Sequence / Timeline On January 21, 2023, crane operations
      were underway utilizing the main crane located on the west of the EI 330 B Facility. At the time of the event, manifested
      materials were being offloaded from the marine vessel (M/V) on to the platform. . At approximately 18:50HRS; the M/V
      deckhand hooked the auxiliary line of the crane to a four-barrel drum rack (1,000 lbs.) that contained (4) empty DOT
      Drums and then provided a hoist hand signal to the crane operator. As the load was ascending, at approximately 1.5''-
      4'' FT off the back deck of the M/V, it contacted a tote tank and the securing binding chain of the tote tank. The binding
      chain and the sling assembly of a tote tank is where the initial load contact happened. As a result, the D-Style keeper
      pin inserted to secure the drum rack''s door closed was damaged, failed, and the door opened. The drum rack''s door
      then caught the interior railing of the M/V and (2) empty drums fell out of the drum rack. The crane operator and the
      boat captain conversed by radio and decided to continue with the lift, and the drum rack was offloaded and received
      on the platform. . The crane operator immediately reported the event to the Person-in-Charge (PIC) on the platform and
      then the Field Foreman and AOL''s incident reporting requirements were initiated which included reporting the incident
      to the Field Foreman, Production Forman, and HSE Coordinator for investigation. Event Consequences 1. D-Style keeper
      pin was damaged resulting into failure. 2. Contents of the load became unsecured, and a portion fell to the deck of
      the M/V. 3. Barrel drum rack door hinge was damaged. There were no environmental impacts, or injuries to personnel because
      of this event.'
    - '"This is the initial and final report."_x000D_ _x000D_ Event Description:_x000D_ On March 14, 2024, at approximately
      08:05HRS a lifting team was conducting a planned and authorized blind lift affiliated with deck-to-deck crane operations.
      While performing a load control maneuver during the lift, the auxiliary ball latch encountered a structural member of
      the deck therefore damaging the latch. The crane operator completed the lift, the equipment was inspected, and damage
      to the positive latch was identified therefore the auxiliary winch was placed out-of-service until the damaged component
      can be replaced. _x000D_ _x000D_ Event Consequences:_x000D_ Damage to the positive latch assembly. _x000D_ . The estimated
      property damage value was $57.00. _x000D_ _x000D_ There were no injuries to personnel or environmental impacts because
      of this event. _x000D_ _x000D_ _x000D_ "Please reference the report attachment for additional details of the incident
