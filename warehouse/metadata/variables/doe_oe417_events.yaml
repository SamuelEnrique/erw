# The codebook's metadata of table doe_oe417_events (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: doe_oe417_events
family: doe
shape: events
row: One report of an electric emergency incident or disturbance in DOE's yearly summaries of Form DOE-417 (formerly OE-417),
  2016 to 2025; DOE's summaries can list one event under several reports.
time: No time column; event_date is the day the event began. Days and times in the x_ columns are local as printed (the summaries
  name no zone).
vintage_rule: Built whole and replaced each run; a year's workbook already saved is reused, so a revision is not read until
  the raw file is gone. vintage is the workbooks' Last-Modified.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: doe:oe417 U.S. Department of Energy, DOE-417 Annual Summaries
  url: https://doe417.pnnl.gov/
cite: 'U.S. Department of Energy (DOE). Office of Cybersecurity, Energy Security, and Emergency Response (CESER), Electric
  Emergency Incident and Disturbance Reports (Form DOE-417): Annual Summaries. Via the Energy Research Warehouse (ERW), table
  `doe_oe417_events`.'
method: docs/methods/doe_oe417_events.md
header_title: 'U.S. Department of Energy, Office of Cybersecurity, Energy Security, and Emergency Response, Electric Emergency
  Incident and Disturbance Reports (Form DOE-417, formerly OE-417), the yearly summaries 2016 to 2025: each reported event''s
  start, restoration, area, NERC region, alert criteria, event type, demand lost and customers affected (session 2028)'
header_shape: 'Shape: events (docs/datastandard.md v0). event_id doe417:<year>-<row in the year''s summary>; event_date the
  day the event began; event_type the first event type the summary lists, lower case with underscores (x_event_types all it
  lists, in its order, without the form''s label for its comment box; x_event_type_as_published its words); mw the demand
  lost in MW where the summary prints a number; status restored where a restoration day is printed; x_ the summary''s fields
  as printed (days and times local, the summaries name no zone).'
