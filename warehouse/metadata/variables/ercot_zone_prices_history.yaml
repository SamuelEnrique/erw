# The codebook's metadata of table ercot_zone_prices_history (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_zone_prices_history
family: ercot
shape: series
row: ERCOT's settlement point price at one load zone for one interval of one operating year from 2015, day-ahead (hourly,
  eight load zones) or real-time (15-minute, the four competitive load zones).
time: ts_utc is the interval start in UTC; the year is ERCOT's operating year in Central time. The hour the clocks repeat
  in autumn is two distinct UTC hours.
vintage_rule: Merged by (entity, variable, ts_utc); ERCOT posts the current year's workbook again each week, and a later copy
  replaces that year's rows. vintage is ERCOT's document publish time.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT15M;PT1H
source:
- name: ERCOT NP4-180-ER Historical DAM Load Zone and Hub Prices
