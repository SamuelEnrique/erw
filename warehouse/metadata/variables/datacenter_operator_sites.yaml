# are defined in _shared.yaml.
table: datacenter_operator_sites
family: datacenter
shape: entities
row: One datacenter site (a region, campus, facility or announced site) on one of nine operators' own public lists (AWS, Microsoft,
  Google, Meta, Oracle, Digital Realty, Equinix, Vantage, Switch).
time: No time column; one snapshot a run, vintage the run's date (YYYYMMDD) and retrieved_at its time in UTC.
vintage_rule: Each full run replaces the table (a site an operator no longer lists leaves it); a run with --only replaces
  only those operators' rows; sites repeated within a run are kept once.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source: []
cite: Amazon Web Services; Digital Realty; Equinix; Google; Meta; Microsoft; Oracle; Switch; Vantage Data Centers. Amazon
