  of data center sites and regions; Microsoft public list of data center sites and regions; Oracle public list of data center
  sites and regions; Switch public list of data center sites and regions; Vantage Data Centers public list of data center
  sites and regions. Via the Energy Research Warehouse (ERW), table `datacenter_operator_sites`.
