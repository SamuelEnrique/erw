# The codebook's metadata of table uspvdb_solar_facilities (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: uspvdb_solar_facilities
family: other_sources
shape: entities
row: One large-scale solar photovoltaic facility in the USGS U.S. Large-Scale Solar Photovoltaic Database.
time: No time column; project_year is the year of operation; image_date the date of the image it was drawn from.
vintage_rule: Rewritten whole as one snapshot by each run from the database's API; vintage is not filled.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: usgs:uspvdb U.S. Geological Survey and Lawrence Berkeley National Laboratory, U.S. Large-Scale Solar Photovoltaic
    Database (API v1)
  url: https://energy.usgs.gov/uspvdb/
cite: U.S. Geological Survey (USGS), with LBNL. U.S. Large-Scale Solar Photovoltaic Database (API v1). Via the Energy Research
  Warehouse (ERW), table `uspvdb_solar_facilities`.
method: docs/methods/uspvdb_solar_facilities.md
header_title: USGS U.S. Large-Scale Solar Photovoltaic Database, the large-scale solar facilities as the database selects
  them (session 890)
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id uspvdb:<case_id>; entity_type plant; capacity_mw the facility''s
  AC capacity (DC in capacity_dc_mw); lat, lon the outline''s centroid; status empty (the database lists facilities in operation);
  the database''s own fields after, renamed with their units.'
