  unit: none
  type: text
  values:
    distinct: 93
    examples:
    - 16 TAC 25.194 took effect on 8 October 2026 (already the row's status; listed here because it falls in the window).
    - A market participant (Global Capacity Alliance) filed NPRR1348, which would let a QSE raise the telemetered Low Power
      Consumption limit of a Provisional Controllable Load Resource (the flexible-load path of the large load process) to
      match a paired resource; it is pending, not approved.
    - A non-contested settlement on OG&E's application for a special contract with Google (long-term commitments, minimum
      billing demand and energy charges, funding of upfront costs) was reached on 9 September 2026 among OG&E, the Oklahoma
      Attorney General, the Public Utility Division and Google, and the ALJ recommended approval; no Commission order is reported.
    - APS signed its first Direct Pricing Contract with a large energy user, TSMC Arizona, ramping to about 1.88 GW for an
      initial term of 25 years with upfront credit-support payments and collateral from 1 January 2027, to be submitted to
      the ACC in 2026 (a contract, so the earlier choice of no row may stand).
    - AWEC petitioned the Oregon Court of Appeals for judicial review of Orders No. 26-309, 26-154 and 26-239.
