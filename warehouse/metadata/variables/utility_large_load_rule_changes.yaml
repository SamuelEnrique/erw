# The codebook's metadata of table utility_large_load_rule_changes (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: utility_large_load_rule_changes
family: utility
shape: events
row: One filing, order, effective date, amendment, suspension, hearing or other change to a US utility's large-load rule,
  15 August to 13 November 2026, as the ERW's research pass read it in the document.
time: event_date is a date (no time zone) that the document prints; where the document prints a month only (7 rows) it is
  the day the document was read (x_date_kind says which).
vintage_rule: Rewritten whole from the committed research file (changes_2026-11-13.csv) by each run of the connector; no vintage
  column. Rows whose only source asks written permission are held and named in the header, not written.
keys:
- event_id
license: public
tier: model_extracted
interval: event
source:
- name: research:large_load_2026-11-13, docs/research/large_load/changes_2026-11-13.csv (window P4 of the portable laptop,
    sessions 5300 to 5304; method  each row's source_url is the document it was read in. No request is made by this connector.
  url: https://github.com/SamuelEnrique/erw/blob/main/docs/research/large_load/README.md
cite: US utilities, state commissions and legislatures, read by the ERW's research pass. Large-load rules, their changes and
  the states' laws (docs/research/large_load, 13 and 14 November 2026). Via the Energy Research Warehouse (ERW), table `utility_large_load_rule_changes`.
method: docs/methods/large_load_research.md
header_title: changes to US utilities' large-load rules, 15 August to 13 November 2026, one row a filing, order or event (session
  3937, chain 267)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id llchange:<change_id>; event_date the date the document prints,
  else (a month only, x_date) the day read (x_date_kind); event_type large_load_rule_change; status the kind of change (filed,
  order issued, approved, in effect, amended, suspended, hearing set, other); x_affects the rule''s row_id, a registry file
  of the ERW, or ''new''; x_cite the page and words. mw empty: the files print sizes as phrases (x_threshold_mw).'
