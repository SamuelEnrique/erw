# The codebook's metadata of table ercot_transmission_projects (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_transmission_projects
family: ercot
shape: events
row: One phase of a transmission project the transmission owners report to ERCOT's Transmission Project and Information Tracking
  (TPIT) workbook, future, planned, completed or cancelled.
time: event_date is the actual in-service date where ERCOT gives one, else the projected one (x_date_kind says which).
vintage_rule: A snapshot replaced whole by each run with the workbook ERCOT's planning page names; earlier editions are not
  kept.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: ercot:tpit Electric Reliability Council of Texas (ERCOT), Transmission Project and Information Tracking
  url: https://www.ercot.com/gridinfo/planning
