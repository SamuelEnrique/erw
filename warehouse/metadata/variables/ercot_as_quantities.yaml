family: ercot
shape: series
row: The MW of one ancillary service ERCOT planned to procure in its day-ahead market for one delivery hour, from the plan
  published the day before delivery.
time: ts_utc is the start of the delivery hour in UTC (ERCOT gives the hour ending in Central time; DSTFlag Y marks the repeated
  autumn hour).
vintage_rule: Merged by (entity, variable, ts_utc); a run keeps of each daily file only the delivery day after its publish
  day, a day read again replaces the one held, and days ERCOT's list has dropped are kept. vintage is the file's PublishDate.
