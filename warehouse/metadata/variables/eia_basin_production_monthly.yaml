# The codebook's metadata of table eia_basin_production_monthly (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia_basin_production_monthly
family: eia
shape: series
row: One producing region's monthly crude oil production or marketed natural gas production, as EIA's Short-Term Energy Outlook
  gives its history.
time: ts_utc is the first day of the month at 00:00:00Z (freq P1M).
vintage_rule: Rewritten whole by each run (the file is deleted and the whole series from 2015 written again), so the Outlook's
  revisions are taken; months later than three before the run, EIA's estimates and forecast, are not written. vintage is not
  filled.
