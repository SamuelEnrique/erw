row: One crude stream's or state's monthly average first purchase price (the price paid at the lease, as crude is first bought)
  as EIA reports it.
time: ts_utc is the first day of the month at 00:00:00Z (freq P1M).
vintage_rule: Each run asks for the full history and merges it on (entity, variable, ts_utc), keeping EIA's newest value;
  a row EIA stops giving is kept from an earlier run. vintage is not filled.
