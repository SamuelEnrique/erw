# The codebook's metadata of table epa_rfs_fuel_annual (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: epa_rfs_fuel_annual
family: epa
shape: series
row: One renewable fuel category's (under one D code) RINs generated or batch volume in one RIN year of EPA's Renewable Fuel
  Standard data, 2010 to 2026.
time: ts_utc is the RIN year's first day (UTC); freq P1Y. The latest year is partial, to the month the file names.
vintage_rule: Rewritten whole by each run from the newest monthly file, which carries the whole history; EPA's corrections
  replace earlier figures. vintage is the file's Last-Modified time.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: epa:rfs_emts U.S. Environmental Protection Agency, Public Data for the Renewable Fuel Standard (EMTS)
  url: https://www.epa.gov/fuels-registration-reporting-and-compliance-help/public-data-renewable-fuel-standard
cite: 'U.S. Environmental Protection Agency (EPA). Public Data for the Renewable Fuel Standard: RIN generation and renewable
  fuel volume production (EMTS). Via the Energy Research Warehouse (ERW), table `epa_rfs_fuel_annual`.'
method: docs/methods/epa_rfs_rins.md
header_title: U.S. EPA, Renewable Fuel Standard, RIN generation and renewable fuel volume production by fuel type, a RIN year
  by D code and fuel category, 2010 to 2026 (session 2030)
header_shape: 'Shape: series (docs/datastandard.md v0). entity epa_rfs:d<code>:<EPA''s fuel category code>; variables rins_generated
  (count) and batch_volume (gal, Decision 59); ts_utc the RIN year''s first day; freq P1Y; geo US; node and x_fuel_category
  the fuel category as EPA names it; x_d_code_name the D code''s name.'
