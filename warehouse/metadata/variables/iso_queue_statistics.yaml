table: iso_queue_statistics
family: iso
shape: series
row: One statistic of one ISO's interconnection queue for the positions that entered it in one year, all positions or one
  technology group.
time: ts_utc is the first day of the entry year (the year of the ISO's queue date) at 00:00:00Z.
vintage_rule: Rebuilt whole from the six ISO queue tables by each run of the builder; vintage is not filled.
