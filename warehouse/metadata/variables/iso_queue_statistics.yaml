  withdrawn, operating, waiting and status_not_stated; withdrawal_rate; wait_positions, wait_years_median, wait_years_mean.
  Since session 7022 the same by technology group, entity <iso>:tech_<group>:queue_<entry year>, group storage, solar, solar_storage,
  wind, gas, other or not_stated (the queue gives no technology), from the queue''s fuel_technology; a group with no position
  in a year has no row'
