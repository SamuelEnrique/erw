# The codebook's metadata of table epa_needs_units (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: epa_needs_units
family: epa
shape: entities
row: One generating unit (a generator, or a boiler carrying the unit's capacity) of EPA's NEEDS inventory for the 2025 reference
  case of its power sector model (IPM), from one of four sheets.
time: No time column; status_date is empty. vintage is the workbook's Last-Modified time (2025-12-15).
vintage_rule: A snapshot of one NEEDS version, rewritten whole by each run; a later reference case is a new address set in
  the code.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: epa:needs_2025_reference_case U.S. Environmental Protection Agency, National Electric Energy Data System (NEEDS) for
    the 2025 Reference Case
  url: https://www.epa.gov/power-sector-modeling/national-electric-energy-data-system-needs
cite: U.S. Environmental Protection Agency (EPA). National Electric Energy Data System (NEEDS) for the 2025 Reference Case.
  Via the Energy Research Warehouse (ERW), table `epa_needs_units`.
method: docs/methods/epa_needs_units.md
header_title: EPA, National Electric Energy Data System (NEEDS) for the 2025 reference case, 38,030 units (active 22,688,
  retired_by_2028 1,094, hardwired_capacity 2,755, dropped_capacity 11,493; MW active 1,155,380, dropped_capacity 582,669,
  hardwired_capacity 117,400, retired_by_2028 65,351) (session 2183)
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id epa_needs:<UniqueID_Final>; entity_type generator or equipment
  (a boiler); geo US-<state>; capacity_mw EPA''s; status active for the NEEDS_Active sheet, else blank; x_needs_sheet EPA''s
  sheet (active, retired_by_2028, hardwired_capacity, dropped_capacity); x_ columns EPA''s ORIS code, unit, plant type, IPM
  region, county, heat rate (Btu/kWh), on-line and retirement year (9999 written blank), fuels, controls, emission rates (lb/MMBtu),
  owners, regulatory status and a dropped unit''s reason.'
