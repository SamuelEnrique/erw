# The codebook's metadata of table utility_service_territories (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: utility_service_territories
family: utility
shape: entities
row: One utility serving one county of one state or territory, as EIA's Form EIA-861 service territory sheet lists the pair
  for 2025.
time: No time column; vintage is 'EIA-861 2025', the data year. A snapshot as read on its retrieved_at.
vintage_rule: One data year a run; a run replaces the table whole, so it holds one year.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:eia861_territory U.S. Energy Information Administration, Form EIA-861 Annual Electric Power Industry Report (Service_Territory_2025.xlsx)
  url: https://www.eia.gov/electricity/data/eia861/
cite: U.S. Energy Information Administration (EIA). Form EIA-861 Annual Electric Power Industry Report, service territories.
  Via the Energy Research Warehouse (ERW), table `utility_service_territories`.
method: docs/methods/utility_service_territories.md
header_title: EIA-861 utility service territories, each utility's counties by state, 2025 (session 667)
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id eia861:<utility number>:<state>:<county>; entity_type
  utility; name the utility''s name; geo US-<state>; x_utility_number, x_state, x_county, x_short_form (Y: EIA''s short form),
  x_data_year, x_sheet as EIA gives them.'
