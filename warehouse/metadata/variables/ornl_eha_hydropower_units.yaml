# The codebook's metadata of table ornl_eha_hydropower_units (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ornl_eha_hydropower_units
family: ornl
shape: entities
row: One U.S. hydropower or pumped storage generating unit, from ORNL's Existing Hydropower Assets (EHA) Unit Database, 2026.
time: No time column; the table is a snapshot of the 2026 edition; vintage is the workbook's last-modified time (UTC).
vintage_rule: A snapshot of one yearly edition, replaced whole by each run.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: ornl:eha_unit M.M. Johnson, S.-C. Kao and R. Uria-Martinez, Existing Hydropower Assets (EHA) Unit Database, 2026,
    HydroSource, Oak Ridge National Laboratory, Oak Ridge, Tennessee, DOI 10.21951/FY2026/3374522
  url: https://hydrosource.ornl.gov/data/datasets/eha-unit-2026/
cite: Oak Ridge National Laboratory (ORNL), HydroSource. Existing Hydropower Assets (EHA) Unit Database. Via the Energy Research
  Warehouse (ERW), table `ornl_eha_hydropower_units`.
method: docs/methods/ornl_hydropower.md
header_title: 'Oak Ridge National Laboratory, Existing Hydropower Assets (EHA) Unit Database, 2026: every U.S. hydropower
