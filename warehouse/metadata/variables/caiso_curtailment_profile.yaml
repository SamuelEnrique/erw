table: caiso_curtailment_profile
family: caiso
shape: series
row: One figure of CAISO's wind and solar curtailment for one Pacific month (in all, by reason, by category, by local hour)
  or, where battery output is held, of curtailment against battery charging.
time: ts_utc is the first day of the Pacific month at 00:00:00Z; a month is written when at least 90 percent of its days are
  held, its figures summed over the days held, never scaled up.
vintage_rule: Rebuilt whole from caiso_curtailment_intervals and caiso_battery_storage by each run of the builder; vintage
  is not filled.
