  curtailed_<fuel>_mwh; by CAISO''s reason (_local_, _system_, _unspecified_); from 2026 by its category (_econ_, _ss_, _oi_);
  by local hour (_mwh_hHH); and, where CAISO''s battery output is held, the average day of curtailment and of battery charging
  (avg_curtailed_mw_hHH, avg_battery_charging_mw_hHH) and the share of curtailment in hours the batteries were charging. Definitions:
  docs/methods/caiso_curtailment_intervals.md.'
