table: ferc_eqr_quarter_changes
family: ferc
shape: series
row: One quarter's count of contracts (or rows) in force for one product group, or of contracts new, gone and kept against
  the quarter before, from FERC's Electric Quarterly Reports.
time: ts_utc is the quarter's first day at 00:00:00Z; freq P3M.
vintage_rule: Rebuilt whole from its inputs by each run of the builder (the old file is removed first); vintage is not filled.
