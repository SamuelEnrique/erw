# The codebook's metadata of table usgs_comcat_earthquakes_south_central (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: usgs_comcat_earthquakes_south_central
family: usgs
shape: events
row: One earthquake of magnitude 2.5 or above from 2010 in the bounding box of Oklahoma, Kansas, Texas and New Mexico, as
  the USGS ANSS Comprehensive Earthquake Catalog (ComCat) lists it.
time: event_date is the origin time in UTC to the second (YYYY-MM-DDTHH:MM:SSZ); x_time_utc keeps the catalog's milliseconds.
vintage_rule: A snapshot; each run replaces the table whole with what the catalog then holds. x_updated_utc keeps each event's
  last update in the catalog.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: usgs:comcat U.S. Geological Survey (USGS) Earthquake Hazards Program, ANSS Comprehensive Earthquake Catalog (ComCat),
    FDSN event web service
  url: https://earthquake.usgs.gov/fdsnws/event/1/
cite: U.S. Geological Survey (USGS), Earthquake Hazards Program. ANSS Comprehensive Earthquake Catalog (ComCat), FDSN event
  web service. Via the Energy Research Warehouse (ERW), table `usgs_comcat_earthquakes_south_central`.
method: docs/methods/usgs_comcat_earthquakes_south_central.md
header_title: USGS ComCat earthquakes of magnitude 2.5 and above, 2010-01-01 to 2026-10-23 (not included), in the bounding
  box of Oklahoma, Kansas, Texas and New Mexico (session 2120)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id usgs_comcat:<catalog id>; event_date the origin time in UTC
  to the second; event_type earthquake; status the catalog''s review status; x_latitude and x_longitude degrees, x_depth_km
  km, x_magnitude with x_magnitude_type; x_place_state the state or country the place names.'
