# The codebook's metadata of table epa_ghgrp_facility_emissions (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: epa_ghgrp_facility_emissions
family: epa
shape: series
row: One reporting facility's (or, for transmission pipelines and gas distribution companies, one facility-state's) total
  reported greenhouse gas emissions in one segment of EPA's GHGRP data summary in one year, 2015 to 2023.
time: ts_utc is the reporting year's 1 January (UTC), naming the year; freq P1Y.
vintage_rule: Merged by (entity, variable, ts_utc), keeping a run's rows; earlier rows a run does not restate are kept, so
  a facility EPA drops stays. vintage is the zip's Last-Modified time.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: epa:ghgrp_facilities U.S. Environmental Protection Agency, Greenhouse Gas Reporting Program, data summary spreadsheets,
    ghgp_data_by_year_2023.xlsx
  url: https://www.epa.gov/ghgreporting/data-sets
cite: U.S. Environmental Protection Agency (EPA). Greenhouse Gas Reporting Program, data summary spreadsheets (ghgp_data_by_year_2023.xlsx).
  Via the Energy Research Warehouse (ERW), table `epa_ghgrp_facility_emissions`.
method: docs/methods/epa_ghgrp_facility_emissions.md
header_title: 'U.S. EPA, Greenhouse Gas Reporting Program, data summary 2023: every reporting facility''s total reported emissions
  by year, 2015 to 2023, in the six emitting segments of the summary (session 2072)'
header_shape: 'Shape: series (docs/datastandard.md v0). entity ghgrp:<facility id>, or ghgrp:<facility id>:<state> for transmission
  pipelines and local distribution companies (a row a state where the emissions occur); variable emissions_<segment> (direct,
  onshore_production, gathering_boosting, transmission_pipelines, ldc, sf6_equipment); unit tCO2e (metric tons of CO2 equivalent,
  AR4 global warming potentials, Decision 61); ts_utc the year''s 1 January; freq P1Y.'
