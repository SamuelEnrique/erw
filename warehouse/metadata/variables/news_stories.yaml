# The codebook's metadata of table news_stories (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: news_stories
family: news
shape: events
row: One energy news story from the ERW's feeds (title, summary trimmed to 500 characters and link, never the article body),
  with the scoring model's fields once scored.
time: event_date is the story's publish time in UTC, as the feed gives it.
vintage_rule: 'Merged by event_id (news:<16 hex of the canonical URL''s sha1>): a story already stored is never rewritten
  by the ingest, so its scores stay; the scorer fills the score fields of unscored stories. No vintage column.'
keys:
- event_id
license: internal
tier: model_extracted
interval: event
source: []
