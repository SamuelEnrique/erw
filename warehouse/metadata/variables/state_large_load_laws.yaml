  the utilities or the commission to set them.
time: event_date is the status date printed, else the day the document was read (x_date_kind says which).
vintage_rule: Rewritten whole from the research file by each run (the old file removed first).
keys:
- event_id
license: public
tier: model_extracted
interval: event
