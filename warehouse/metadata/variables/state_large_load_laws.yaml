      or comparable instrument [p. 19, tariff terms (iii): "(III) MINIMUM CONTRACT TERMS AND MINIMUM LOAD" | p. 19, tariff
      terms (iii): "OF SERVICE FOR A MINIMUM NUMBER OF YEARS SUFFICIENT TO" | p. 19, tariff terms (iii): "THIS SUBPARAGRAPH
      BY A LETTER OF CREDIT OR OTHER"] || exit fee: exit fees or early termination fees [p. 19, tariff terms (v): "(V) EXIT
      FEES OR EARLY TERMINATION FEES."] || cost allocation: a prohibition on shifting to other customers costs caused in whole
      or part by a commercial data center''s interconnection, service or load [p. 21, Section 4: "SECTION 4. PROHIBITION ON
      COST SHIFTING AND RECOVERY OF COSTS."] || curtailment or backup generation: curtailment of a commercial data center''s
      load under regional transmission organization curtailment programs, and curtailment standards [p. 20, regulations (2):
      "(2) CURTAILMENT OF A COMMERCIAL DATA CENTER''S LOAD UNDER"]'
    - 'commission rulemaking: A public utility serves a new large load only under a commission-approved service contract,
      filed with a no harm test; the commission approves or denies it within 270 days [p. 1, 61-335(2): "A public utility
      shall provide service to a new large load only pursuant to a commission-approved service contract." | p. 1, 61-335(3),
      (4): "Such filing shall include a no harm test ... The commission shall review and approve or deny a new large load
      service contract within two hundred seventy (270) days of receiving such filing by the public utility."] || cost allocation:
      The new large load funds its full cost of service, including its share of generation, transmission, substation and distribution
      investments needed only because of it; the commission reviews the contract''s rates in each general rate case [p. 1,
      61-335(4)(b): "The new large load is responsible for funding its full cost of service, including its share of generation,
      transmission, substation, and distribution infrastructure investments" | p. 1, 61-335(7)(a): "In each general rate case
      filed by a public utility, the commission shall review the rates, charges, and cost recovery mechanisms applicable to
      an approved service contract"] || collateral: Approval is conditioned on financial security, in a form and amount the
      commission approves, reasonably sufficient to protect the utility and its other customers from stranded or unrecoverable
      costs [p. 1, 61-335(6): "Approval of a service contract shall be conditioned on the new large load furnishing financial
      security, in a form and amount approved by the commission"] || other: A new large load may not change its status by
      artifice, such as splitting its load among service entrances [p. 1, 61-335(5): "A new large load shall not change its
      status as such by means of artifice"]'
    - 'commission rulemaking: each investor-owned electric company and electric cooperative must submit a specific rate schedule
      for large load customers by 1 September 2026; the PSC must adopt regulations by 1 June 2026 on notice and deadlines
      for load studies and contract terminations, forms of collateral, and study completion [p. 17, PUA 4-212(c)(1): "SHALL
