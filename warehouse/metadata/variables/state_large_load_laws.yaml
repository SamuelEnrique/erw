      deposits or other financial security from a commercial data center [p. 19, tariff terms: "STRANDED INVESTMENT AND COST
      SHIFTING, INCLUDING ALL OF THE" | p. 19, tariff terms (i): "(I) DEPOSITS OR OTHER FINANCIAL SECURITY REQUIRED"] || minimum
