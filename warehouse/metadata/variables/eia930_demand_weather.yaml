  For each of energy (the mean of the year''s hours), summer_peak (the highest hour of June to September), winter_peak (the
  highest hour of December of the year before to February) and overnight_min (the mean over the year''s days of the lowest
  hour from midnight to 6 am, local): <figure>_mw metered, <figure>_expected_mw the fit''s (the customers of 2019 to 2021
  in that year''s weather), <figure>_base_mw the mean of 2019 to 2021, <figure>_growth_pct, <figure>_weather_pct (the growth
  the weather explains), <figure>_unexplained_pct (growth minus weather; x_finding yes when it is larger than its uncertainty,
  beyond when the peak''s hour was hotter or colder than any hour the fit was made on) and <figure>_uncertainty_pct (the largest
  miss of the years left out of the fit in turn; for a peak, never under the fit''s error on one hour left out). <figure>_holdout_unexplained_pct
  on a row of 2019 to 2021: that year left out of the fit. fit_* on the row of 2019: the fit''s hours and its mean absolute
  percent error.'
