method: docs/methods/ercot_sced_esr_hourly.md
header_title: ERCOT Energy Storage Resources in real time, by resource and hour, from ERCOT's 60-Day SCED Disclosure Reports,
  the file 60d_ESR_Data_in_SCED, each day reduced to resource-hour totals as it was read (session 120)
header_shape: 'Shape: series (docs/datastandard.md v0, Decision 40), one row per resource and hour: entity ercot:<Resource
  Name>, variable net_output_mwh, value the resource''s Telemetered Net Output integrated over the hour (MWh; positive is
  discharge; each SCED run''s MW held until the next SCED run of the day, and never across a run the resource is not in),
  ts_utc the hour''s start, node its settlement point as the day-ahead disclosure names it (blank when that file never names
  the resource). The x_ columns: x_net_q1_mwh to x_net_q4_mwh, the same for each 15-minute Settlement Interval of the hour
  (they add up to the value); x_discharge_mwh and x_charge_mwh, the positive and the negative part (charge as a positive number);
  x_base_point_mwh, the Base Point integrated the same way; x_hsl_mw and x_lsl_mw, the hour''s highest High Sustained Limit
  and lowest Low Sustained Limit; x_soc_start_mwh, x_soc_min_mwh, x_soc_max_mwh, the State of Charge; x_as_<service>_mwh,
  each Ancillary Service''s real-time award integrated over the hour (a MW for an hour): regup, regdn, rrspfr, rrsffr, rrsufr,
  ecrs, nspin; x_sced_runs, the SCED runs in the hour; x_qse, the scheduling entity.'
