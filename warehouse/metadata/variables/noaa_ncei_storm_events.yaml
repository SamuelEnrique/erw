# The codebook's metadata of table noaa_ncei_storm_events (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: noaa_ncei_storm_events
family: noaa
shape: events
row: One storm event of a type that takes power lines down or strains the grid (wind, winter, tropical, tornado, wildfire,
  heat, cold, lightning, storm surge) in one county or forecast zone, from NOAA NCEI's Storm Events Database, 2015 to 2026.
time: event_date is the event's begin time in UTC (NCEI's local time less the offset its CZ_TIMEZONE names); x_begin_local
  and x_end_local keep NCEI's local times.
vintage_rule: A snapshot written whole by each run, so an event NCEI drops leaves it; a revised yearly file has a new name
  and is fetched. No vintage column; x_file_created is the file's creation date.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: noaa:storm_events NOAA National Centers for Environmental Information, Storm Events Database (the National Weather
    Service's Storm Data)
  url: https://www.ncei.noaa.gov/stormevents/
cite: National Oceanic and Atmospheric Administration (NOAA), National Centers for Environmental Information (NCEI). Storm
  Events Database, bulk details files. Via the Energy Research Warehouse (ERW), table `noaa_ncei_storm_events`.
method: docs/methods/noaa_ncei_storm_events.md
header_title: NOAA NCEI Storm Events Database, the event types that take power lines down or strain the grid, 2015 to 2026
  (session 2042)
