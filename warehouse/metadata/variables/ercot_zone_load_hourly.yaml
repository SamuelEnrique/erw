# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_zone_load_hourly
family: ercot
shape: series
row: ERCOT's native load in one weather zone, or ERCOT's total, for one hour, from its Hourly Load Data Archives.
time: ts_utc is the hour's start in UTC (ERCOT gives the hour's end, Central; the repeated autumn hour is in the file twice,
  the second marked DST).
vintage_rule: Merged by (entity, variable, ts_utc) into the table held; ERCOT extends the current year's file month by month.
  vintage is the yearly file's publish time.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT1H
source:
- name: ercot:load_hist Electric Reliability Council of Texas (ERCOT), Hourly Load Data Archives, native load by weather zone
  url: https://www.ercot.com/gridinfo/load/load_hist
cite: 'Electric Reliability Council of Texas (ERCOT). Hourly Load Data Archives, native load by weather zone [terms: "raw
  data provided in public portions of this website may be used, reproduced, and redistributed in compilations, charts, and
  analyses without maintaining such notices." (https://www.ercot.com/help/terms, read 6 October 2026)]. Via the Energy Research
  Warehouse (ERW), table `ercot_zone_load_hourly`.'
method: docs/methods/ercot_zone_load_hourly.md
header_title: ERCOT, hourly native load by weather zone and ERCOT's total (Hourly Load Data Archives) (session 138)
header_shape: 'Shape: series (docs/datastandard.md v0). variable load: the operator''s own figure for the zone (or area) and
  hour, MW over the hour; freq PT1H, ts_utc the hour''s start in UTC. An hour the operator does not give is not written; nothing
  is filled, summed across zones or estimated. The table is merged into the one held.'
