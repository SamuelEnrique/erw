  from the public dockets of FERC and ten state utility commissions by an AI research agent, each sentence proved by code;
  Illinois Commerce Commission; Oregon Public Utility Commission; Pennsylvania Public Utility Commission. Dockets of the Arizona
  Corporation Commission: proceedings and orders on large loads, read on 8 October 2026 from the eDocket record and the commission''s
  own news releases (its decisions are scans) (session 154; docs/methods/datacenter_cost.md); Dockets of the California Public
  Utilities Commission: proceedings and orders on large loads, read on 8 October 2026 from the proceeding pages and the documents
  (session 154; docs/methods/datacenter_cost.md); Dockets of the Illinois Commerce Commission: proceedings and orders on large
  loads, read on 8 October 2026 from the commission''s open meeting minutes and agendas and its list of suspended cases (a
  docket''s own page answers with a robot check) (session 154; docs/methods/datacenter_cost.md); Dockets of the Oregon Public
  Utility Commission: proceedings and orders on large loads, read on 8 October 2026 from the eDockets docket summaries and
  the orders (session 154; docs/methods/datacenter_cost.md); Dockets of the Pennsylvania Public Utility Commission: proceedings
  and orders on large loads, read on 8 October 2026 from the docket pages and their documents (session 154; docs/methods/datacenter_cost.md);
  Proceedings and orders on large loads, 8 October 2026 (docs/accelerator/rules_in_motion.md): the regulators whose terms
  allow their text to be shown: Arizona Corporation Commission; California Public Utilities Commission; Illinois Commerce
