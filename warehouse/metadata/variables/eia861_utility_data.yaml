# The codebook's metadata of table eia861_utility_data (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia861_utility_data
family: eia861
shape: entities
row: One utility in one year under one state, as one row of EIA's Utility Data sheet (Form EIA-861) gives it, with its NERC
  region, the RTOs it operates in and its activities.
time: No time column; status_date is the data year's 1 January.
vintage_rule: A run reads the years given with --years and writes the table whole; vintage is not filled.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:eia861:utility_data U.S. Energy Information Administration, Form EIA-861 Annual Electric Power Industry Report
    (Utility_Data_<year>.xlsx)
