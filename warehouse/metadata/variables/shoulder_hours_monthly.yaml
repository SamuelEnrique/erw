table: shoulder_hours_monthly
family: erw_derived
shape: series
row: 'One grid''s (ERCOT''s or CAISO''s) value of one shoulder-hours measure: for a local month''s average day (P1M), one
  of a year''s ten worst days (P1D), or a year (P1Y).'
time: P1M rows at the first day of the local month at 00:00:00Z; P1D rows at the local day; P1Y rows at the year's first day.
vintage_rule: Rewritten whole by each run (the old file removed first); vintage is not filled.
