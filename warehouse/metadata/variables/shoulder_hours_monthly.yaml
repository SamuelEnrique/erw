- ts_utc
license: public
tier: derived
interval: P1D;P1M;P1Y
source:
- name: erw:shoulder_hours EIA Form EIA-930 hourly demand and net generation by energy source, the per-BA workbooks ( and
    CAISO's supply by fuel (caiso_fuel_supply); read by this run from warehouse/raw/eia930_emissions/20261102T174348Z/20261102T174425.135109Z_00004_ERCO.xlsx;
    warehouse/raw/eia930_emissions/20261102T174348Z/20261102T174403.134912Z_00002_CISO.xlsx; warehouse/output/caiso_fuel_supply.csv
  url: https://www.eia.gov/electricity/gridmonitor/knownissues/xls/<BA>.xlsx
cite: Energy Research Warehouse (ERW), derived. The shoulder hours by grid and month (docs/methods/shoulder_hours.md). Via
  the Energy Research Warehouse (ERW), table `shoulder_hours_monthly`.
method: docs/methods/shoulder_hours.md
header_title: the shoulder hours, ERCOT and CAISO, by local month (sessions 75 and 80)
header_shape: 'Shape: series (docs/datastandard.md v0). freq P1M; ts_utc is the first day of the local month at 00:00:00Z.
  The average day by local hour (avg_<demand|solar|wind|net_load|battery>_mw_hHH), the midday surplus, the evening shoulder
  and the battery fleet against it; definitions in docs/methods/shoulder_hours.md ("shoulder" is this table''s term). Session
  80: a second measure that ends inside the evening (shoulder2_*: net load above the midpoint between its daily mean and its
  evening peak); freq P1D, the ten days of each local year with the largest evening shoulder energy (worst_rank, day_*); freq
  P1Y, each year''s means and its ten worst days (year_*).'
