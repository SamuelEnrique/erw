# are defined in _shared.yaml.
table: irs_soi_energy_credits_annual
family: other_sources
shape: series
row: One state's (or the US's, or SOI's other areas') returns claiming, or amount of, one residential energy credit in one
  tax year, from IRS Statistics of Income Historic Table 2.
time: ts_utc is the tax year's first day at 00:00:00Z; freq P1Y; tax years 2015 to 2023.
vintage_rule: Rewritten whole as one snapshot by each run from SOI's yearly files; vintage is each file's Last-Modified.
