table: generation_mix_records
family: erw_derived
shape: series
row: One ISO grid's record of the energy mix (highest solar or wind share of an hour, cleanest or dirtiest hour) over the
  whole history or one local year.
time: ts_utc is the hour of the record (its start, UTC); freq PT1H; x_period says whether the record is of the whole history
  or of a local year.
vintage_rule: Rewritten whole by each run of mix_profile.py; key (entity, variable, x_period); vintage is not filled.
