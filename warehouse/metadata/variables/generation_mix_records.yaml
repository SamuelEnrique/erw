source:
- name: erw:generation_mix_hourly EIA Form EIA-930 hourly net generation by energy source, the per-BA workbooks ( California
    from 2025-12-16T08:00:00Z is CAISO's own supply by fuel (caiso_fuel_supply; source erw:generation_mix_hourly_caiso), the
    warehouse's one join (docs/methods/eia930_caiso_break.md); read by this run from warehouse/raw/eia930_emissions/20261116T175833Z/20261116T175834.883363Z_00002_CISO.xlsx;
    warehouse/raw/eia930_emissions/20261116T175833Z/20261116T175850.712544Z_00004_ERCO.xlsx; warehouse/raw/eia930_emissions/20261116T175833Z/20261116T175904.395449Z_00006_ISNE.xlsx;
    warehouse/raw/eia930_emissions/20261116T175833Z/20261116T175918.956497Z_00008_MISO.xlsx; warehouse/raw/eia930_emissions/20261116T175833Z/20261116T175934.677962Z_00010_NYIS.xlsx;
    warehouse/raw/eia930_emissions/20261116T175833Z/20261116T175949.986042Z_00012_PJM.xlsx; warehouse/raw/eia930_emissions/20261116T175833Z/20261116T180008.741327Z_00014_SWPP.xlsx
  url: https://www.eia.gov/electricity/gridmonitor/knownissues/xls/<BA>.xlsx
cite: 'Energy Research Warehouse (ERW), derived. The energy mix by hour: the average day of each month and the records, from
  EIA-930 (docs/methods/generation_mix_hourly.md); The same for California from 2025-12-16, from CAISO''s own supply by fuel
  (docs/methods/eia930_caiso_break.md). Via the Energy Research Warehouse (ERW), table `generation_mix_records`.'
method: docs/methods/generation_mix_hourly.md
header_title: 'the energy mix''s records by grid: the highest solar and wind shares of an hour, the cleanest and the dirtiest
  hour (session 94)'
header_shape: 'Shape: series (docs/datastandard.md v0). freq PT1H; ts_utc is the hour of the record (its start, UTC). Variables
  for the whole history, and with the prefix year_ for each local year (x_period: all, or the year). x_side: eia930 or caiso,
  the source of that hour. A share is of the hour''s generation (the sum of what its sources put out; a source below zero
  adds nothing); the intensity is carbon_intensity_hourly''s intensity_generation. Only held hours, and not an hour whose
  sources or whose CO2 do not describe it (docs/methods/generation_mix_hourly.md).'
