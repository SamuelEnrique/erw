# The codebook's metadata of table hifld_transmission_lines (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: hifld_transmission_lines
family: other_sources
shape: entities
row: One electric transmission line of 230 kV and above in HIFLD's Electric Power Transmission Lines layer.
time: No time column; vintage is HIFLD's SOURCEDATE of the line (a date); the table is a snapshot as read on its retrieved_at.
vintage_rule: One row a line, rewritten whole as one snapshot by each build; vintage holds HIFLD's source date.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: 'hifld:transmission_lines Homeland Infrastructure Foundation-Level Data (HIFLD), Electric Power Transmission Lines
    (ORNL, NGA HSIP), as served by Penn State''s PASDA: https://mapservices.pasda.psu.edu/server/rest/services/pasda/HIFLD_FEMA/MapServer/178/query
    where VOLTAGE>=230, in batches (sha256 ba039a3a2b7259dc6b474d2ffcf408f3bd3f628dfd7cab5ef5e7cf513094de10, saved at warehouse/raw/hifld_lines/20261120T024611Z/transmission.geojson)'
  url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/HIFLD_FEMA/MapServer/178/query
cite: Homeland Infrastructure Foundation-Level Data (HIFLD), served by Penn State PASDA. Electric Power Transmission Lines,
  HIFLD open data layer, PASDA map service HIFLD_FEMA layer 178. Via the Energy Research Warehouse (ERW), table `hifld_transmission_lines`.
method: docs/methods/map_layers.md
header_title: electric transmission lines of 230 kV and above, HIFLD's Electric Power Transmission Lines layer (session 8014,
  chain 581 part D)
header_shape: 'Shape: entities (docs/datastandard.md v0), entity_type transmission_line (Decision 82). entity_id hifld:transmission_line:<HIFLD
  ID>; lat and lon: the line''s midpoint; operator: HIFLD''s OWNER as printed; x_voltage_kv: HIFLD''s VOLTAGE (a code below
  zero left blank); x_length_km on a sphere. The lines themselves are in the saved raw file and, simplified, in site/data/map_layers/transmission_230kv.json.
  Method: docs/methods/map_layers.md.'
