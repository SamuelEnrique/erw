header_shape: 'Shape: series (docs/datastandard.md v0). entity statcan_cap:<area>:<class> (class all, public utilities, private
  utilities or industry); variable capacity_<type> (total, hydraulic_turbine, wind_power_turbine, tidal_power_turbine, solar_power,
  geothermal, other_non_combustibles, total_thermal and its conventional_steam_turbine, nuclear_steam_turbine, combustion_turbine,
  internal_combustion_turbine); unit MW (StatCan''s kilowatts divided by 1,000); freq P1Y; ts_utc the year''s 1 January; geo
  CA or CA-<province>; x_class, x_type StatCan''s names; x_vector; x_symbol r revised. Types and classes overlap (totals hold
  their parts): a sum takes one level. Capacity is gross, at the generators'' terminals before station service (StatCan''s
  note 3); the survey grew from 400 to 1,200 establishments in 2015 (note 12); solar below 100 kW counts only from 2024 (note
  7); 2012 has no figure (all .. in StatCan''s file).'
