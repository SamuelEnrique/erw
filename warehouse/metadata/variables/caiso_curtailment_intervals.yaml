table: caiso_curtailment_intervals
family: caiso
shape: series
row: CAISO's wind or solar curtailment at the finest interval CAISO publishes (5 minutes to 2025, an hour from 2026), by reason
  where published, or the day's total.
time: ts_utc is the interval's start in UTC; a day row's ts_utc is the Pacific day at 00:00:00Z. Only intervals with a curtailment
  above zero are written; every day covered has a day row, zero included.
vintage_rule: Merged by (entity, variable, ts_utc); a run that asks no workbook keeps the rows of 2019 to 2025 the table holds.
  vintage is the yearly workbook's last-modified time; empty on the rows from the daily reports.
