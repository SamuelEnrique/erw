table: nyiso_zone_load_hourly
family: nyiso
shape: series
row: NYISO's integrated real-time actual load in one of its eleven load zones for one hour.
time: ts_utc is the hour's start in UTC; NYISO's Time Stamp is the hour's start, Eastern, its Time Zone column (EDT, EST)
  placing every hour, the repeated autumn hour included.
vintage_rule: Merged by (entity, variable, ts_utc); this month's file is asked every run (last month's too in a month's first
  seven days), an earlier month once, so NYISO's later revisions of an older month are not taken. vintage is the monthly file's
  Last-Modified.
