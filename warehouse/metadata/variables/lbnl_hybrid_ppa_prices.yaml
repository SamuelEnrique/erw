# The codebook's metadata of table lbnl_hybrid_ppa_prices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: lbnl_hybrid_ppa_prices
family: lbnl
shape: events
row: One PV plus battery hybrid power purchase agreement in Berkeley Lab's Utility-Scale Solar, 2025 Data Update, either greenfield
  (PV and battery contracted together) or a retrofit (a battery added to an operating PV plant).
time: No time column; event_date is the PPA's execution date (greenfield) or the retrofit's execution date (retrofit), a date.
vintage_rule: Rewritten whole by each run from the data file lbnl_ppa_prices.py saves; one edition, no vintage column.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: lbnl:hybrid_ppa_prices Lawrence Berkeley National Laboratory, Utility-Scale Solar, 2025 Data Update (October 2025),
    sheet 'PV+Battery Hybrid PPA Price'
  url: https://eta-publications.lbl.gov/publications/us-utility-scale-solar-2025-data
cite: Lawrence Berkeley National Laboratory (Berkeley Lab). Utility-Scale Solar Data Update (PV+Battery Hybrid PPA Price).
  Via the Energy Research Warehouse (ERW), table `lbnl_hybrid_ppa_prices`.
method: docs/methods/lbnl_ppa_prices.md
header_title: Berkeley Lab, PV+battery hybrid PPA prices, one row a PPA, greenfield or retrofit (Utility-Scale Solar, 2025
  Data Update) (session 940)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id lbnl_hybrid:<EIA ID or plant>:<greenfield|retrofit>; event_date
  the PPA''s or the retrofit''s execution; event_type ppa_hybrid; entity_ids lbnl_solar:<EIA ID> for each id named; mw the
  PV capacity (MW-AC); price the PV+battery price levelized, real 2024 USD per MWh of PV output; x_* the plant, sizes, dates
  and the price''s parts (PV, battery adder per MWh of PV, per MWh stored, per MW-month).'
