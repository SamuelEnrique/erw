# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia860_cooling_systems
family: eia860
shape: entities
row: One cooling system at a power plant in Form EIA-860's environmental schedules for data year 2025, with its type, water
  source and discharge, intake, ponds, towers and costs.
time: No time column; vintage is the data year (2025). status_date is the first day of the month in service of an operating
  system; a retired one has none (the sheet gives no retirement month).
vintage_rule: A snapshot; each run replaces the table whole with the newest final year EIA's page links, so an earlier year
  is not kept.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
