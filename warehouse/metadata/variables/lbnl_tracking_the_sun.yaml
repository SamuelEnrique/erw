  (count), capacity_dc (MW DC) and price_median (USD/kW: the median of total installed price over DC size, unscreened, not
  Berkeley Lab''s reported figure); freq P1Y; ts_utc 1 January of the year of installation; geo US-<ST>; node and x_segment
  the customer segment as the file writes it (unknown for its -1).'
