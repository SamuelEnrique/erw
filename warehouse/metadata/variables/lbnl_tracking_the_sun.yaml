# The codebook's metadata of table lbnl_tracking_the_sun (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: lbnl_tracking_the_sun
family: lbnl
shape: series
row: One state's customer segment's installed distributed solar systems in one year of installation, one measure, summarised
  from Berkeley Lab's Tracking the Sun 2024 public data file (one record a system).
time: ts_utc is 1 January of the year of installation (a year, not an instant); freq P1Y. The edition holds systems installed
  to 2023; 2024 is a partial year.
vintage_rule: Rewritten whole by each run; vintage is the Last-Modified time of the state's file in the data lake (28 February
  2025).
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: lbnl:tracking_the_sun Lawrence Berkeley National Laboratory, Tracking the Sun, public data file, on the Open Energy
    Data Initiative
  url: https://data.openei.org/submissions/3
cite: 'Lawrence Berkeley National Laboratory (Berkeley Lab). Tracking the Sun: installed distributed solar systems, public
  data file. Via the Energy Research Warehouse (ERW), table `lbnl_tracking_the_sun`.'
