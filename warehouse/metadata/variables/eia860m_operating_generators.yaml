table: eia860m_operating_generators
family: eia860m
shape: entities
row: One generator in service (operating, standby or out of service) in EIA's monthly inventory, Form EIA-860M, for one vintage
  month, the 50 states, DC and Puerto Rico.
time: No time column; vintage is EIA's month (YYYY-MM). status_date is the first day of the generator's operating month; EIA
  gives months, not days.
vintage_rule: A snapshot of one vintage; a new vintage replaces its rows. Earlier vintages are in the raw files and the archive.
keys:
- entity_id
license: public
tier: source
interval: snapshot
