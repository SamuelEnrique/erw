# The codebook's metadata of table eia_lng_liquefaction_projects (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia_lng_liquefaction_projects
family: eia
shape: entities
row: One train (liquefaction unit) of a U.S. LNG export project in operation, commissioning or construction, or one large
  approved project, from EIA's U.S. Liquefaction Capacity workbook (2026 Q3).
time: No time column. status_date is the in-service day where EIA gives one; vintage is the workbook's last-modified time.
vintage_rule: Rewritten whole by each run (write_snapshot) from the newest quarterly workbook.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:us_liquefaction_capacity U.S. Energy Information Administration, U.S. Liquefaction Capacity (quarterly), listed
    on
  url: https://www.eia.gov/naturalgas/data.php
cite: 'U.S. Energy Information Administration (EIA). U.S. Liquefaction Capacity: LNG export projects, trains and approvals
  (quarterly). Via the Energy Research Warehouse (ERW), table `eia_lng_liquefaction_projects`.'
method: docs/methods/eia_lng_liquefaction_projects.md
header_title: 'EIA, U.S. Liquefaction Capacity: LNG export projects'' trains in operation, commissioning and construction,
  and the large approved projects, U.S.liquefactioncapacity_2026_Q3.xlsx (session 2021)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id eia_lng:<project>:<train> or eia_lng:<project> (approved);
  entity_type project; status operating, under_construction, planned (approved), or empty for EIA''s Commissioning; status_date
  the in-service day where EIA gives one; capacity_mw empty. Capacities and authorized quantities in the x_ columns, bcfd
  (billion cubic feet a day) and mtpa (million tonnes a year) as EIA gives them; x_marks EIA''s footnote marks beside a figure
  (its notes are in the file).'
