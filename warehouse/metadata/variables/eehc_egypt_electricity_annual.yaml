# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eehc_egypt_electricity_annual
family: other_sources
shape: series
row: One fiscal year's capacity or generation of one kind of Egyptian plant (or the total), or the peak load, from the 'Electricity
  in <year>' table of EEHC's annual reports.
time: ts_utc is the fiscal year's first day, 1 July, at 00:00:00Z; freq P1Y; x_fiscal_year keeps EEHC's label.
vintage_rule: Rewritten whole as one snapshot by each run (ip.write_snapshot); a fiscal year two reports give with the same
  figure is kept once (with different figures the run stops); vintage is the report's Last-Modified time.
