  nuclear, thermal and hydro), from ELES's Prevzem in proizvodnja page.
time: ts_utc is the hour's start in UTC; the file's label Hn is the local clock hour from n-1 o'clock (Europe/Ljubljana);
  freq PT1H.
vintage_rule: 'Merged by (entity, variable, ts_utc) (ip.write_csv): a run replaces the rows it reads again and keeps rows
  from earlier runs; vintage is the export''s Last-Modified time.'
