  size); ts_utc the hour''s start in UTC (Hn is the local clock hour from n-1 o''clock; the autumn change day''s one 02:00
  hour read as summer time); freq PT1H; geo SI; x_date and x_hour the file''s own. Producers connected to the transmission
  network only (the pumped storage plant Avce included); Krsko''s whole production, half of it Croatia''s.'
