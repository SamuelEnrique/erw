  1 January; freq P1Y; geo MU. From Table 1: generation_total, renewable_share (pct), electricity_sold (MWh). From Table 7:
  capacity_installed, capacity_effective, peak_demand_mauritius, peak_demand_rodrigues (MW). From Table 8: generation_hydro,
  _wind, _landfill_gas, _photovoltaic, _gas_turbine_kerosene, _fuel_oil_diesel, _coal, _bagasse (the 2025 edition''s "Bagasse
  & Fuelwood"), generation_renewable (MWh, the tables'' GWh times 1,000). Tables 7 and 8 give each edition''s two years only
  (2022 to 2025); Table 1 gives 2017 to 2025. Generation is every producer''s, the independent producers'' own use included;
  electricity_sold is the CEB''s sales, so generation less sales is not losses. Capacity includes plants not exporting to
  the CEB (Table 7''s footnote); effective capacity is not defined.'
