# The codebook's metadata of table datacenter_queue_positions (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: datacenter_queue_positions
family: datacenter
shape: entities
row: One ISO interconnection queue position whose name or fuel field names a datacenter or a large load, copied with the queue
  table's own columns (ERCOT and NYISO rows in this edition).
time: No time column; the queue tables' dates (queue_date, proposed_in_service_date, withdrawn_date) as the ISOs print them.
  vintage is the queue table's own (a retrieval date or day).
vintage_rule: Rebuilt by each run from the six ISO queue tables; when a queue table is absent, its matched rows are kept from
  the last datacenter_queue_positions.
keys:
- entity_id
license: public
tier: derived
interval: snapshot
source: []
cite: Electric Reliability Council of Texas (ERCOT); New York Independent System Operator (NYISO). Generation Interconnection
  Status (GIS) report; NYISO Interconnection Queue. Via the Energy Research Warehouse (ERW), table `datacenter_queue_positions`.
method: docs/methods/datacenter_facilities.md
header_title: ISO queue positions that name a datacenter or a large load (session 22)
header_shape: 'Shape: entities (docs/datastandard.md), the queue tables'' own columns and rows, plus matched (the words that
  matched). capacity_mw is the generation or storage the position asks to connect, not the load.'
