table: ercot_rtm_price_adders
family: ercot
shape: series
row: One of ERCOT's real-time reserve price adders (added to the real-time energy price) over one hour, its time-weighted
  mean or its highest interval value.
time: ts_utc is the start of the hour in UTC (ERCOT publishes a row per SCED interval, stamped in Central time); an hour is
  written only when all of its seconds are covered.
vintage_rule: Merged by (entity, variable, ts_utc); ERCOT republishes the current year's workbook weekly, and a run that finds
  it rereads it and replaces that year's rows. vintage is the document's publish time.
