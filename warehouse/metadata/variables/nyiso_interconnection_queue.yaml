table: nyiso_interconnection_queue
family: nyiso
shape: entities
row: One position (a request, or a unit or phase of one) in NYISO's interconnection queue of generation, storage and transmission
  projects asking to connect to the grid.
time: No time column. Dates are NYISO's, YYYY-MM-DD; vintage is the retrieval day. The table is a snapshot of the queue as
  read on its retrieved_at.
vintage_rule: A snapshot rewritten whole by each run (Mondays); earlier snapshots stay in the raw files and the archive.
