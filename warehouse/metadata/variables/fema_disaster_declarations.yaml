# The codebook's metadata of table fema_disaster_declarations (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: fema_disaster_declarations
family: other_sources
shape: events
row: One FEMA disaster declaration for one designated area (a county, a tribal area or a statewide area), declared on or after
  2015-01-01, from OpenFEMA.
time: event_date is the declaration date; x_incident_begin and x_incident_end are the incident's UTC days.
vintage_rule: 'Rewritten whole as one snapshot by each run from OpenFEMA''s CSV; vintage is the file''s Last-Modified (empty
  here: none was given).'
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: 'fema:openfema_disaster_declarations_v2 Federal Emergency Management Agency (FEMA), OpenFEMA Dataset: Disaster Declarations
    Summaries - v2'
  url: https://www.fema.gov/openfema-data-page/disaster-declarations-summaries-v2
cite: 'Federal Emergency Management Agency (FEMA). OpenFEMA Dataset: Disaster Declarations Summaries - v2. Via the Energy
  Research Warehouse (ERW), table `fema_disaster_declarations`.'
method: docs/methods/fema_disaster_declarations.md
header_title: 'FEMA, OpenFEMA Disaster Declarations Summaries (v2): each declaration and designated area, declared on or after
  2015-01-01 (session 2056)'
header_shape: 'Shape: events (docs/datastandard.md v0). event_id fema:<declaration>:<state and county FIPS>:<place code>;
  event_date the declaration date; event_type major_disaster, emergency or fire_management; parties FEMA; entity_ids US-<state>,
  and fips:<state><county> where FEMA names a county; status open or closed (a closeout date); x_ columns FEMA''s incident
  type, title, area, incident dates, programs, disaster number, region.'
