table: ferc_eqr_party_mw
family: ferc
shape: entities
row: One buyer (by its counted-as name) or seller (by FERC's company identifier) of energy, capacity or tolling whose contracts
  in force in the newest quarter state megawatts, ranked by megawatts.
time: No time column; retrieved_at is the run's time. x_quarter names the newest quarter.
vintage_rule: Rebuilt whole from its inputs by each run of the builder (the old file is removed first); vintage is not filled.
keys:
- entity_id
license: internal
tier: source
interval: snapshot
source:
- name: 'erw:eqr_terms from ferc:eqr, Federal Energy Regulatory Commission, Electric Quarterly Reports; quarters held: 2025_Q3,
    2025_Q4, 2026_Q1, 2026_Q2'
  url: ''
cite: 'Energy Research Warehouse (ERW), derived. FERC EQR contract terms: buyers under one name, megawatts and prices where
  stated, tags, changes by quarter (docs/methods/eqr_terms.md). Via the Energy Research Warehouse (ERW), table `ferc_eqr_party_mw`.'
method: docs/methods/eqr_terms.md
header_title: the buyers and sellers of energy, capacity and tolling in FERC's Electric Quarterly Reports whose contracts
  in force state megawatts, ranked by megawatts (session 125)
header_shape: 'Shape: entities (docs/datastandard.md v0). One row per party, role and product. x_mw_stated: the sum, over
  its contracts that state one, of the largest MW any row of the contract states. x_contracts_with_mw of x_contracts state
  one: most contracts state none, so this ranks what is stated and is not a ranking of the market. x_rank_mw; x_rank_contracts
  (its place by contracts among all parties of that role and product). x_contracts_over: its contracts that state more than
  x_mw_ceiling (6,809 MW, the largest station in eia860m_operating_generators, vintage 2026-09) and are left out: another
  unit filed under MW.'
