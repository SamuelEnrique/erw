  carried, peak and minimum load, consumption, losses, deliveries to direct customers), from HOPS's Elektroenergetski podaci
  page.
time: ts_utc is the year's 1 January at 00:00:00Z; freq P1Y.
vintage_rule: 'Merged by (entity, variable, ts_utc) (ip.write_csv): a run replaces the rows it reads again and keeps rows
  from earlier runs; vintage is the page''s Last-Modified time.'
