# The codebook's metadata of table policy_reads_evidence (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: policy_reads_evidence
family: policy
shape: events
row: One quoted span of a regulator's source text that supports one kept field of one model read in policy_reads.
time: event_date is the date of the policy action the read is of.
vintage_rule: Merged by event_id (<read id>#<field>#<n>); a read done again replaces its old evidence, span ids and all. No
  vintage column.
keys:
- event_id
license: internal
tier: model_extracted
interval: event
source:
- name: erw:policy_reads.
