# The codebook's metadata of table boem_offshore_platforms (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: boem_offshore_platforms
family: boem
shape: entities
row: One structure of an oil and gas platform complex on the Outer Continental Shelf, installed or removed, with its place,
  dates and its complex's fields, from BOEM's Platform Structures, Locations and Masters files.
time: No time column; status_date is the removal date where BOEM gives one, else the install date.
vintage_rule: A snapshot; each run replaces the table whole. vintage is the structures file's last-modified time.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: boem:platforms Bureau of Ocean Energy Management, Data Center, Platform
  url: https://www.data.boem.gov/Main/Platform.aspx
cite: 'Bureau of Ocean Energy Management (BOEM). Data Center: Platform Structures, Platform Locations and Platform Masters.
  Via the Energy Research Warehouse (ERW), table `boem_offshore_platforms`.'
method: docs/methods/boem_offshore_platforms.md
header_title: 'Bureau of Ocean Energy Management (BOEM), Data Center, Platform Structures, Platform Locations and Platform
  Masters: every oil and gas structure on the Outer Continental Shelf, installed or removed, with its place, dates and its
  complex''s fields (session 2007)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id boem_platform:<complex id>-<structure number>; entity_type
  platform (Decision 58); name the structure''s name; geo US; lat, lon from the locations file; status retired where BOEM
  gives a removal date, else active; status_date the removal date, else the install date; operator empty (x_company_num is
  BOEM''s company number); x_ the structure''s and its complex''s fields.'
