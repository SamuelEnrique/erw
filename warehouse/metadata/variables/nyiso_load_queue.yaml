  vintage is the retrieval date. A snapshot of the sheet as read on its retrieved_at.
vintage_rule: A snapshot rewritten whole by each weekly run; earlier sheets stay in the archive and the raw files.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: nyiso:load_queue NYISO Interconnection Queue workbook, sheets "Load Projects" and "Load Project Tracking"
