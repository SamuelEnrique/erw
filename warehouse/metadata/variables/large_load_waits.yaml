  url: ''
cite: 'Alberta Electric System Operator (AESO), Canada; Bonneville Power Administration (BPA); New York Independent System
  Operator (NYISO); Public Utility District No. 2 of Grant County, Washington (Grant PUD). Bonneville Power Administration
  Interconnection Request Queue workbook (InterconnectionQueueOutput), its line and load interconnection requests (Connection
  Type LL) in each dated copy the Internet Archive holds and the current copy (session 165: followed across copies for large_load_waits)
  [the publisher''s site states no terms of use for its documents; its one legal page is a privacy policy: "When you visit
  our website to read pages or download information, we automatically collect and store the following information only:" (https://www.bpa.gov/about/who-we-are/privacy);
  held internal until a person rules]; CANADA. Alberta Electric System Operator monthly connection project list, its load
  projects (MW Type Load, Data Load, Distribution Load, Industrial Load) in one dated copy a month the Internet Archive holds
  and the current copy (session 165: followed across copies for large_load_waits) [terms: "The material may be used and copied
  for non-commercial, personal or educational purposes, provided that the material is not modified and that copyright notices
  are not deleted." "Any other use of this material without the AESO''s written permission is prohibited." (https://www.aeso.ca/legal/);
  held internal]; Grant PUD Interconnection Queue (PDF), its load requests in each dated copy the Internet Archive holds and
  the current copy (session 155: followed across copies for large_load_waits) [the publisher''s site states no terms of use
  for its documents; held internal until a person rules]; NYISO Interconnection Queue workbook, its load requests in each
  dated copy the Internet Archive holds and the current copy (session 155: followed across copies for large_load_waits) [terms:
  "Access to this Web site does not confer any license or ownership interest in either the form or content of the Web site"
  (https://www.nyiso.com/legal-notice); held internal]. Via the Energy Research Warehouse (ERW), table `large_load_waits`.'
method: docs/methods/large_load_waits.md
header_title: how long large loads waited, measured from successive dated copies of public queues (session 155)
header_shape: 'Shape: events (docs/datastandard.md v0), event_type large_load_wait. One row a request and stage interval:
  the entity, the request''s identifier, megawatts as written in the last copy that holds it, the stage in the publisher''s
  words (status, stage_as_worded) and its class beside them, the two bounds of the start and the two of the end (a copy''s
  date and address, or the queue date the copies print), and the duration''s range in days.'
