# The codebook's metadata of table eia861_distributed_generation (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia861_distributed_generation
family: eia861
shape: series
row: One utility's figure for the distributed generators on its system that are not net metered (their number, or capacity
  by technology and customer sector) in one state and balancing authority, for one year, from Form EIA-861.
time: ts_utc is the data year's 1 January at 00:00:00Z (a year, not an instant); freq P1Y.
vintage_rule: A run reads the years given with --years (2016 on) and writes the table whole; vintage is not filled. EIA's
  aggregates 88888 and 99999 (its State Adjustment rows) left out; a '.' cell has no row.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: eia:eia861:distributed_generation U.S. Energy Information Administration, Form EIA-861 Annual Electric Power Industry
    Report (Non_Net_Metering_Distributed_<year>.xlsx)
  url: https://www.eia.gov/electricity/data/eia861/
cite: U.S. Energy Information Administration (EIA). Form EIA-861 Annual Electric Power Industry Report, distributed generation
  not net metered. Via the Energy Research Warehouse (ERW), table `eia861_distributed_generation`.
method: docs/methods/eia861_distribution.md
header_title: EIA-861 distributed generation not net metered, each utility by state, technology and sector, a year (session
  883)
header_shape: 'Shape: series (docs/datastandard.md v0). entity eia861_dg:<utility>:<state>:<balancing authority>; variables
  number_of_generators (count), total_capacity, capacity_backup_only, capacity_utility_owned (MW), <technology>_capacity_<sector>
  (MW; technologies pv, battery (EIA''s Storage to 2022), wind, hydro, fuel_cell, internal_combustion, combustion_turbine,
  steam, other, total; sectors residential, commercial, industrial, transportation, direct_connected, total: a sum leaves
  total out) and battery_energy_<sector> (MWh, 2023 on); ts_utc the data year''s 1 January; freq P1Y; node the utility''s
  name; x_capacity_type AC or DC, as EIA''s column Type gives the capacity.'
