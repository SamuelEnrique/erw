# The codebook's metadata of table ercot_grid_notices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_grid_notices
family: ercot
shape: events
row: One ERCOT notice (an Energy Emergency Alert, rotating outages, a conservation appeal, a watch, a control-room message
  and others) for one Central day it covers.
time: event_date is the Central day the notice covers (the days it names, else the day it was issued); x_issued_at is when
  it was issued.
vintage_rule: Merged by event_id; each run keeps the rows it read before, so the table only grows. No vintage column.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: ercot:news_releases ERCOT, News Releases,  ercot:operations_messages ERCOT, Operations Messages
  url: https://www.ercot.com/services/comm/mkt_notices/opsmessages
cite: 'Electric Reliability Council of Texas (ERCOT). News Releases (grid conditions: EEAs, conservation appeals, watches);
  Operations Messages (the control room''s notices). Via the Energy Research Warehouse (ERW), table `ercot_grid_notices`.'
method: docs/methods/ercot_grid_notices.md
header_title: ERCOT's grid notices, Energy Emergency Alerts, rotating outages, conservation appeals, watches and the control
  room's operating notices (session 322)
header_shape: 'Shape: events (docs/datastandard.md v0, decision 35). One row per notice and Central day it covers; event_type
  eea1 to eea3, rotating_outages, conservation_appeal, voluntary_conservation, weather_watch, power_watch, ocn_weather, ocn,
  advisory, watch, emergency_notice, emergency_test, update, statement. x_counts yes: a system-wide call on supply or demand,
  the kinds grid_stress_days counts. x_text: the notice''s own words. x_issued_at: the day of a release, the UTC time of a
  control-room message. docs/methods/ercot_grid_notices.md'
