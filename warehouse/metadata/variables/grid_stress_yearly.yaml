header_title: 'how hard each grid works, by year: the evening ramp of net load, the lowest net load, what each fuel gives
  in the 100 tightest hours as a share of its installed capacity, and the longest dark, calm stretch (derived, session 123)'
header_shape: 'Shape: series (docs/datastandard.md v0). freq P1Y; ts_utc the local year''s first day; entity iso:<grid>; x_at
  the hour (UTC, its start) a record or a stretch begins at. Variables and definitions: the header of warehouse/derived/mix_stress.py
  and docs/methods/grid_stress.md. Net load is demand less wind less solar. The evening is the local hours starting 14:00
  to 22:00. The tightest hours are the 100 of the year with the highest net load. Dark and calm: wind and solar together under
  10% of their installed capacity of that month.'
