# The codebook's metadata of table company_directory (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: company_directory
family: company
shape: entities
row: One company named in any of 13 ERW tables (platform tool 10), with its kind, main segment, parent, states, grids, first
  and last dates, and its footprint of deals, plants, plans, queue positions, facilities and reactors.
time: No time column; the table is a snapshot of the ERW's tables as built (vintage reads 20261116 on every row). status_date
  is the latest date its rows state.
vintage_rule: Rewritten whole by each run of the builder (warehouse/derived/companies.py) from the tables held.
keys:
- entity_id
license: public
tier: model_extracted
interval: snapshot
source:
- name: erw:companies, the ERW's resolution of the names in its own tables (each input's source in its own header).
  url: ''
cite: 'Energy Research Warehouse (ERW), derived. The company database: every company named in the warehouse''s tables, its
  names and its rows (docs/methods/companies.md). Via the Energy Research Warehouse (ERW), table `company_directory`.'
method: docs/methods/companies.md
header_title: the company database (platform tool 10), every company named in 13 held tables, one row a company (session 3302)
header_shape: 'Shape: entities (docs/datastandard.md v0), entity_type company. entity_id company:eia-<EIA utility id> where
  the company has one (company:eia-<id>-860 for the EIA-860 rows of a number EIA-861 lists as another firm''s power marketer,
  session 7001), else company:<normalized name>; kind one of regulator, lab or hyperscaler, OEM, utility, IPP, lender or investor,
  developer, operator, power marketer, other (the first its rows show, kind_basis says which row); segment the fuel or line
  with the most MW (segment_basis); parent a second field from the NRC and the reviewed aliases only; hq_state from EIA-860''s
  owner address only; first_seen and last_seen the earliest and latest date its rows state; MW are nameplate (EIA-860M), as
  stated (deals, facilities, queue); owned_mw nameplate times the percent owned; footprint_mw the sum of plants_mw, owned_mw,
  planned_mw, queue_mw, facilities_mw and deals_mw, a sort key only (a plant both operated and owned counts twice).'
