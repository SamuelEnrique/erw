  the company has one (company:eia-<id>-860 for the EIA-860 rows of a number EIA-861 lists as another firm''s power marketer,
  session 7001), else company:<normalized name>; kind one of regulator, lab or hyperscaler, OEM, utility, IPP, lender or investor,
  developer, operator, power marketer, other (the first its rows show, kind_basis says which row); segment the fuel or line
  with the most MW (segment_basis); parent a second field from the NRC and the reviewed aliases only; hq_state from EIA-860''s
  owner address only; first_seen and last_seen the earliest and latest date its rows state; MW are nameplate (EIA-860M), as
  stated (deals, facilities, queue); owned_mw nameplate times the percent owned; footprint_mw the sum of plants_mw, owned_mw,
  planned_mw, queue_mw, facilities_mw and deals_mw, a sort key only (a plant both operated and owned counts twice).'
