# The codebook's metadata of table energy_companies (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: energy_companies
family: energy
shape: entities
row: One energy company of the Thesis Builder (tool 27, researched by a model from public web sources it cites) or a party
  of the deal tracker's deals (energy_deals), merged on normalized name plus website domain.
time: No time column; first_seen is the date the company was first found (a researched row's run date, or its first deal's
  date). vintage is the run id (YYYYMMDDTHHMMSSZ) of the row's writing.
vintage_rule: Merged on normalized name plus website domain. A company found again keeps its first_seen and the fields of
  the higher-confidence finding, gaining the new niche tags and sources; deal-only rows are rebuilt each run of warehouse/companies/seed_from_deals.py.
keys:
- entity_id
license: public
tier: model_extracted
interval: snapshot
source:
- name: erw:thesis_builder (public web sources, each row's sources column); erw:energy_deals (the deals' stories).
  url: ''
cite: Energy Research Warehouse (ERW). Deal tracker counterparties (energy_deals, warehouse/deals/extract.py); Thesis Builder
  company finds (warehouse/thesis/build.py), from public web sources. Via the Energy Research Warehouse (ERW), table `energy_companies`.
method: docs/methods/thesis_builder.md
header_title: 'energy companies, the company database (tool 10): companies the Thesis Builder (tool 27) researched, and every
  party of the deal tracker''s deals (energy_deals)'
header_shape: 'Shape: entities (docs/datastandard.md v0), entity_type company; one row per company, merged on normalized name
  plus website domain when both are known. Thesis Builder rows: the model''s fields from public web sources it cites (a number
  no cited source confirmed reads not confirmed; a public company''s raised is blank). Deal rows (session 27): name, the sector
  and niche tags of the deals, a location only where a deal states one (where the deal is), the deals'' story links; description,
  founders, stage and raised are blank and the confidence_note starts "from deals; not yet researched". confidence 0 to 100
  by the rule in warehouse/thesis/build.py, explained in confidence_note. No licensed data.'
