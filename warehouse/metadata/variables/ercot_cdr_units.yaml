# The codebook's metadata of table ercot_cdr_units (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_cdr_units
family: ercot
shape: entities
row: One generating or storage unit (or one planned group of small generators) listed on the Unit Details sheet of ERCOT's
  Capacity, Demand and Reserves report (CDR).
time: No time column. vintage is the report's posting date; the table is a snapshot of the newest report as read on its retrieved_at.
vintage_rule: A snapshot replaced whole by each run with the newest CDR workbook ERCOT's resource adequacy page links; earlier
  editions are not kept.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: ercot:cdr:unit_details Electric Reliability Council of Texas (ERCOT), Capacity, Demand and Reserves Report, Unit Details
  url: https://www.ercot.com/gridinfo/resource
cite: Electric Reliability Council of Texas (ERCOT). Capacity, Demand and Reserves Report, Unit Details. Via the Energy Research
  Warehouse (ERW), table `ercot_cdr_units`.
method: docs/methods/ercot_cdr_units.md
header_title: 'ERCOT, the units of the Capacity, Demand and Reserves report: each resource''s code, county, zone, fuel, status,
  in-service date and capacity (session 872)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id ercot_cdr_unit:<unit code, else INR, else name>:<fuel>;
  entity_type generator; capacity_mw installed capacity; status from ERCOT''s CDR status (x_cdr_status); status_date the in-service
  date; x_* ERCOT''s fields and the seasonal capability it counts (MW) at each season''s start: x_summer_<y>, x_winter_<y>_<y+1>,
  x_spring_<y>, x_fall_<y>.'
