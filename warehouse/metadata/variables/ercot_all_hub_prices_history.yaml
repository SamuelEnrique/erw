# The codebook's metadata of table ercot_all_hub_prices_history (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ercot_all_hub_prices_history
family: ercot
shape: series
row: ERCOT's settlement point price at one of its six trading hubs for one interval of one operating year from 2015, day-ahead
  (hourly) or real-time (15-minute).
time: ts_utc is the start of the interval in UTC; the year is ERCOT's operating year in Central time (America/Chicago).
vintage_rule: Merged by (entity, variable, ts_utc) into each year's member and consolidated by market and year; a year is
  written from ERCOT's yearly archive, the current year extended from the live window, and a workbook read later replaces
  the appended rows. vintage is ERCOT's document publish time.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT15M;PT1H
source:
- name: ERCOT NP4-180-ER Historical DAM Load Zone and Hub Prices
  url: https://www.ercot.com/mp/data-products/data-product-details?id=NP4-180-ER
- name: ERCOT NP6-785-ER Historical RTM Load Zone and Hub Prices
  url: https://www.ercot.com/mp/data-products/data-product-details?id=NP6-785-ER
cite: Electric Reliability Council of Texas (ERCOT). Historical DAM Load Zone and Hub Prices; Historical RTM Load Zone and
  Hub Prices. Via the Energy Research Warehouse (ERW), table `ercot_all_hub_prices_history`.
method: docs/methods/automated_analysis_findings.md
header_title: ERCOT trading hub prices, day-ahead and real-time, one row per interval of each operating year from 2015 (the
  yearly history)
header_shape: 'Shape: series (docs/datastandard.md v0), a consolidated table (session 29): the 24 tables it replaced are its
  rows, told apart by the partition columns market, year (docs/migrations/2026-09-29-consolidation.md; the map is warehouse/metadata/table_migrations.csv).
  ts_utc is interval start, UTC.'
