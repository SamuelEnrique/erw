# The codebook's metadata of table known_data_faults (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: known_data_faults
family: erw_derived
shape: events
row: One known fault in a source's data, as the ERW's register of faults records it.
time: event_date is the fault's first day where a day is recorded, else the day the register recorded it (x_first is then
  empty).
vintage_rule: 'Rewritten whole from the register (warehouse/faults/faults.yaml) by each run: an entry taken out of the register
  leaves the table.'
keys:
- event_id
license: public
tier: derived
interval: event
source:
- name: erw:known_data_faults the ERW's register of faults found in its sources' data (warehouse/faults/faults.yaml), each
    entry naming where it is recorded
  url: ''
cite: 'Energy Research Warehouse (ERW), derived. Known faults in source data: the register of what each publisher''s data
  holds that is wrong, missing, shifted or impossible (docs/methods/known_data_faults.md). Via the Energy Research Warehouse
  (ERW), table `known_data_faults`.'
method: docs/methods/known_data_faults.md
header_title: known faults in source data, one row per fault (session 103)
header_shape: 'Shape: events (docs/datastandard.md v0). event_date: the first day of the fault where a day is recorded; where
  none is, the day the register recorded it (x_first is then empty and x_dates_note says what is known). parties: the publisher.
  entity_ids: the ERW tables it touches. status: screened (left out by a stated rule), corrected (read as it should have been),
  worked_around (another source is read for the period) or held_as_published. x_evidence: what was measured, in the words
  of the session that measured it. x_erw_does, x_open, x_recorded_in. x_resolution (session 118): fixed, held_for_approval
  (the fix is built and waits for a person because it moves a number on a live page) or open, with x_resolution_reason.'
