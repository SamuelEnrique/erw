- name: x_resolution_reason
  label: Why the fault stands as x_resolution says, in words
  unit: none
  type: text
  values:
    distinct: 30
    examples:
    - 'A day with a missing interval is not written. Session 65 recommended filling a single missing interval; the ERW''s
      rule is to fill nothing, so it was not applied. Open for a ruling: the cost is ISO-NE''s real-time twelve-month figure,
      which is not written.'
    - A faulty hour of one balancing authority cannot be taken out of EIA's sum. The rule leaves out the one hour of the sum
      that fails it (2020-04-10T03:00Z), and the Lower 48 is given no peak. The Lower 48's consumed intensity of April 2020
      goes with the held carbon build. It stays open until EIA republishes the hours or the ERW builds its own sum from the
      screened authorities, which no session has been asked to do.
    - 'A gap at the source: there is nothing for the ERW to fix, and nothing is filled. Each figure says how many days it
      rests on. Open because EIA has not been asked why SPP''s days are missing, and a figure for SPP that rests on 200 of
      365 days is a weak one however plainly it says so.'
    - Both figures are shown as the report states them, with the note. Which is misstated only ERCOT can say; it has not been
      asked.
    - Both sides' reports are in the table side by side and the headline says which it uses. The disagreement is the publishers'.
