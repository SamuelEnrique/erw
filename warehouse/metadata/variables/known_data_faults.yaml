- name: x_erw_does
  label: What the ERW does about the fault
  unit: none
  type: text
  values:
    distinct: 30
    examples:
    - A blank reason is kept blank ("local or system" is not guessed). The reason reaches back to 2022 in the interval table.
    - A day that is not whole is not written; March, August and September 2026 then have no monthly figure for California.
      Nothing is filled.
    - A day with a missing interval is not written. A twelve-month figure is written only when 95 percent of its hours are
      held, so ISO-NE's real-time figure in hub_price_comparison is not written.
    - A month's figures rest on the days held and say how many (days_held, days_left_out, thin_month). A figure that needs
      most of a year is not written under its share (SPP's carbon intensity in hub_price_comparison).
    - A pair-day is left out when it is further than 10 median absolute deviations, and at least 500 MWh, from the pair's
      own median over its history (warehouse/derived/ba_supply.py, MADS and FLOOR; the same rule in ai_power_regions.py and
      network_daily.py). The count left out is in each replay file and printed on the page.
  missing_cells: 0
  missing_meaning: never empty
  source_name: erw_does
  documented_by: header; connector data_faults.py
