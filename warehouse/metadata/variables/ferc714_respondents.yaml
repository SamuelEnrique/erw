# The codebook's metadata of table ferc714_respondents (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ferc714_respondents
family: ferc714
shape: entities
row: One FERC Form 714 respondent (the utility that files for a planning area), with its FERC and EIA identifiers, from PUDL's
  respondent table.
time: No time column. vintage is the Last-Modified time of PUDL's parquet file; the table is a snapshot as read on its retrieved_at.
vintage_rule: One row a respondent, rewritten whole by each run; the connector stops when an id is missing or given twice.
keys:
- entity_id
license: internal
tier: source
interval: snapshot
source:
- name: 'pudl:core_ferc714__respondent_id Catalyst Cooperative (PUDL), from FERC Form 714: respondent ids (stable release)'
  url: https://s3.us-west-2.amazonaws.com/pudl.catalyst.coop/stable/core_ferc714__respondent_id.parquet
cite: Catalyst Cooperative (PUDL), from FERC Form 714. FERC Form 714 respondent ids (PUDL core table, stable release). Via
  the Energy Research Warehouse (ERW), table `ferc714_respondents`.
method: docs/methods/ferc714_area_demand.md
header_title: FERC Form 714's respondents, each planning area's filer with FERC's and EIA's ids (session 514)
