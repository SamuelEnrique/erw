table: noaa_grid_weather_daily
family: noaa
shape: series
row: One grid's weighted daily temperature, dew point, heating or cooling degree days, from five NOAA airport stations a grid
  weighted by their metropolitan populations, 2019 to now.
time: ts_utc is the grid's local day at 00:00:00Z (America/Chicago for ERCOT, MISO and SPP, America/Los_Angeles for CAISO,
  America/New_York for NYISO, ISO-NE and PJM). A day is written only when every one of its hours is held.
vintage_rule: Each run deletes the table and writes it whole from the saved files, so a day is recomputed every run; with
  --refresh the later answer's hours replace the held ones. vintage is not filled.
