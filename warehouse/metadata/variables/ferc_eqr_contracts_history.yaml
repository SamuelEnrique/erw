# The codebook's metadata of table ferc_eqr_contracts_history (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ferc_eqr_contracts_history
family: ferc
shape: events
row: One product of one agreement as the seller filed it in its FERC Electric Quarterly Report for a quarter before the newest
  (x_quarter says which); a contract is here once for each quarter it was filed in.
time: event_date is the contract's execution date (a date, as filed); x_quarter names the quarter filed for.
vintage_rule: 'Merged by event_id, which carries the quarter: each run of the connector''s history mode adds one quarter.
  Rows are never added up across quarters. No vintage column.'
keys:
- event_id
license: internal
tier: source
interval: event
source:
- name: ferc:eqr Federal Energy Regulatory Commission, Electric Quarterly Reports, quarterly filings of all companies, CSV_2025_Q3.zip,
    https://eqrreportviewer.ferc.gov/DownloadRepositoryProd/<key from the viewer's Downloads tab>/BulkNew/CSV/CSV_2025_Q3.zip
  url: https://eqrreportviewer.ferc.gov/DownloadRepositoryProd/<key
cite: 'Federal Energy Regulatory Commission (FERC). Electric Quarterly Reports (EQR): contracts, quarterly filings of all
  companies. Via the Energy Research Warehouse (ERW), table `ferc_eqr_contracts_history`.'
method: docs/methods/eqr_terms.md
header_title: Rebuilt from the ERW archive by warehouse/restore_tables.py (session 305), as of run 20261009T221405Z-local
  (2026-10-09T22:14:05Z); that run's own header of the table follows
header_shape: 'Shape: events (docs/datastandard.md v0). One row per product of an agreement, as the seller filed it. event_date:
  the contract''s execution date. event_type contract. parties: seller;buyer. mw: the quantity when its units are MW; price:
  the rate when its units are $/MWH (currency USD). status: terminated when an actual termination date is filed, else in_force.
  x_<column>: FERC''s own contract columns, as filed; x_company_id FERC''s company identifier of the filer; x_filing the filing''s
  zip; x_quarter the quarter.'
