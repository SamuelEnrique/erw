  Indiana Utility Regulatory Commission; Public Utilities Commission of Ohio; Public Utility Commission of Texas; Virginia
  State Corporation Commission. Dockets of the Federal Energy Regulatory Commission: proceedings and orders on large loads,
  read on 8 October 2026 from order files at known addresses on ferc.gov, the Federal Register at govinfo.gov, and the copies
  of FERC orders that PJM and SPP post (session 154; docs/methods/datacenter_cost.md); Dockets of the Georgia Public Service
  Commission: proceedings and orders on large loads, read on 8 October 2026 from the docket and document search and its files
  (session 154; docs/methods/datacenter_cost.md); Dockets of the Indiana Utility Regulatory Commission: proceedings and orders
  on large loads, read on 8 October 2026 from the commission''s order files, weekly orders page, hearings lists and agendas
  (session 154; docs/methods/datacenter_cost.md); Dockets of the Public Utilities Commission of Ohio: proceedings and orders
  on large loads, read on 8 October 2026 from the docketing system''s case cards (the document viewer answers with a reCAPTCHA
  and was not requested) (session 154; docs/methods/datacenter_cost.md); Dockets of the Public Utility Commission of Texas:
  proceedings and orders on large loads, read on 8 October 2026 from the Interchange filing lists and documents (session 154;
  docs/methods/datacenter_cost.md); Dockets of the Virginia State Corporation Commission: proceedings and orders on large
  loads, read on 8 October 2026 from the docket search''s case and document listings (session 154; docs/methods/datacenter_cost.md)
  [PAUSED 2026-10-10: The commission''s robots file disallows every automated request of its site (every path, every agent
