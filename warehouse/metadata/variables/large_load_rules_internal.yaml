  State Corporation Commission. Dockets of the Federal Energy Regulatory Commission: proceedings and orders on large loads,
  read on 8 October 2026 from order files at known addresses on ferc.gov, the Federal Register at govinfo.gov, and the copies
  of FERC orders that PJM and SPP post (session 154; docs/methods/datacenter_cost.md); Dockets of the Georgia Public Service
