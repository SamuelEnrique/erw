# The codebook's metadata of table ferc_eqr_contract_terms (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ferc_eqr_contract_terms
family: ferc
shape: events
row: One contract row of the newest quarter of FERC's Electric Quarterly Reports (same event_id as ferc_eqr_contracts), with
  the buyer under one name, megawatts and price where stated, tags, and the quarters the contract is held in.
time: event_date is the contract's execution date, as in ferc_eqr_contracts.
vintage_rule: Rebuilt whole from its inputs by each run of the builder (the old file is removed first); no vintage column.
keys:
- event_id
license: internal
tier: source
interval: event
source:
- name: 'erw:eqr_terms from ferc:eqr, Federal Energy Regulatory Commission, Electric Quarterly Reports; quarters held: 2025_Q3,
    2025_Q4, 2026_Q1, 2026_Q2'
  url: ''
cite: 'Energy Research Warehouse (ERW), derived. FERC EQR contract terms: buyers under one name, megawatts and prices where
  stated, tags, changes by quarter (docs/methods/eqr_terms.md). Via the Energy Research Warehouse (ERW), table `ferc_eqr_contract_terms`.'
method: docs/methods/eqr_terms.md
header_title: 'the contract rows of FERC''s Electric Quarterly Reports in terms a reader can sort by: the buyer under one
  name, megawatts and prices where the filing states them, tags from the product fields (session 125)'
header_shape: 'Shape: events (docs/datastandard.md v0). One row for each row of ferc_eqr_contracts (2026_Q2), with its event_id.
  parties: seller;buyer as counted (the rule merges of ferc_eqr_buyer_names applied; the doubtful pairs are not merged). mw:
  stated in MW, or in kW over 1,000 (x_mw_source). price: USD per MWh, filed as a number in $/MWH or $/KWH, or read from the
  rate description in those units (x_price_source: filed, words). x_price_words, x_price_words_unit: what was read from the
  words, in any unit; x_price_unread: why nothing was. x_tag: tolling or storage, from the product fields only. x_contract,
  x_first_quarter, x_quarters_held. x_mw_ranked: no when the megawatts stated are above 6,809 MW, the largest station operating
  in the United States (eia860m_operating_generators, vintage 2026-09).'
