  gasoline or natural gas, as EIA published it, 2019 to 5 April 2024.
time: ts_utc is the trading date at 00:00:00Z (freq P1D), a date.
vintage_rule: A closed history, rebuilt whole by each run (the file is deleted, then written); EIA's series end on 5 April
