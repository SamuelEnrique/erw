cite: U.S. Department of Energy (DOE). Low-Income Energy Affordability Data (LEAD Tool), 2022 Update. Via the Energy Research
  Warehouse (ERW), table `doe_lead_energy_burden`.
method: docs/methods/doe_lead_energy_burden.md
header_title: 'U.S. Department of Energy, Low-Income Energy Affordability Data (LEAD Tool), 2022 update: households, their
  average income and energy costs, and their energy burden, by county and state and by income as a share of area median income
  (session 2140)'
header_shape: 'Shape: series (docs/datastandard.md v0). entity doe_lead:<county FIPS> or doe_lead:<state>; variable <measure>:ami_<bracket>
  (brackets 0_30, 30_60, 60_80, 80_100, 100_150, 150_up percent of area median income, and all); measures households (count,
  LEAD''s UNITS), income_avg, electricity_cost_avg, gas_cost_avg, other_fuel_cost_avg, energy_cost_avg (USD a year), energy_burden
  (pct). ts_utc 1 January of the year the file names; freq P1Y; x_level county or state; x_bracket as LEAD writes it; x_fips;
  x_file the CSV read.'
