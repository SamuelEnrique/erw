# The codebook's metadata of table doe_lead_energy_burden (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: doe_lead_energy_burden
family: doe
shape: series
row: One county's or state's value of one measure of households, income or energy cost for one income bracket (a share of
  area median income), from DOE's LEAD Tool 2022 update, summed by the ERW from LEAD's cells.
time: ts_utc is 2022-01-01, the year the files name (a year, not an instant); freq P1Y.
vintage_rule: Each write replaces the table whole from the saved zips; a zip already saved is never asked again. vintage is
  the state zip's retrieval time, not its Last-Modified.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: doe:lead_2022 DOE, LEAD Tool 2022 Update
