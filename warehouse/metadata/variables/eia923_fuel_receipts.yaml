# The codebook's metadata of table eia923_fuel_receipts (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia923_fuel_receipts
family: eia923
shape: events
row: One delivery of fuel to one power plant in one month, with its supplier, quantity, quality and cost, from Form EIA-923
  Schedule 2 (Fuel Receipts and Costs).
time: event_date is the receipt month's first day (a month, not a day).
vintage_rule: A run reads the years given with --years and writes the table whole; a row repeated with every field the same
  is kept once.
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: eia:eia923:fuel_receipts U.S. Energy Information Administration, Form EIA-923, Schedule 2 (page 5, fuel receipts and
    costs)
  url: https://www.eia.gov/electricity/data/eia923/
cite: U.S. Energy Information Administration (EIA). Form EIA-923, Schedule 2, fuel receipts and costs. Via the Energy Research
  Warehouse (ERW), table `eia923_fuel_receipts`.
method: docs/methods/eia923_receipts.md
header_title: EIA-923 Schedule 2, each plant's fuel receipts and their cost, delivery by delivery, a month (session 900)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id eia923r:<plant>:<year-month>:<SHA-1 of the row, 12 characters>;
  event_date the month''s first day; event_type fuel_receipt; parties the supplier; x_* EIA''s columns, headings as names:
  x_quantity in x_quantity_unit (short_ton, bbl or Mcf), x_average_heat_content MMBtu per unit, sulfur, ash and moisture percent
  by weight, mercury and chlorine ppm, x_fuel_cost cents per MMBtu.'
