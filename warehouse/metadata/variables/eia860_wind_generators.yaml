# The codebook's metadata of table eia860_wind_generators (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia860_wind_generators
family: eia860
shape: entities
row: One wind generator from Form EIA-860's wind schedule (3_2) for data year 2025, sheets Operable, Retired and Canceled,
  with its turbines, their maker, model, design wind speed, wind class and hub height.
time: No time column; vintage is the data year (2025). status_date is the first day of the month of operation (operable) or
  of retirement (retired), empty for the canceled and the indefinitely postponed.
vintage_rule: A snapshot; each run replaces the table whole with the newest final year EIA's page links, so an earlier year
  is not kept.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:eia860:wind U.S. Energy Information Administration, Form EIA-860 Annual Electric Generator Report, 3_2_Wind_Y2025.xlsx
  url: https://www.eia.gov/electricity/data/eia860/
cite: U.S. Energy Information Administration (EIA). Form EIA-860 Annual Electric Generator Report, wind generators' details.
  Via the Energy Research Warehouse (ERW), table `eia860_wind_generators`.
