# The codebook's metadata of table lbnl_hybrid_plants (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: lbnl_hybrid_plants
family: lbnl
shape: entities
row: One operating U.S. hybrid power plant (two kinds of generator, or a generator and storage, at one site) or a storage-only
  plant Berkeley Lab lists beside them, from LBNL's Hybrid Power Plants 2026 data update, sheet "01. Operating Plants".
time: No time column. vintage is the data file's last-modified time; the plants are those operating through 2025.
vintage_rule: A snapshot, rewritten whole by each run from the one data file; LBNL publishes each year's update at a new address.
keys:
- entity_id
license: internal
tier: source
interval: snapshot
source:
- name: 'lbnl:hybrid_plants Lawrence Berkeley National Laboratory, Hybrid Power Plants: Status of Operating and Proposed Plants,
    2026 Data Update'
  url: https://eta-publications.lbl.gov/publications/hybrid-power-plants-status-4
cite: 'Lawrence Berkeley National Laboratory (Berkeley Lab). Hybrid Power Plants: Status of Operating and Proposed Plants
  (operating plants). Via the Energy Research Warehouse (ERW), table `lbnl_hybrid_plants`.'
