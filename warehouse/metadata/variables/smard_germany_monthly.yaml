# The codebook's metadata of table smard_germany_monthly (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: smard_germany_monthly
family: other_sources
shape: series
row: Germany's actual generation from one source, or its grid load, in one month, from the Bundesnetzagentur's SMARD.
time: ts_utc is the month's first day (SMARD's Start date, a month in German time); freq P1M; from 2015-01.
vintage_rule: Rewritten whole as one snapshot by each run from SMARD's one download; vintage is not filled.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1M
source:
- name: smard:market_data_month Bundesnetzagentur, SMARD market data
