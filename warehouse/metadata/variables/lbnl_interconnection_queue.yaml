- 'poi_name, service (ERIS, NRIS, NRIS/ERIS, Other) and project_type (Generation, Replacement, Surplus, Upgrade): Berkeley
  Lab''s own codebook sheet (''04. Data Codebook'') defines them, but the repository holds no copy of it and no method note
  or connector says what they mean.'
- 'prop_year: no note says it is the year of prop_date, though it is empty on exactly the rows prop_date is (5,265).'
