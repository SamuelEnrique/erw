time: No time column; status_date is the online date (operating), the withdrawal date (withdrawn) or the request date; vintage
  is the edition ('2026 edition (through 2025)').
vintage_rule: A snapshot of one edition; a run replaces the table. Rebuilt from the ERW archive in session 305.
