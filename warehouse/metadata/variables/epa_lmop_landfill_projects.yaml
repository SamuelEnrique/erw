# The codebook's metadata of table epa_lmop_landfill_projects (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: epa_lmop_landfill_projects
family: epa
shape: entities
row: One landfill and one landfill gas energy project at it (or the landfill alone, with a project id of its own) in EPA's
  LMOP database as of September 2024.
time: No time column; status_date is blank; project_start_date and project_shutdown_date keep EPA's dates. vintage is the
  file's last-modified time.
vintage_rule: A snapshot, rewritten whole by each run; no schedule runs it.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: epa:lmop U.S. Environmental Protection Agency, Landfill Methane Outreach Program (LMOP) Database, composite data file
  url: https://www.epa.gov/lmop/lmop-landfill-and-project-database
cite: U.S. Environmental Protection Agency (EPA). Landfill Methane Outreach Program (LMOP) Database, composite data file.
  Via the Energy Research Warehouse (ERW), table `epa_lmop_landfill_projects`.
method: docs/methods/epa_lmop_landfill_projects.md
header_title: 'U.S. EPA, Landfill Methane Outreach Program (LMOP) Database, composite data file: every landfill the program
  tracks and its landfill gas energy projects (session 2127)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id lmop:<Landfill ID>:<Project ID>, one row a landfill and
  project as EPA lists them; entity_type project; capacity_mw EPA''s rated MW capacity, repeated on each landfill''s row of
  a project fed by several landfills, so never summed over rows (one row a project id counts it once); status operating, under_construction,
  planned or retired, blank for a landfill without a project (lmop_status keeps EPA''s word).'
