header_shape: 'Shape: series (docs/datastandard.md v0). entity eia930:<A>-<B>, variable interchange_mwh, MWh, freq P1M, ts_utc
  the first day of the Eastern month at 00:00:00Z. A''s report is power from A to B as A filed it (A before B by code); B''s
  report of the same tie is turned to that direction. x_a_report_mwh and x_b_report_mwh sum each side''s reported hours (x_hours_a,
  x_hours_b); over the hours both reported (x_hours_both), x_gap_mwh is A''s less B''s and value is the mean of the two (x_basis
  mean); where no hour has both, value is the side that reported (x_basis a or b). x_direction: a_to_b above zero, b_to_a
  below. x_level: ba or region (region pairs from eia930_region_pair_hourly''s first and second reports). Method: docs/methods/interchange_pairs.md.'
