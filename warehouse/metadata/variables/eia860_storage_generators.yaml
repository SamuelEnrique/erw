# The codebook's metadata of table eia860_storage_generators (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia860_storage_generators
family: eia860
shape: entities
row: One energy storage generator from Form EIA-860's energy storage schedule (3_4) for data year 2025, sheets Operable, Proposed,
  Retired and Canceled, with its energy capacity, charge rates, chemistry, uses, coupling and the units it supports.
time: No time column; vintage is the data year (2025). status_date is the first day of the month of operation (operable) or
  of retirement (retired), empty for the proposed, the canceled and the indefinitely postponed; a proposed generator's planned
  month is in x_current_month and x_current_year.
vintage_rule: A snapshot; each run replaces the table whole with the newest final year EIA's page links, so an earlier year
  is not kept.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: eia:eia860:energy_storage U.S. Energy Information Administration, Form EIA-860 Annual Electric Generator Report, 3_4_Energy_Storage_Y2025.xlsx
  url: https://www.eia.gov/electricity/data/eia860/
cite: U.S. Energy Information Administration (EIA). Form EIA-860 Annual Electric Generator Report, energy storage generators'
  details. Via the Energy Research Warehouse (ERW), table `eia860_storage_generators`.
method: docs/methods/eia860_schedules.md
header_title: EIA-860, energy storage generators' details, data year 2025 (session 885)
