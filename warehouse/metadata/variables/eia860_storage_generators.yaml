  tables name the same generator eia860:<plant code>:<generator id>); entity_type generator; name the plant''s name; capacity_mw
  nameplate; status from EIA''s code (x_eia_status); status_date the month of operation (operable) or of retirement (retired),
  empty for proposed and canceled. x_* every other column of EIA''s sheet, its heading as a name; x_sheet the sheet.'
