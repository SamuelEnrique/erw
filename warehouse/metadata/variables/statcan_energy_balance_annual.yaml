table: statcan_energy_balance_annual
family: statcan
shape: series
row: One area's value of one supply or demand line for one fuel in one year, from Statistics Canada's energy balance, table
  25-10-0029-01, converted from terajoules to MWh.
time: ts_utc is the year's 1 January at 00:00:00Z (a year, not an instant); freq P1Y.
vintage_rule: A snapshot; each run writes the whole table again; vintage is the zip's Last-Modified time (the release the
  figures come from).
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: statcan:25-10-0029-01 Statistics Canada, Table 25-10-0029-01, Supply and demand of primary and secondary energy in
    terajoules, annual
  url: https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510002901
cite: Statistics Canada. Table 25-10-0029-01, Supply and demand of primary and secondary energy in terajoules, annual. Via
  the Energy Research Warehouse (ERW), table `statcan_energy_balance_annual`.
method: docs/methods/statcan_energy_balance_annual.md
header_title: Statistics Canada, table 25-10-0029-01, supply and demand of primary and secondary energy, by province and fuel,
  a year, 1995 to 2024 (session 2383)
header_shape: 'Shape: series (docs/datastandard.md v0). entity statcan_eb:<area>:<fuel>; variable the supply and demand line
  as a slug; unit MWh (StatCan''s terajoules times 1,000,000/3,600); freq P1Y; ts_utc the year''s 1 January; geo CA, CA-<province>,
  or blank for the Atlantic provinces (atl) and the three territories together (ter); x_fuel, x_line StatCan''s names; x_vector;
  x_terminated t for an ended series. Fuels and lines overlap (totals hold their parts): a sum takes one level. Exports, stock
  variation (positive for a build) and transformation are subtracted; transfers and adjustments are signed and added; the
  statistical difference is not part of final demand. Electricity''s demand lines, under primary electricity, cover all electricity;
  its statistical difference leaves out secondary net supply in 2005 to 2009. Primary electricity''s production appears to
  hold wind, solar and tidal too (StatCan does not say).'
