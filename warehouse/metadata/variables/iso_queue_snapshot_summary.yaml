# The codebook's metadata of table iso_queue_snapshot_summary (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: iso_queue_snapshot_summary
family: iso
shape: series
row: One summary figure of CAISO's, ERCOT's or SPP's interconnection queue, either at the queue's snapshot by status and fuel
  group, or for one request year by grid.
time: For snapshot rows ts_utc is the snapshot's retrieval day and freq is empty; for year rows ts_utc is the year's first
  day with freq P1Y.
vintage_rule: Rebuilt from the queue tables' current snapshots by each run; one snapshot a grid, so withdrawals between snapshots
  are not counted. vintage is the snapshot date.
keys:
- entity
- variable
- ts_utc
license: public
tier: derived
interval: ;P1Y
source:
- name: the ISOs' interconnection queues as gridstatus reads them (CAISO, ERCOT, SPP)
  url: ''
cite: Energy Research Warehouse (ERW), derived. The ISO interconnection queues summarized from their own snapshots (docs/methods/iso_queue_snapshot_summary.md).
  Via the Energy Research Warehouse (ERW), table `iso_queue_snapshot_summary`.
method: docs/methods/iso_queue_snapshot_summary.md
header_title: 'the ISO interconnection queues summarized from their own snapshots: MW and requests by grid, status and fuel
  group; entered, completed and withdrawn by year; months from request to in-service (derived, session 2953)'
header_shape: 'Shape: series (docs/datastandard.md v0). entity iso_queue:<grid>:<fuel group> (the snapshot, ts_utc its day)
  or iso_queue:<grid> (by year, freq P1Y); variables <status>_mw and _count; entered_, completed_, withdrawn_ (mw and count);
  in_service_dated; median_months_to_in_service (at 5 or more dated requests).'
