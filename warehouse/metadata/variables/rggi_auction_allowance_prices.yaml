# The codebook's metadata of table rggi_auction_allowance_prices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: rggi_auction_allowance_prices
family: other_sources
shape: series
row: One RGGI CO2 allowance auction's value of one result, for its current-vintage or future-vintage allowances.
time: ts_utc is the auction date at 00:00:00Z; freq P3M.
vintage_rule: 'Merged by (entity, variable, ts_utc) (ip.write_csv): each run reads the whole page; a value RGGI changes replaces
  the old row, and a row RGGI no longer shows stays in the file; vintage is not filled.'
