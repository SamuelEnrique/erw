table: energycom_ghana_electricity_annual
family: other_sources
shape: series
row: One year's value of one measure of Ghana's electricity (generation by source, imports, exports, net exports, or the Ghana
  and system peak load), from the Energy Commission's National Energy Statistical Bulletin.
time: ts_utc is the year's 1 January at 00:00:00Z; freq P1Y.
vintage_rule: 'Merged by (entity, variable, ts_utc) (ip.write_csv): a run replaces the rows it reads again and keeps rows
  from earlier runs; vintage is not filled.'
keys:
- entity
- variable
- ts_utc
license: internal
tier: source
interval: P1Y
source:
- name: energycom:national_energy_statistics Energy Commission, Ghana, 2026 National Energy Statistical Bulletin, tables 3.7
    Annual Electricity Generation, 3.8 Electricity Import and Export and 3.9 Ghana and System Peak Load (printed pages 12,
    14 and 16; 3.4 to 3.6 in its list of tables)
  url: https://www.energycom.gov.gh/index.php/planning/energy-statistics
cite: Energy Commission, Ghana. National Energy Statistical Bulletin 2026, tables 3.7 (generation), 3.8 (imports and exports)
  and 3.9 (peak load). Via the Energy Research Warehouse (ERW), table `energycom_ghana_electricity_annual`.
method: docs/methods/energycom_ghana_electricity_annual.md
header_title: Energy Commission, Ghana, National Energy Statistical Bulletin 2026, electricity generation by source, imports
  and exports, and peak load, 2000 to 2025 (session 2373)
header_shape: 'Shape: series (docs/datastandard.md v0). entity energycom:GH; variable generation_hydro, generation_thermal,
  generation_other_renewables, generation_total, imports, exports, net_exports (MWh, the bulletin''s GWh times 1,000), peak_ghana,
  peak_system (MW); ts_utc the year''s 1 January; freq P1Y; geo GH. generation_total is hydro plus thermal plus other renewables
  (footnote 8''s "and import" does not hold for table 3.7: the bulletin''s energy transmitted is that total plus imports);
  the system peak is defined as Ghana''s peak, or Ghana''s load at peak, plus export load, so peak_system less peak_ghana
  is not export load.'
