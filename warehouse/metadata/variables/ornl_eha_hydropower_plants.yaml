header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id ornl_eha:<EHA_PtID>; entity_type plant; geo US-<state>;
  lat, lon NAD83 as ORNL gives them; capacity_mw hy_mw plus psh_mw (the plant''s conventional hydro and pumped storage capacity);
  status and operator empty (the database lists plants in operation and names owners, in plant_owner and dam_owner); hy_avg_mwh
  the average annual net hydro generation since 2002 (or the FERC authorization''s estimate), psh_avg_mwh the same for gross
  pumped storage generation; *_capacity_factor_pct percent; *_first_year the year the first unit came online; ferc_issued
  and ferc_expires the latest FERC authorization''s dates (exemptions and conduits do not expire); huc the hydrologic unit
  code as given.'
