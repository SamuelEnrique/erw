# The codebook's metadata of table ornl_eha_hydropower_plants (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: ornl_eha_hydropower_plants
family: ornl
shape: entities
row: One U.S. hydropower or pumped storage plant in operation, from ORNL's Existing Hydropower Assets (EHA) Plant Database,
  2026.
time: No time column; the table is a snapshot of the 2026 edition; vintage is the workbook's last-modified time (UTC).
vintage_rule: A snapshot of one yearly edition, replaced whole by each run; a new edition has a new address.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: ornl:eha_plant M.M. Johnson, S.-C. Kao and R. Uria-Martinez, Existing Hydropower Assets (EHA) Plant Database, 2026,
    HydroSource, Oak Ridge National Laboratory, Oak Ridge, Tennessee, DOI 10.21951/EHA_FY2026/3374497
  url: https://hydrosource.ornl.gov/data/datasets/eha-plant-2026/
cite: Oak Ridge National Laboratory (ORNL), HydroSource. Existing Hydropower Assets (EHA) Plant Database. Via the Energy Research
  Warehouse (ERW), table `ornl_eha_hydropower_plants`.
method: docs/methods/ornl_hydropower.md
header_title: 'Oak Ridge National Laboratory, Existing Hydropower Assets (EHA) Plant Database, 2026: every U.S. hydropower
  and pumped storage plant (session 911)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id ornl_eha:<EHA_PtID>; entity_type plant; geo US-<state>;
  lat, lon NAD83 as ORNL gives them; capacity_mw hy_mw plus psh_mw (the plant''s conventional hydro and pumped storage capacity);
  status and operator empty (the database lists plants in operation and names owners, in plant_owner and dam_owner); hy_avg_mwh
  the average annual net hydro generation since 2002 (or the FERC authorization''s estimate), psh_avg_mwh the same for gross
  pumped storage generation; *_capacity_factor_pct percent; *_first_year the year the first unit came online; ferc_issued
  and ferc_expires the latest FERC authorization''s dates (exemptions and conduits do not expire); huc the hydrologic unit
  code as given.'
