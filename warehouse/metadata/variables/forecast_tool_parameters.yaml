# are defined in _shared.yaml.
table: forecast_tool_parameters
family: erw_derived
shape: series
row: 'One parameter the forecast tool reads, for one technology and place: EIA''s capital cost and case figures, JEDI''s construction
  cost and taxable share, or the gas plant''s fuel defaults.'
time: ts_utc is 1 January of the value's dollar year where it has one, else 2026-01-01; no freq (a parameter, not a time series).
vintage_rule: Rewritten whole by each run from the forecast tool's files (the old file removed first); vintage is not filled.
keys:
- entity
- variable
- ts_utc
license: public
tier: derived
interval: ''
source:
- name: 'eia:capital_cost_aeo2025 U.S. Energy Information Administration (EIA), Capital Cost and Performance Characteristic
    Estimates for Utility Scale Electric Power Generating Technologies (AEO2025), Appendix A,  nlr:jedi_models National Laboratory
    of the Rockies (NLR, formerly NREL), JEDI models (Jobs and Economic Development Impact),  erw:forecast_gas: the study''s
    heat rate, JEDI''s default capacity factor, eia_steo_forecasts'' NGHHUUS and EIA''s heat content'
  url: https://www.nlr.gov/analysis/jedi/models
cite: Energy Research Warehouse (ERW); National Laboratory of the Rockies (NLR, formerly NREL); U.S. Energy Information Administration
  (EIA). Capital Cost and Performance Characteristic Estimates for Utility Scale Electric Power Generating Technologies (AEO2025),
  Appendix A; JEDI models (Jobs and Economic Development Impact); The forecast tool's gas fuel defaults (site/data/forecast/gas.json).
