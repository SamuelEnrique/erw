  or <state>_<city>); variables overnight_cost (USD/kW, x_dollar_year), construction_cost (USD/MW, JEDI''s default project,
  its model''s dollar year), construction_months, case_mw, operating_life (year), heat_rate (MMBtu/MWh), location_variation
