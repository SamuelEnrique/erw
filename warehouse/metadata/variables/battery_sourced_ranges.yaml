# The codebook's metadata of table battery_sourced_ranges (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: battery_sourced_ranges
family: battery
shape: series
row: One published low, mid or high case of one utility-scale battery cost or finance assumption, for one source, technology
  and year (NLR's 2025 ATB).
time: ts_utc is 1 January of the year the value is for (freq P1Y); vintage is the workbook's date.
vintage_rule: A snapshot, replaced whole by each run; vintage is the workbook's date (27 August 2026).
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: 'nlr:atb-2025-v1 National Laboratory of the Rockies (NLR), 2025 Electricity Annual Technology Baseline (ATB), workbook
    2025_v1_Workbook_08-27-2026.xlsx, sheet Utility-Scale Battery - R&D (battery costs from Cole, Ramasamy and Olmez Turan,
    Cost Projections for Utility-Scale Battery Storage: 2025 Update, NREL/TP-6A40-93281)'
  url: https://data.openei.org/files/8759/2025_v1_Workbook_08-27-2026.xlsx
cite: National Laboratory of the Rockies (NLR, formerly NREL). 2025 Electricity Annual Technology Baseline (ATB), workbook
  2025_v1_Workbook_08-27-2026.xlsx. Via the Energy Research Warehouse (ERW), table `battery_sourced_ranges`.
method: docs/methods/battery_sourced_ranges.md
header_title: published low and high cases of the battery's assumptions, one row per source, case and assumption (session
  306)
header_shape: 'Shape: series (docs/datastandard.md v0). entity <source>:<technology>:<case>; ts_utc the year the value is
  for; x_case low, mid or high on the cost scale; x_page where the number stands in the document. Nothing is filled: an assumption
  a source does not state has no row.'
