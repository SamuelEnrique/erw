  market (DAM); RTBM LMP by Settlement Location, 5-minute; Real-Time Energy Market Five-Minute LMPs; Real-Time Final Market
  LMP, hourly (daily csv) [PAUSED 2026-10-04: MISO''s terms forbid automated access; pulls paused pending a review of MISO''s
  terms by a person (docs/methods/miso_pause.md)]; Real-Time Market LBMP, zonal, RTD 5-minute (P-24A); Real-Time Preliminary
