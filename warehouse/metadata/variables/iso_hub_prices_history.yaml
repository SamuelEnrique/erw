# The codebook's metadata of table iso_hub_prices_history (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: iso_hub_prices_history
family: iso
shape: series
row: The day-ahead or real-time price at the main hub of CAISO, MISO, NYISO, ISO-NE or SPP for one interval, a history from
  2023-07-06 (CAISO) or 2024-09-01.
time: ts_utc is the start of the interval in UTC; day-ahead and MISO's real-time are hourly, the other real-time prices 15-minute
  means of 5-minute prices.
vintage_rule: The daily run merges the live tables' rows of these hubs into this table by (entity, variable, ts_utc); never
  trimmed. A day is written only when every interval of every hub is there.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT15M;PT1H
source:
