header_title: what ERCOT's storage resources did in real time, beside what they were awarded day-ahead, by month (derived,
  session 120)
header_shape: 'Shape: series (docs/datastandard.md v0), entity ercot:esr_fleet, freq P1M, ts_utc the first day of the local
  (Central) month at 00:00:00Z. Over the operating days both disclosures hold. Variables: days_held, days_in_month, resources,
  resource_hours (and those in one file only); mw (each resource''s highest day-ahead HSL of the month, added up); rt_discharge_mwh,
  rt_charge_mwh, rt_net_mwh (Telemetered Net Output integrated); da_sold_mwh, da_bought_mwh, da_net_mwh; rt_deviation_mwh;
  as_rt_<service>_mwh, as_da_<service>_mwh, as_imbalance_<service>_mwh (regup, regdn, rrs, ecrs, nspin: a MW for an hour);
  revenue_da_energy_usd, revenue_da_ancillary_usd, revenue_da_usd (the day-ahead awards at their own prices); revenue_rt_output_hub_usd,
  revenue_da_position_hub_usd, revenue_rt_deviation_hub_usd, revenue_market_hub_usd; each revenue also _per_mw; intervals,
  intervals_priced; da_node_minus_hub_sold, da_node_minus_hub_bought (USD/MWh).'
