# The codebook's metadata of table uswtdb_wind_turbines (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: uswtdb_wind_turbines
family: other_sources
shape: entities
row: One utility-scale land-based or offshore wind turbine in the USGS U.S. Wind Turbine Database.
time: No time column; project_year is the project's year, not the turbine's; image_date the date of the image it was located
  on.
vintage_rule: Rewritten whole as one snapshot by each run from the database's API; vintage is not filled.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: usgs:uswtdb U.S. Geological Survey, Lawrence Berkeley National Laboratory and American Clean Power Association, U.S.
