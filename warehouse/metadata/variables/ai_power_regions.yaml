header_title: where the next gigawatts for AI can come from, one row of measures per ISO region (derived, session 62)
header_shape: 'Shape: series (docs/datastandard.md v0); entity iso:<region>; one row per region and measure; x_window the
  measure''s period, x_note its event or snapshot. Cost: flat_rt_price_usd_mwh, flat_da_price_usd_mwh, flat_1gw_cost_usd (a
  flat 1 GW for a year, wholesale energy only). Carbon: carbon_intensity_kg_mwh, flat_1gw_co2_t. Stress: scarcity_hours_200,
  scarcity_hours_1000, max_rt_hour_usd_mwh, emergency_days (CAISO only), event_largest_effect_pct and event_largest_is_<event>
  (1: which event). Connection: lbnl_active_mw, lbnl_active_requests, lbnl_median_years_to_cod, lbnl_completion_pct, queue_active_mw.
  Imports: net_import_share_pct, net_import_days_pct, peak_import_share_pct, pair_import_share_pct (net_import_share_pct is
  EIA''s balance, demand less net generation; the others are from the pair sums over complete days). Counts behind them: rt_hours_priced,
  rt_hours_seen, carbon_days, lbnl_cod_sample, lbnl_cohort_requests, interchange_days, interchange_days_reported, screened_pair_days,
  demand_mwh.'
