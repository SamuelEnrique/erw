  EIA''s balance, demand less net generation; the others are from the pair sums over complete days). Counts behind them: rt_hours_priced,
  rt_hours_seen, carbon_days, lbnl_cod_sample, lbnl_cohort_requests, interchange_days, interchange_days_reported, screened_pair_days,
  demand_mwh.'
