# The codebook's metadata of table iso_dam_hub_prices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: iso_dam_hub_prices
family: iso
shape: series
row: The day-ahead price at one trading hub of CAISO, ERCOT, MISO or SPP for one hour.
time: ts_utc is the start of the hour in UTC; operating days are each grid's local days.
vintage_rule: Merged by (entity, variable, ts_utc) into each grid's member and consolidated by market; a day is asked on about
  three runs (and once more as a forward day), a value asked again replacing the old one; nothing trims the table. vintage
  is the operator's publish time where known (ERCOT's document time, MISO's file Last-Modified), empty for CAISO and SPP.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT1H
source:
