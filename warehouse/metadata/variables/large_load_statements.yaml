# The codebook's metadata of table large_load_statements (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: large_load_statements
family: large
shape: events
row: One figure (a quantity of large load in megawatts, or a duration of waiting) as a utility's, grid operator's or other
  body's own document states it, with the exact sentence it was read from.
time: event_date is the document's date (a month or year only, its first day; an undated document, the day it was read, and
  event_date_basis says so).
vintage_rule: 'Merged by event_id (a hash of entity, address, sentence, figure and stage words): a statement already held
  keeps its id; rows come from research passes, each proved again by the connector. No vintage column.'
keys:
- event_id
license: internal
tier: model_extracted
interval: event
source:
- name: 'erw:large_load_pilot: each row''s source_url is the utility''s or operator''s own document (or the copy a commission,
    the SEC or an operator posts); document_title, document_type, page_or_slide and page say which and where'
  url: ''
cite: 'Energy Research Warehouse (ERW), collected from utilities'' and grid operators'' public documents by an AI research
  agent, each sentence checked by code. Large load statements, 7 and 8 October 2026: eighty utilities and operators (the pilot''s
  ten, session 139; thirty more, session 141; forty more and a hunt for statements of how long a load waits, session 151),
  each statement with its sentence (docs/accelerator/large_load_pilot.md, docs/accelerator/large_load_forty.md, docs/accelerator/large_load_eighty.md).
  The publishers'' own terms were not read one by one: held internal. Via the Energy Research Warehouse (ERW), table `large_load_statements`.'
method: docs/methods/large_load_statements.md
header_title: public statements of large load waiting for power, each with the exact sentence it was read from (session 139's
  pilot of ten entities, extended to forty in session 141 and to eighty, with a hunt for statements of how long a load waits,
  in session 151)
header_shape: 'Shape: events (docs/datastandard.md v0), event_type large_load_statement; one row per figure as a document
  states it. event_date: the document''s date (a document dated to a month or a year only: its first day; document_date_as_stated
  holds what it states; a web page that prints no date: the day it was read, and event_date_basis says so). status: the stage
  in the document''s own words.'
