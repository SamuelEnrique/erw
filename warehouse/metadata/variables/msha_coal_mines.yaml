# The codebook's metadata of table msha_coal_mines (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: msha_coal_mines
family: other_sources
shape: entities
row: One US coal mine in MSHA's Mines data set, with its current status, operator, place and type.
time: No time column; status_date is the current status date; the table is a snapshot as read on its retrieved_at.
vintage_rule: Rewritten whole as one snapshot by each run from MSHA's Mines.zip; vintage is the file's Last-Modified.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: msha:open_government_data Mine Safety and Health Administration (MSHA), U.S. Department of Labor, Open Government
    Data
  url: https://arlweb.msha.gov/OpenGovernmentData/OGIMSHA.asp
cite: 'U.S. Department of Labor, Mine Safety and Health Administration (MSHA). Open Government Data: Mines; Quarterly Mine
  Employment and Production. Via the Energy Research Warehouse (ERW), table `msha_coal_mines`.'
method: docs/methods/msha_coal_mines.md
header_title: 'Mine Safety and Health Administration (MSHA), Open Government Data, Mines: every coal mine, its current status,
  operator, place and type (session 2034)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id msha_mine:<MINE_ID> (seven digits; EIA''s coal tables
  drop the leading zero); entity_type plant; name the current mine name; geo US-<state>; lat, lon as MSHA gives them (a zero
  or out-of-range one left empty); status from MSHA''s current status (Active, New Mine: active; Temporarily Idled, NonProducing:
  suspended; Abandoned, Abandoned and Sealed: retired), its words in x_mine_status; status_date the current status date; operator
  the current operator.'
