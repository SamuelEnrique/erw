table: battery_stack_monthly
family: battery
shape: series
row: One modelled battery's value of one revenue or day-count measure for one hub, strategy, duration (2, 4 or 8 hours) and
  local month, per MW of rated power (ERCOT and CAISO).
time: ts_utc is the first day of the market's local month at 00:00:00Z (freq P1M).
vintage_rule: Rebuilt by each run of the builder, except that a (hub, strategy, duration, month) whose earlier file rested
  on more days keeps its earlier rows, and months the run's inputs no longer reach are carried; vintage is not filled.
