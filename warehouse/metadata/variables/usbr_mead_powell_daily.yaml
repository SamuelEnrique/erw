# The codebook's metadata of table usbr_mead_powell_daily (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: usbr_mead_powell_daily
family: usbr
shape: series
row: One daily reading (pool elevation, storage, total release or inflow) of Lake Powell (Glen Canyon Dam) or Lake Mead (Hoover
  Dam), from Reclamation's Upper Colorado hydrodata.
time: ts_utc is the day at 00:00:00Z; freq P1D. A day not yet ended when its file was fetched is left out. Reclamation calls
  all data provisional and subject to revision.
vintage_rule: A later run merges by (entity, variable, ts_utc), a revised value replacing the old one; a day Reclamation later
  blanks writes no row, so the earlier value stays. vintage is each file's Last-Modified time.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1D
source:
