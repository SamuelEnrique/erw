# The codebook's metadata of table nlr_atb_electricity_costs (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: nlr_atb_electricity_costs
family: other_sources
shape: series
row: One technology case's value of one cost or performance measure (capital cost, O&M, fuel, capacity factor, LCOE) for one
  projection year, from the 2025 Electricity Annual Technology Baseline of the National Laboratory of the Rockies (formerly
  NREL).
time: ts_utc is the projection year's 1 January at 00:00:00Z; freq P1Y; 2023 to 2060.
vintage_rule: Rewritten whole as one snapshot by each run from the ATB's parquet file; vintage is the file's Last-Modified.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: nlr:atb_electricity National Laboratory of the Rockies (NLR, formerly NREL), 2025 Electricity Annual Technology Baseline
    (ATB) v1.0.0
  url: https://atb.nrel.gov/electricity/
cite: National Laboratory of the Rockies (NLR, formerly NREL). Electricity Annual Technology Baseline (ATB), flat file. Via
  the Energy Research Warehouse (ERW), table `nlr_atb_electricity_costs`.
method: docs/methods/nlr_atb_electricity_costs.md
header_title: NLR (formerly NREL) 2025 Electricity Annual Technology Baseline, projected costs by technology and year (session
  487)
header_shape: 'Shape: series (docs/datastandard.md v0). entity nlr_atb_2025:<technology>:<detail>:<scenario>; variables capex
  and occ (USD/kW), fixed_om (USD/kW-year), variable_om, fuel and lcoe (USD/MWh), capacity_factor (ratio); ts_utc the projection
  year''s 1 January; freq P1Y; node the ATB''s display name.'
