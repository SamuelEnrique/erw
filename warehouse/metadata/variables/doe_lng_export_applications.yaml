# The codebook's metadata of table doe_lng_export_applications (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: doe_lng_export_applications
family: doe
shape: entities
row: One application to export natural gas (as LNG, CNG or CGL) in DOE's Summary of LNG Export Applications of the Lower 48
  States, with its FTA and non-FTA parts.
time: No time column; status_date is the summary's date (as of 30 September 2026).
vintage_rule: A snapshot, written whole each run, so an application the Department drops leaves the table; no vintage column.
keys:
- entity_id
license: public
tier: source
interval: snapshot
source:
- name: doe:lng_export_applications U.S. Department of Energy, Hydrocarbons and Geothermal Energy Office, Summary of LNG Export
    Applications of the Lower 48 States
  url: https://www.energy.gov/fecm/articles/summary-lng-export-applications-lower-48-states
cite: U.S. Department of Energy (DOE). Summary of LNG Export Applications of the Lower 48 States (Hydrocarbons and Geothermal
  Energy Office). Via the Energy Research Warehouse (ERW), table `doe_lng_export_applications`.
method: docs/methods/doe_lng_export_applications.md
header_title: 'U.S. Department of Energy, Summary of LNG Export Applications of the Lower 48 States, as of 2026-09-30: each
  long-term (and small-scale) application to export LNG, CNG or CGL, with its FTA and non-FTA parts (session 2044)'
header_shape: 'Shape: entities (docs/datastandard.md v0). entity_id doe_lng:<docket> (the row''s first docket); entity_type
  project; name the applicant as printed; status active (a part approved), planned (under review), withdrawn (every part vacated,
  withdrawn, dismissed or expired); status_date the summary''s date; x_fta_bcfd and x_non_fta_bcfd the quantities in billion
  cubic feet a day; x_*_status the Department''s words.'
