cite: 'Energy Research Warehouse (ERW), derived. Who trades with whom: interchange by pair of balancing authorities and of
  regions, partners, events (docs/methods/interchange_pairs.md). Via the Energy Research Warehouse (ERW), table `interchange_event_pairs`.'
method: docs/methods/interchange_pairs.md
header_title: each pair of balancing authorities and of regions over the window of each of the nine events of /events, beside
  the same calendar hours of every other year held (session 8002, chain 501)
header_shape: 'Shape: series (docs/datastandard.md v0). entity eia930:<A>-<B>, variable interchange_mwh, MWh summed over the
  window, freq PT1H (hourly data summed), ts_utc the window''s first hour, x_window_end the hour after its last. x_event,
  x_year, x_role (event: the event''s own window; other_year: the same calendar dates in another year). The window runs from
  midnight of its first day in Eastern time to midnight after its last in Pacific time. A''s report is power from A to B as
  A filed it (A before B by code); B''s report of the same tie is turned to that direction. x_a_report_mwh and x_b_report_mwh
  sum each side''s reported hours (x_hours_a, x_hours_b); over the hours both reported (x_hours_both), x_gap_mwh is A''s less
  B''s and value is the mean of the two (x_basis mean); where no hour has both, value is the side that reported (x_basis a
  or b). x_direction: a_to_b above zero, b_to_a below. x_level: ba or region (region pairs from eia930_region_pair_hourly''s
  first and second reports). Method: docs/methods/interchange_pairs.md.'
