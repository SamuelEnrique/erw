# The codebook's metadata of table iso_rtm_hub_prices (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: iso_rtm_hub_prices
family: iso
shape: series
row: The real-time price at one trading hub of CAISO, ERCOT, MISO or SPP for one interval (15 minutes, or an hour for MISO).
time: ts_utc is the start of the interval in UTC; operating days are each grid's local days.
vintage_rule: Merged by (entity, variable, ts_utc) into each grid's member and consolidated by market; a day read again replaces
  its rows, every other row is kept. vintage is the publish time where the source gives one (ERCOT's document time, MISO's
  file Last-Modified).
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: PT15M;PT1H
source:
- name: caiso:PRC_INTVL_LMP OASIS Interval Locational Marginal Prices, real-time dispatch (RTD, 5-minute)
  url: https://oasis.caiso.com/mrioasis/logon.do
- name: ERCOT NP6-785-ER Historical RTM Load Zone and Hub Prices
  url: https://www.ercot.com/mp/data-products/data-product-details?id=NP6-785-ER
- name: ERCOT NP6-905-CD Settlement Point Prices at Resource Nodes, Hubs and Load Zones
  url: https://www.ercot.com/mp/data-products/data-product-details?id=NP6-905-CD
- name: miso:rt_lmp_prelim Real-Time Preliminary Ex-Post LMP, hourly (daily csv)
  url: https://www.misoenergy.org/markets-and-operations/real-time--market-data/market-reports/
- name: spp:RTBM-LMP-SL RTBM LMP by Settlement Location, 5-minute
  url: https://portal.spp.org/pages/rtbm-lmp-by-location
cite: 'California Independent System Operator (CAISO); Electric Reliability Council of Texas (ERCOT); Midcontinent Independent
  System Operator (MISO); Southwest Power Pool (SPP). Historical RTM Load Zone and Hub Prices; OASIS Interval Locational Marginal
  Prices, real-time dispatch (RTD, 5-minute); RTBM LMP by Settlement Location, 5-minute; Real-Time Final Market LMP, hourly
  (daily csv) [PAUSED 2026-10-04: MISO''s terms forbid automated access; pulls paused pending a review of MISO''s terms by
  a person (docs/methods/miso_pause.md)]; Real-Time Preliminary Ex-Post LMP, hourly (daily csv) [PAUSED 2026-10-04: MISO''s
  terms forbid automated access; pulls paused pending a review of MISO''s terms by a person (docs/methods/miso_pause.md)];
  Settlement Point Prices at Resource Nodes, Hubs and Load Zones. Via the Energy Research Warehouse (ERW), table `iso_rtm_hub_prices`.'
method: docs/methods/automated_analysis_findings.md
header_title: real-time hub prices, CAISO, ERCOT, MISO and SPP
header_shape: 'Shape: series (docs/datastandard.md v0), a consolidated table (session 29): the 4 tables it replaced are its
  rows, told apart by the partition column market (docs/migrations/2026-09-29-consolidation.md; the map is warehouse/metadata/table_migrations.csv).
  ts_utc is interval start, UTC.'
