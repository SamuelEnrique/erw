# The codebook's metadata of table nrc_rop_findings (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: nrc_rop_findings
family: nrc
shape: events
row: One inspection finding or violation the NRC issued at an operating reactor site under its Reactor Oversight Process.
time: event_date is the issue date (a date).
vintage_rule: A snapshot, written whole by each run from the NRC's workbook (updated at the same address).
keys:
- event_id
license: public
tier: source
interval: event
source:
- name: 'nrc:rop_findings_violations U.S. Nuclear Regulatory Commission, NRC Data, Reactor Oversight Process: Findings and
    Violations'
  url: https://www.nrc.gov/documents-reports/nrc-data
cite: 'U.S. Nuclear Regulatory Commission (NRC). NRC Data: Reactor Oversight Process findings and violations. Via the Energy
  Research Warehouse (ERW), table `nrc_rop_findings`.'
method: docs/methods/nrc_rop_findings.md
header_title: U.S. Nuclear Regulatory Commission, Reactor Oversight Process findings and violations, 18,240 findings at 66
  sites, issued 1999-07-29 to 2025-05-12 (session 2178)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id nrc_rop:<hash of the key fields>; event_date the issue date;
  event_type the NRC''s type (ncv, fin, vio, nov, ncviv, noviv, av); parties the site; entity_ids nrc_reactor:<docket>; status
  the significance color; x_ columns the NRC''s procedure, report, cornerstone, title, site code, cross-cutting aspect and
  area, identified by, region, accession, traditional enforcement, severity, cornerstone attribute, year, quarter and link.'
read:
  date: '2026-11-20'
  rows: 18240
  key_duplicates: 0
columns:
- name: event_id
  shared: true
  type: text
  values:
    distinct: more than 5000
    examples:
    - nrc_rop:000222b5adbf9c
    - nrc_rop:0003eb1212b4b0
    - nrc_rop:0005c1f6beeec2
    - nrc_rop:0006d2c6f89b70
    - nrc_rop:00098cbffd73ed
  missing_cells: 0
  particular: nrc_rop:<first 14 hex digits of a SHA-1 hash of docket, report number, issue date, procedure, title, type and
    cornerstone attribute>
- name: event_date
  shared: true
  type: date
  values:
    distinct: 3630
    earliest: '1999-07-29'
    latest: '2025-05-12'
  missing_cells: 0
- name: event_type
  shared: true
  type: text
  values:
    list:
      av: 49
      fin: 2320
      ncv: 14779
      ncviv: 107
      nov: 128
      noviv: 2
      vio: 855
  missing_cells: 0
  particular: 'The NRC''s type in lower case: ncv (non-cited violation), fin (finding), vio (violation), nov (notice of violation),
    ncviv and noviv (the same at severity IV), av (apparent violation)'
- name: parties
  shared: true
  type: text
  values:
    distinct: 66
    examples:
    - Arkansas Nuclear One
    - Beaver Valley
    - Braidwood
    - Browns Ferry
    - Brunswick
  missing_cells: 0
  particular: The site as the NRC names it
- name: entity_ids
