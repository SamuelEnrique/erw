# The codebook's metadata of table eia861_short_form (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: eia861_short_form
family: eia861
shape: series
row: One small utility's total revenue, sales or customers in one state and balancing authority, for one year, as it reported
  them on Form EIA-861S (the short form).
time: ts_utc is the data year's 1 January at 00:00:00Z (a year, not an instant); freq P1Y. EIA gives no short-form file for
  2019.
vintage_rule: A run reads the years given with --years and writes the table whole; vintage is not filled. EIA's aggregates
  88888 and 99999 left out; a '.' cell has no row.
keys:
- entity
- variable
- ts_utc
license: public
tier: source
interval: P1Y
source:
- name: eia:eia861:short_form U.S. Energy Information Administration, Form EIA-861 Annual Electric Power Industry Report (Short_Form_<year>.xlsx,
    Form EIA-861S)
