# The codebook's metadata of table utility_large_load_rules (warehouse/codebook/build_variables.py; chain 630).
# Read fields are rewritten from the table by the script; written fields (row, time, vintage_rule,
# label, unit, missing_meaning, source_name, documented_by, particular) are kept. Shared column names
# are defined in _shared.yaml.
table: utility_large_load_rules
family: utility
shape: events
row: One US utility's (or one state commission's) rule for connecting large loads, such as data centers, with its terms as
  the documents print them, read by the ERW's research pass of 13 November 2026.
time: event_date is a date (no time zone), the rule's status date as the documents print it, else the day the document was
  read (x_date_kind says which).
vintage_rule: Rewritten whole from the committed research file (utilities_2026-11-13.csv) by each run of the connector; no
  vintage column. Rows whose only source asks written permission are held and named in the header, not written.
keys:
- event_id
license: public
tier: model_extracted
interval: event
source:
- name: research:large_load_2026-11-13, docs/research/large_load/utilities_2026-11-13.csv (window P4 of the portable laptop,
    sessions 5300 to 5304; method https://github.com/SamuelEnrique/erw/blob/main/docs/research/large_load/README.md); each
    row's source_url is the document it was read in. No request is made by this connector.
  url: https://github.com/SamuelEnrique/erw/blob/main/docs/research/large_load/README.md
cite: US utilities, state commissions and legislatures, read by the ERW's research pass. Large-load rules, their changes and
  the states' laws (docs/research/large_load, 13 and 14 November 2026). Via the Energy Research Warehouse (ERW), table `utility_large_load_rules`.
method: docs/methods/large_load_research.md
header_title: US utilities' (and two state commissions') large-load connection rules, one row a rule (session 3937, chain
  267)
header_shape: 'Shape: events (docs/datastandard.md v0). event_id llrule:<row_id>; event_date the status date the documents
  print, else the day read (x_date_kind); event_type large_load_rule; parties the utility or commission; status ordered, proposed,
  approved, in effect, denied or withdrawn. Each x_<field> as printed with its x_<field>_cite (page or section and the words);
  ''not published'': the documents read do not state it. mw empty: the files print sizes as phrases (x_threshold_mw).'
