# ERCOT-scoped chat), five CAISO, five on the other grids, five cross-grid comparisons, five it must refuse (PJM's prices,
# a forecast, a year before the tables, MISO paused, a number no table holds). Every expected number was computed before
# any model call from the tables as the site reads them (Supabase, the anon key), on 19 October 2026 by
# runs/chain_oct19/s302_expect.py (not in git); each note names the table, the entity, the variable, the period and the
# aggregation. `via` is how the question is sent: panel (profile ercot, stream, the panel's context), grid (the grid's
# scoped chat) or general. Fields otherwise as in questions_s267.yaml. The recorded answers and the grades are in
# eval_s302_fixtures.json beside this file.
