# Energy Research Warehouse (ERW): 134 questions for the AI chat over the warehouse across the whole platform, sessions 5202 and 5251
# (chains 235 and 238, 13 November 2026): power, prices, gas, oil, nuclear, renewables, storage, transmission, projects, deals, policy and datacenters.
# 79 have an answer in the live set (kind figure); 14 ask of a table or a grid held for a license (hold: the hold's words, no
# figure); 2 of MISO's own rows (pause); 11 of a table of the record that is not loaded into the live set the chat reads
# (not_live: the answer says so); 20 of something no table holds (outside: "not in the warehouse", the missing thing named);
# 3 of a day a held series lacks (gap: "not in the warehouse", the day named); 5 of a window held in part (partial: the answer
# says the window is not whole, in any of the text entry's words).
# Every expected number was computed before any model call from the live set (Supabase, the anon key, reads only) on 2026-11-13 by
# scripts/ask_eval/platform_questions.py, which writes this file; each note names the table, the entity or filter, the variable and
# the aggregation. tolerance: 0.01 under 1,000, 0.5 from 1,000. A text entry with "|" is met by any one of its parts; count: true asks
# the figure apart from a clock time. A refusal key has no figure; hold: true marks a held table, whose answer carries the hold's words.
