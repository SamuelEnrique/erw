notes: "Distribution is a Customer Charge only ($999.11 per month); transmission is billed under the TSC rate schedule on the customer's peak load contribution to the PJM peak load, and generation under GSC-2, so no demand or energy charge is printed on LP-6. Applies to large load (data center) customers that commenced service on or after October 1, 2025, with a peak of 50 MW or greater at a single facility or at least 75 MW in the aggregate within a 10-mile radius at or above 69 kV; a 50 to 75 MW facility that causes no transmission network upgrade costs may be petitioned into Rate LP-5. Voluntary interruptible option: the minimum load guarantee falls to 60% for the first five years and 30% for the second five (page 111)."
terms:
  min_bill: {text: "Until the LP-6 customer's Rate Base Security Obligation is satisfied, the ESA will require the customer to pay applicable rates based on the greater of actual peak demand values, or 80% of the load provided in the load ramp schedule; after it ... 80% ... for the first (5) years of the initial term and 50% for the second five (5) years of the initial term", page: 111}
  collateral: {text: "The ESA will require the LP-6 customer to provide security in an amount equal to the cost of upgrades needed to serve the customer ... that are placed into rate base and recovered through transmission rates (such amount is referred to as the \"Rate Base Security Obligation\")", page: 110}
  exit_fee: {text: "The ESA will contain an exit fee that is equal to the remaining minimum load guarantee obligation during the ESA term at the time the customer terminates the ESA, or the remaining amount of the Rate Base Security Obligation, whichever is greater", page: 111}
  ramp: {text: "The ESA will require the customer to provide an initial load ramp schedule for up to the first five (5) years of the initial term", page: 110}
  term: {text: "The ESA will contain an initial term of not less than ten (10) years", page: 110}
