# Session 3761 (chain 211): read from the enrolled bill as the Alabama Legislature publishes it (SB 270 of the 2026 regular
# session, Act 2026-610, new Code of Alabama Section 37-4-22.1), the research file of 6 November 2026's Set C row 7 being the
# lead; saved under runs/license_reads/s3761/ (not in git). STATUS FRAMEWORK: a statute under which a utility's large-load
# data center contracts are reviewed by the Alabama PSC; it prints the threshold and the matters a contract covers (minimum
# term, upfront payments, security and collateral, minimum payment), no figure for any of them. Written against Alabama
# Power, the utility the research file names; the Act applies to any utility the PSC regulates. The PSC's contract review
# procedures adopted in October 2026 were not read.
