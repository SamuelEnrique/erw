notes: "Held for a license (ruling 4): epelectric.com's terms allow personal, noncommercial use; the PUCT's terms ask permission. Texas Service Area only. The rate requires the customer to meet Schedule No. 33 (Economic Development Rate Rider); the term is a ceiling, not a minimum (\"will not exceed five (5) years from date of initiation of service\"). Summer (June through September): demand $13.42 per kW, on-peak energy $0.15102 per kWh (12:00 P.M. to 6:00 P.M. Mountain Daylight Time, Monday to Friday), off-peak $0.00264 per kWh; Non-Summer: demand $10.53 per kW, $0.00264 per kWh in every hour. Fuel is billed under Schedule No. 98 (Fixed Fuel Factor), not in these charges. Displaced Load Service (Schedule No. GEP-A): demand $7.80 and $6.12 per kW, $231.25 a month, Renewable Energy Transmission Charge $0.00592 per kWh (page 2)."
