# Session 8007 (chain 501 part E): read whole by this session from Avista's own tariff book as the company posts it
# (wa_025.pdf, two pages: Schedule 25 on Twentieth Revision Sheet 25 and Schedule 25A on Sixteenth Revision Sheet 25A),
# read as the PDF's own text (saved under runs/c501/ai/raw/, sha256 b99feb90975b8bc08daf22459692c68e68e5ec3d3e9eaf2fbbbca5756779ff1c,
# not in git). Avista has paused large data center applications that need new transmission or generation and serves
# such loads by special contracts (chain 401's read); Schedule 25 is its largest standing schedule, so it is the
# schedule a large load would take without a special contract. myavista.com's robots file disallows only a few account
# paths (read 19 November 2026) and its policies page sets no limit on reuse (chain 401); public as PG&E's and PPL's
# books are (session 2921's question). The demand charge is printed per kVa, not per kW, so it is not written as a
# USD/kW-month figure (the words are in the notes); the threshold of 3,000 kVa likewise is not written as megawatts.
