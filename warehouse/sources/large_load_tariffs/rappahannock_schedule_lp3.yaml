notes: "The figures are the distribution delivery charges of section IV-A-3, open to every qualifying customer (A-1 and A-2 are closed: demand 1.68 and 2.77 USD/kW). Electricity supply is billed at the prevailing ODEC transmission level demand and energy rates adjusted for distribution losses, with an excess demand charge of 42.5% of ODEC's owned resources demand charge, so no supply price is printed. Distribution billing demand is the greater of the month's highest 15-minute kW or 500 kW. A facilities charge applies to dedicated local facilities (1.43% a month of installed cost for standard plant without a contribution, down to 0.82% with one). A customer may end its facilities contract by paying the unamortized value of the facilities plus removal."
