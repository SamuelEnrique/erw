# Session 7803 (chain 401 part D): read whole by this session from Rappahannock Electric Cooperative's own copy of
# Schedule LP-3 (Large Power Service LP-3.pdf, 4 pages, linked from myrec.coop's Electric Rates page, stamped "Accepted for
# filing, Division of Public Utility Regulation, VA State Corporation Commission, October 2, 2024"), read as the PDF's own
# text (saved under runs/c401/rec/, not in git). REC prints no schedule for loads of 100 MW or more; LP-3 is its largest
# transmission-level schedule (5,000 kW or more from a 138/34.5 kV substation, or at the low side of a wholesale substation
# fed at 34.5 kV or more), the chain's rule when no large-load schedule exists. Public: myrec.coop's robots file allows its
# pages, and its site's privacy policy, the one legal page it links, places no limit on reuse (read 18 November 2026). The
# Virginia State Corporation Commission is paused for the ERW (10 October 2026) and was not asked. Pages are the PDF's.
