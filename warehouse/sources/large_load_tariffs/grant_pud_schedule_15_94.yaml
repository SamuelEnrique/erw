# Session 7803 (chain 401 part D): read whole by this session from Public Utility District No. 2 of Grant County's own
# copies on grantpud.org's Rates & Fees page: Rate Schedule No. 15, Large Industrial Service (2026-Rate-Schedule-15.pdf,
# Resolution No. 9114, one page) and Rate Schedule No. 94, New Large Load Service (Sch_94_Jan_1_2016_-_Final.pdf,
# Resolution 8802, one page), with the definition of a New Large Load in its Customer Service Policy (effective 1 November
# 2026, page 8), read as the PDFs' own text (saved under runs/c401/grant/, not in git). A New Large Load is served only
# under Schedule 94, which sets the energy charge and keeps "all Demand Charges ... on the underlying Rate Schedule 14,
# 15, 16, or 85": for a load of 10 MW or more that is Schedule 15, so the figures are Schedule 15's and no energy charge
# is recorded. Public: Grant PUD is a public utility district set by its elected Commission; grantpud.org's robots file
# allows every agent but SemrushBot, and its statement of privacy, the one legal page it links, sets no reuse limit (read 18
# November 2026). Pages are the PDFs'.
