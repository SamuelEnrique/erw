notes: "Schedule 94 (https://www.grantpud.org/templates/galaxy/images/images/Downloads/Rates/NewLargeLoadService94/Sch_94_Jan_1_2016_-_Final.pdf): a New Large Load's monthly energy charge is the greater of the month's weighted average ICE Mid-C index price (peak and off-peak) or the largest energy block on Schedule 15, plus a 5% premium; its demand charges are those of the underlying schedule. Schedule 15's own energy charges (PRP 0.02548, incremental 0.00260 and temporary stabilization 0.00520 USD per kWh) apply to loads that are not New Large Loads. Billing demand is the larger of the contract demand or the month's highest 15-minute demand adjusted up to a 95 percent power factor. Customer Service Policy section 2.3: \"Service to New Large Loads will only be made pursuant to Rate Schedule No. 94\"; section 8 sets the large power application, inquiry form and fees."
