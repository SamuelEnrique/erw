# but /mobile/ is open to this reader; it disallows GPTBot by name, not ClaudeBot). PG&E's site links no terms of use on its
# tariff pages or in its sitemap (privacy pages only); each sheet is the CPUC-filed sheet itself ("Cal. P.U.C. Sheet No."),
# and the CPUC's documents are "in general ... in the public domain" (rules.json sources). Kept on this machine at
# runs/license_reads/s2921/07_*.bin. Pages are the PDF's, each one tariff sheet. Schedule B-20 is the schedule a new
# customer above 999 kW is placed on (Sheet 1); E-20 is kept only for solar legacy TOU customers. The totals of Sheet 4
# bundle generation, distribution and transmission, and the generation and summer demand charges are by time of use: only
# the two components printed as one figure a month for transmission voltage are written. The customer charge is printed
# per meter per day, a unit the registry does not take, so no fixed_charge is written.
