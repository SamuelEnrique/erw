notes: "A statute, not a tariff: a qualified electric utility and a large load customer negotiate a large load contract case by case (54-26-301(7)(b)), and the commission approves it within 60 days of the application (54-26-302(4)), its review limited to the requirements of 54-26-302(2), among them that existing ratepayers do not bear costs justly and reasonably attributable to providing electric service for the large load customer. Service under the chapter is for contracts providing service to commence on or before December 31, 2034 (54-26-801). No rate, term or collateral figure is printed."
