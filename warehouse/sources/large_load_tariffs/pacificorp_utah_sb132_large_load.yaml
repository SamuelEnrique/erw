# Session 3783 (chain 212): read from the enrolled copy of Utah's S.B. 132 of the 2025 General Session (new Utah Code Title
# 54 Chapter 26, Large-Scale Electric Service Requirements), as the Utah Legislature publishes it (le.utah.gov, robots
# allowing /~2025/bills/, crawl delay kept), the research file of 6 November 2026's Set C row on PacifiCorp / Rocky
# Mountain Power being the lead; saved under runs/license_reads/s3783/ (not in git). STATUS FRAMEWORK, as chain 211 wrote
# Alabama's Act 2026-610: a statute under which a qualified electric utility's large load contracts are negotiated case by
# case and approved by the Public Service Commission; it prints the threshold and the matters a contract covers, and no
# rate. Written against PacifiCorp (Rocky Mountain Power), the utility the research file names; the statute names none.
# Its steps and clocks are in the rules registry (large_load_connection_rules/utah_sb132_large_scale_electric_service.yaml).
# Rocky Mountain Power's large load flexible tariff (54-26-701) and the PSC's rule R746-318 were not read.
