notes: "Demand: the first 300 kW or less of firm billing demand 8,223.00 USD, all additional kW 21.08 USD/kW (less 0.70 USD/kW when the customer takes delivery at 69 kV or more and provides the transformation), excess on-peak demand 13.00 USD/kW more, and a coincident peak demand charge of 7.00 USD/kW. Energy: 0.0497 USD/kWh summer and winter on-peak, 0.0375 USD/kWh off-peak (plus an off-peak energy premium of 0.02287 USD/kWh for energy under the off-peak demand provision), with the fuel adjustment clause (FAC-25, Fb/Sb 0.03641 USD/kWh) and deferred cost recovery (DCR-25); no single energy charge is printed. The minimum firm billing demand factor is 100% for months 1 to 60, 95% for 61 to 120 and 90% after; the minimum coincident peak demand billing factor 50%, 65% and 80%. Before the service agreement the customer pays in full for delivery point and transmission costs (interconnection, network upgrades, redundant facilities). Experimental: available through no later than April 24, 2029; customers with loads of 100 MW or more are excluded from the 12% class size limit."
