terms:
  min_bill: {text: "the Company may require additional terms and conditions of electric service, including, without limitation, minimum billing requirements and a longer term of contract, when the Company deems it appropriate to ensure the Company recovers all costs associated with serving or preparing to serve a customer with an expected peak demand of 100 MW or greater at one or more premises located on one tract or contiguous tracts of land", page: 4}
  collateral: {text: "As a condition of serving or preparing to serve a customer or prospective customer with an expected peak demand of 100 MW or greater at one or more premises located on one tract or contiguous tracts of land, the Company may require and call upon those performance and credit provisions it deems appropriate to protect the Company and ensure the recovery of costs incurred by the Company in serving or preparing to serve the Customer", page: 16}
  exit_fee: {text: "A customer with an expected peak demand of 100 MW or greater at one or more premises located on one tract or contiguous tracts of land may be required by the Company, upon termination of its contract for electric service, to pay any costs the Company incurred in serving or preparing to serve the customer, including, but not limited to, distribution, transmission, and generation costs associated with the provision of electric service to the customer", page: 16}
