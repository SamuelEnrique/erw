notes: "The charges are NOVEC's distribution charges (Part B); energy supply (Part A) is bought from NOVEC under the Market Based Rate Option, \"to be determined on a case by case basis\", so no supply price is printed. Billing demand is the higher of the month's highest 30-minute kW or the contract minimum times the contract's ramp-up percentages; billing energy the higher of metered kWh or billing demand times the month's hours times 0.85. An rKVA charge of $0.16 per rKVA is printed beside the demand charge, and monthly fixed charge rates on contributed capital for excess facilities (0.442% high voltage line, 0.644% substation, 0.893% primary distribution). The minimum monthly distribution charge is the amount in the contract. Not for back-up or standby service. NOVEC announced a filing to update its terms and conditions in July 2026 (news release nr071726); this schedule is the one its Regulated Rates page links on 18 November 2026."
