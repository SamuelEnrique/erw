steps:
  - section: "proposed 25.252(c)(3), Interconnection agreement"
    page: 35
    step: a large load customer signs an interconnection agreement of at least twenty years (proposed)
    party: large load customer and TSP
    duration: 20
    unit: years
    printed: "An interconnection agreement for service with a term of not less than 20 years and that complies with 25.194 of this title (relating to Large Load Interconnection Standards) is required."
  - section: "proposed 25.252(d), TSP tariff requirements"
    page: 36
    step: the customer pays on its contracted peak demand for twenty years from the start of billing (proposed)
    party: large load customer
    duration: 20
    unit: years
    printed: "For the first 20 years after commencement of billing, the large load customer must complete 240 consecutive payments based on the greater of: (A) the large load customer's contracted peak demand; (B) the highest non-coincident peak demand placed by the large load customer on the system in the past year; or (C) the large load customer's 12CP demand"
  - section: "summary, billing before energization"
    page: 2
    step: billing begins when transmission capacity is available, whether or not the customer has energized (proposed)
    party: TSP
    printed: "irrespective of whether the large load customer has energized or is fully using available capacity"
