steps:
  - section: "R746-318-201(1)"
    page: 5
    step: the utility or generation provider files the executed large load contract with the Commission for approval
    party: utility or generation provider
    duration: 15
    unit: days
    printed: "Within 15 days of executing a large load contract, a qualified electric utility or large-scale generation provider shall file with the Commission an application for approval of the large load contract"
  - section: "R746-318-201(3)"
    page: 5
    step: a redacted copy of an application the utility is not party to is served on the utility the day it is filed
    party: large-scale generation provider
    printed: "An appropriately redacted version of the application for Commission approval of a large load contract to which the qualified electric utility is not a party shall be served upon the qualified electric utility on the same day an unredacted, complete version is filed with the Commission."
  - section: "R746-318-202(1)"
    page: 5
    step: the Commission approves or disapproves the large load contract
    party: Public Service Commission of Utah
    duration: 60
    unit: days
    printed: "The Commission shall approve or disapprove an application for approval of a large load contract within 60 days of the application being filed."
  - section: "R746-318-401(7)"
    page: 7
    step: a registered generation provider given a notice of deficiency has 90 days to remedy it, or its registration may be suspended or revoked
    party: large-scale generation provider
    duration: 90
    unit: days
    printed: "A notice of deficiency will allow the large-scale generation provider 90 days to remedy the deficiency and may impose reasonable conditions on the large-scale generation provider’s registration status during that 90-day period."
  - section: "R746-318-601(4)"
    page: 8
    step: the Commission conducts a limited and expedited review of a closed private generation contract (a load reaching 100 MW within five years)
    party: Public Service Commission of Utah
    mw: 100
    printed: "The Commission shall conduct a limited and expedited review and shall approve a private generation contract if the Commission finds: (a) the large-scale generation provider is registered with the Commission; (b) the large load customer is requesting service that is expected to reach a cumulative demand of 100 megawatts or greater within five years of the requested initial start date"
