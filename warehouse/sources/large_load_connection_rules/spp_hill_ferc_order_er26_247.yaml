    page: 8
    step: the customer returns the HILL Delivery Point Study Agreement with its fee and deposit
    party: Transmission Customer
    duration: 30
    unit: calendar days
    printed: "the Transmission Customer must return the HDPS Agreement, a $10,000 non-refundable application fee, and a $100,000 deposit to SPP within 30 calendar days, unless otherwise agreed upon"
  - section: "Attachment BA, 2.1.3.4, the HDPS completed"
    page: 8
    step: SPP completes the HILL Delivery Point Study and issues its report
    party: SPP
    duration: 90
    unit: calendar days
    printed: "Within 90 calendar days of receiving an executed HDPS Agreement, the study data, and deposit, SPP will complete the HDPS and issue a study report."
