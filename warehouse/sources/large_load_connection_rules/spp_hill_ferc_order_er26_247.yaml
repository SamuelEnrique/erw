    page: 14
    step: SPP validates a HILL Generation Assessment request
    party: SPP
    duration: 15
    unit: calendar days
    printed: "During the HILLGA Review Period, SPP will validate HILLGA Requests within 15 calendar days."
  - section: "Attachment BB, 8.3, deficiencies cured"
    page: 14
    step: the customer cures a request's deficiencies
    party: HILLGA Customer
    duration: 10
    unit: business days
    printed: "the HILLGA Customer will then have 10 business days to cure any deficiencies."
