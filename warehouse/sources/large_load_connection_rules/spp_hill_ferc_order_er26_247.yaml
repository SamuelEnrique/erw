steps:
  - section: "Attachment BA, the HILL definition, at 69 kV or below"
    page: 5
    step: a load at 69 kV or below becomes a High Impact Large Load
    party: Transmission Customer
    mw: 10
    printed: "where such load is either (1) 10 MW or more if connected to the Transmission System at a voltage level less than or equal to 69 [kilovolts (kV)]"
  - section: "Attachment BA, the HILL definition, above 69 kV"
    page: 5
    step: a load above 69 kV becomes a High Impact Large Load
    party: Transmission Customer
    mw: 50
    printed: "or (2) 50 MW or more if connected to the Transmission System at a voltage level greater than 69 kV"
