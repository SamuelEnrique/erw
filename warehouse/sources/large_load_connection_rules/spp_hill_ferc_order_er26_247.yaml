    page: 14
    step: SPP conducts the HILLGA system impact study
    party: SPP
    duration: 90
    unit: calendar days
    printed: "SPP proposes to conduct a system impact study for HILLGA Requests within 90 calendar days of the HILLGA Review Period."
  - section: "Attachment BB, 8.8, a restudy noticed"
    page: 14
    step: SPP notifies the customer that a restudy is needed
    party: SPP
    duration: 30
    unit: calendar days
    printed: "SPP will notify the HILLGA Customer of the need for a restudy within 30 calendar days"
  - section: "Attachment BB, 8.8, a restudy completed"
    page: 14
    step: SPP completes the restudy after its notice
    party: SPP
    duration: 60
    unit: calendar days
    printed: "and will complete the restudy within 60 calendar days after the notification."
  - section: "Attachment BB, the HILLGIA negotiated"
    page: 14
    step: the customer, the transmission owner and SPP negotiate the HILL generator interconnection agreement
    party: HILLGA Customer, transmission owner and SPP
    duration: 45
