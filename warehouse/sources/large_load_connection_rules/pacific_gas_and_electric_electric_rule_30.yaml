    page: 6
    step: PG&E sends the affected CCA a copy of the application
    party: PG&E
    duration: 20
    unit: business days
    printed: "PG&E will provide the affected CCA a copy of the application within twenty (20) business days of receipt"
  - section: "Sheet 11, b."
    page: 11
    step: the Applicant pays an invoice of PG&E's actual costs
    party: Applicant
    duration: 45
    unit: calendar days
    printed: "Applicant shall pay all invoiced amounts within forty-five (45) calendar days after receipt of PG&E's invoice"
