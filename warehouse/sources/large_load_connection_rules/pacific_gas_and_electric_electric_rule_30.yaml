steps:
  - section: "A.1.b.1)"
    page: 1
    step: PG&E keeps a project's construction and design standards fixed after its application is approved
    party: PG&E
    duration: 18
    unit: months
    printed: "PG&E will apply only those construction and design specifications, standards, terms, and conditions that are applicable to a new project under this Rule for the 18 months following the date an Applicant's application is approved."
