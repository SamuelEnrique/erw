    page: 22
    step: the Applicant's application forecasts its load for the facilities' first years in service
    party: Applicant
    duration: 10
    unit: years
    printed: "Applicant shall provide to PG&E in its application for service a forecast of expected load for the first ten (10) years that the Transmission Facilities are in service."
